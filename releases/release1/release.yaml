notes:
- Draft release envelope created during migration Phase 2.
- Beckn dependencies were vendored and the offline reference graph was closed during
  Phase 4.
- Standalone Trade and Trade-required common packs, JSON-LD files, and examples were
  validated during Phase 5.
- Release 1 contains standalone Trade and its required common packs plus Logistics
  material under independent review. The unreconciled ion.yaml aggregate and the Hospitality
  and Finance sectors are explicitly excluded.
- Phase 8A initially included the Storefront v1 flow, 67 Trade or cross-sector policy
  terms, and 8 Trade errors. Later Trade phases expanded this to seven reference flows,
  the During-Transaction v1 variant, and 10 Trade errors.
- Logistics Phase 5 added 22 reviewed draft terms to the shared registry, bringing
  it to 89 terms. These terms are resolvable but are not ratified or effective.
- Logistics Phase 6 added six patterns and nine included or scoped variants. Phase
  7 reviewed all 97 legacy errors, included 30 connected errors under the ION-Bxxxx
  convention, and explicitly deferred 67.
- Logistics Phase 8 passed the complete schema-directory and example-object validator
  runs, connection checks, source-disposition closure, and the full Release 1 gate.
  Logistics is validated; the release itself remains draft.
- The Beckn Protocol contract was initially copied without changes from upstream
  file commit df1ade0c6610d4160968177a706f32df680e4758 to
  schema/core/api/v2.0.0/ion-beckn.yaml as the ION-maintained contract. ION then
  corrected DiscoverAction.matchType.default from `any` to the declared enum
  value `ANY` and corrected the /catalog/publish example's offer validity values
  to RFC 3339 date-times. ION then integrated the beckn.yaml changes proposed in
  Beckn pull request 202, making asynchronous callback envelopes carry exactly
  one of message or error. Active references use this path; the immutable
  vendored file remains temporarily for compatibility with its existing URL.
- Schema content groups core, common, extension, and vendored below schema/ rather
  than flattening them at the release root.
- Draft URLs are unsupported until the release is published.
