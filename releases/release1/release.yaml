notes:
- Draft release envelope created during migration Phase 2.
- Beckn dependencies were vendored and the offline reference graph was closed during
  Phase 4.
- Standalone Trade and Trade-required common packs, JSON-LD files, and examples were
  validated during Phase 5.
- Release 1 is scoped to standalone Trade and its required common packs. The unreconciled
  ion.yaml aggregate and the Logistics, Hospitality, and Finance sectors are explicitly
  excluded.
- Phase 8A includes only the Storefront v1 flow, 67 Trade or cross-sector policy terms,
  and 8 Trade errors whose targets are present in this release.
- Other Trade flows and their dependent errors remain non-normative working material
  for consideration in a future integer release.
- Schema content groups core, common, extension, and vendored below schema/ rather
  than flattening them at the release root.
- Draft URLs are unsupported until the release is published.
