openapi: 3.1.1
info:
  title: ION (Indonesia Open Network) — Network Extension Specification
  description: "ION — Indonesia Open Network. Single-file network extension specification.\n\nRELATIONSHIP TO BECKN:\nThis\
    \ file EXTENDS Beckn Protocol v2.0.0. It does NOT copy or embed Beckn.\nEvery reference to a Beckn type uses $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/...\
    \ pointing to the\nlocal copy at releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml.\nWhen Beckn releases a new version, only beckn.yaml\
    \ needs updating.\n\nWHAT THIS FILE CONTAINS:\n- L2: ION network profile (x-ion-profile block) — signing rules, regulatory\n\
    \  requirements, payment rails, conformance matrix for Indonesia\n- L3: ION protocol endpoint extensions — /raise family\
    \ (6 endpoints) and\n  /reconcile + /on_reconcile (2 endpoints). These 8 endpoints extend the\n  30 core Beckn endpoints.\
    \ Beckn's 30 endpoints live in beckn.yaml only.\n- L4: ION core attribute packs — cross-sector extensions that mount on\n\
    \  Beckn's *Attributes slots (address, identity, payment, tax, participant,\n  product, localization, rating, support,\
    \ raise, reconcile)\n- L5: ION sector attribute packs — trade and logistics extensions that mount\n  on the same *Attributes\
    \ slots for sector-specific fields\n\nEXTENSION CONTRACT:\nEvery L4/L5 schema carries x-beckn-attaches-to naming the Beckn\
    \ *Attributes\nslot it mounts onto. Every schema allOf's with\nhttps://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Attributes to inherit @context/@type\n\
    requirements. This is what makes ION a non-forking extension of Beckn.\n\nCROSS-SCHEMA CONDITIONAL RULES:\nFive rules\
    \ whose trigger field lives in a different schema bag than the\nrequired field are declared in x-ion-conditional-rules\
    \ below. Standard\nJSON Schema if/then/else cannot express cross-bag conditions. ONIX\n(the ION validator) enforces these\
    \ at network boundaries.\n\nVALIDATOR USAGE:\nRun beckn.yaml + ion.yaml together through any OpenAPI 3.1.1 validator.\n\
    Do not merge them — they are designed to be used as two separate files.\n\nBECKN v2.0 TERMINOLOGY:\nThis spec targets Beckn v2.0.0 LTS. Key terminology changes from earlier versions:\n- resources[] replaces the legacy items[] array. Do NOT use items[].\n- performance[] replaces fulfillments[] in Contract. Do NOT use fulfillments[].\n- Consumer Node (CN) replaces BAP. Provider Node (PN) replaces BPP.\n  Wire-level field names bapId/bapUri/bppId/bppUri are RETAINED for backward compatibility.\n\nPARTICIPANT EXCEPTION:\nBeckn v2.0 Participant has no participantAttributes wrapper. IONParticipant and\nLogisticsAgent fields attach as DIRECT PROPERTIES on the Participant object — not\ninside a participantAttributes bag. This is the single exception to the\n*Attributes container pattern. See core/participant/v1 and logistics/agent/v1.\n\n@CONTEXT AND @TYPE PLACEMENT RULE:\n@context and @type belong ONLY on *Attributes extension containers and the top-level\nContract object. Specifically, ONLY these fields carry @context and @type:\n  Resource.resourceAttributes, Offer.offerAttributes, Provider.providerAttributes,\n  Commitment.commitmentAttributes, Consideration.considerationAttributes,\n  Performance.performanceAttributes, Settlement.settlementAttributes,\n  Contract.contractAttributes, Tracking.trackingAttributes,\n  RatingInput.target.targetAttributes, Support.channels[]\n\nCore Beckn objects — Descriptor, Location, Catalog, Resource, Offer, Commitment,\nConsideration, Performance, Participant, Entitlement, Contract — MUST NOT carry\n@context or @type directly. Any ION schema or example that places @context/@type\non a non-Attributes object is non-conformant and MUST be corrected."
  version: 0.7.0-draft
  contact:
    name: ION Network
    url: https://schema.ion.id
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
