    customAddendumMaxChars: 1000
    resolverApi:
      getPolicy:
        method: GET
        path: /policies/{iri}
        description: Resolve a policy IRI to its full structured terms document
        iriEncoding: URL_ENCODED
      listPolicies:
        method: GET
        path: /policies
        description: List/filter the registry
        filters:
        - category
        - applicableCategory
        - subCategory
    enforcementPoints:
      atCatalogPublish:
        description: Every policy IRI validated against ratified registry
        errors:
        - ION-2010
        - ION-2011
      atRuntime:
        description: Actions checked against declared policy terms
        errors:
        - ION-5001
        - ION-5002
        - ION-5003
        - ION-5004
        - ION-5008
        - ION-5009
      atReconcile:
        description: Penalty policies fire as deductions per linked IRI
        info: ION-6003
x-ion-conditional-rules:
  version: 1.0.0
  description: 'Cross-schema conditional requirements for ION. Each rule declares: when a trigger field (in the same composed
    Attributes bag at runtime) takes a given value, a field on the named schema becomes required. JSON Schema if/then/else
    cannot express these because the trigger field lives in a different schema that is composed at runtime. ONIX (the ION
    network validator) enforces these rules at every API boundary.

    '
  enforcedBy: ONIX
  rules:
  - schema: IONLogisticsAgent
    field: driverLicenceCategory
    triggerSchema: IONParticipant
    triggerField: role
    triggerValue: DRIVER
    condition: Required when role=DRIVER
  - schema: IONLogisticsAgent
    field: driverLicenceNumber
    triggerSchema: IONParticipant
    triggerField: role
    triggerValue: DRIVER
    condition: Required when role=DRIVER (roro, freight, hyperlocal)
  - schema: IONLogisticsAgent
    field: ppjkLicenceNumber
    triggerSchema: IONParticipant
    triggerField: role
    triggerValue: CUSTOMS_BROKER
    condition: Required when role=CUSTOMS_BROKER
  - schema: TradeConsideration
    field: codAmount
    triggerSchema: PaymentDeclaration
    triggerField: paymentRail
    triggerValue: COD
    condition: Required when paymentRail=COD
  - schema: IONTaxDetail
    field: eFakturRef
    triggerSchema: IONBusinessRegistration
    triggerField: pkpStatus
    triggerValue: PKP
    condition: Required for PKP sellers when invoiceType=TAX_INVOICE
servers:
- url: https://{subscriberUrl}
  description: ION Network participant base URL. {subscriberUrl} is the registered FQDN of the BAP/BPP per the ION Registry
    on dedi.global.
  variables:
    subscriberUrl:
      default: example.ion.id
      # description: Registered subscriber URL of the ION Network participant.
security: []
paths:
  /raise:
    post:
      summary: Raise a commercial dispute to the ION network for adjudication
      description: 'ION EXTENSION. Not in Beckn 2.0 core. Either BAP or BPP submits a dispute to the ION Gateway when bilateral
        resolution via /update has exceeded the policy-defined SLA. The ION Gateway routes to the appropriate ION adjudication
        service.

        '
      operationId: raise
      tags:
      - ION Extensions — Escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  allOf:
                  # LOCAL (default — active):
