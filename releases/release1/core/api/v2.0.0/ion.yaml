                message:
                  $ref: '#/components/schemas/RaiseStatusAction'
      responses:
        '200':
          description: Ack
          content:
            application/json:
              schema:
                # LOCAL (default — active):
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Ack
                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /on_raise_status:
    post:
      summary: Callback — current ticket status and stage
      description: ION EXTENSION.
      operationId: onRaiseStatus
      tags:
      - ION Extensions — Escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  allOf:
                  # LOCAL (default — active):
                  - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context
                  # REMOTE (uncomment to use upstream directly):
                  # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Context
                  - type: object
                    properties:
                      action:
                        type: string
                        const: on_raise_status
                message:
                  $ref: '#/components/schemas/OnRaiseStatusAction'
      responses:
        '200':
          description: Ack
          content:
            application/json:
              schema:
                # LOCAL (default — active):
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Ack
                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /raise_details:
    post:
      summary: Request full ticket thread
      description: ION EXTENSION. Request the full dispute thread with all messages and evidence.
      operationId: raiseDetails
      tags:
      - ION Extensions — Escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  allOf:
                  # LOCAL (default — active):
                  - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context
                  # REMOTE (uncomment to use upstream directly):
                  # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Context
                  - type: object
                    properties:
                      action:
                        type: string
                        const: raise_details
                message:
                  $ref: '#/components/schemas/RaiseDetailsAction'
      responses:
        '200':
          description: Ack
          content:
            application/json:
              schema:
                # LOCAL (default — active):
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Ack
                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /on_raise_details:
    post:
      summary: Callback — full ticket thread with messages and evidence
      description: ION EXTENSION.
      operationId: onRaiseDetails
      tags:
      - ION Extensions — Escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  allOf:
                  # LOCAL (default — active):
                  - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context
                  # REMOTE (uncomment to use upstream directly):
                  # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Context
                  - type: object
                    properties:
                      action:
                        type: string
                        const: on_raise_details
                message:
                  $ref: '#/components/schemas/OnRaiseDetailsAction'
      responses:
        '200':
          description: Ack
          content:
            application/json:
              schema:
                # LOCAL (default — active):
