      38 business categories across 6 sectors. Category codes are used at
      participant onboarding to classify the organisation's business activity.
      They determine which regulatory obligations apply and which patterns are
      eligible. Full descriptions and pattern eligibility in docs/ION_Entity_Hierarchy_Model.md.
    categories:
      # Trade (TRD) — 7 categories
      - code: TRD-01
        name: Grocery, FMCG & Quick Commerce
        sector: trade
      - code: TRD-02
        name: E-commerce & Digital Marketplaces
        sector: trade
      - code: TRD-03
        name: Specialty Retail
        sector: trade
      - code: TRD-04
        name: Pharmacy & Health Retail
        sector: trade
      - code: TRD-05
        name: Automotive Sales & Parts
        sector: trade
      - code: TRD-06
        name: Wholesale & Supply Trade
