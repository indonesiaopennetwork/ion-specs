                    properties:
                      action:
                        type: string
                        const: raise
                message:
                  $ref: '#/components/schemas/RaiseAction'
      responses:
        '200':
          description: Ack — ticket accepted for processing
          content:
            application/json:
              schema:
                # LOCAL (default — active):
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Ack
                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /on_raise:
    post:
      summary: Callback — ticket ID and expected resolution timeline
      description: ION EXTENSION. ION Gateway returns ticket ID and expected resolution timeline.
      operationId: onRaise
