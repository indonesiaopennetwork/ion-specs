        '@type': ion:TradeOffer
      x-beckn-attaches-to: Offer.offerAttributes
      x-ion-layer: generic
      x-ion-split-note: >
        GAP 4 / v0.7.0 two-schema split. This aggregate keeps the full merged offer
        schema under TradeOffer for validator convenience. The authoritative extension
        pack defines TradeOffer as the generic layer and IONTradeOffer as the ION-specific
        layer. ION policy registry, Indonesian payment, and network-policy fields belong
        to IONTradeOffer and must not be treated as generic TradeOffer properties.
      properties:
        policies:
          allOf:
            - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies
            - type: object
