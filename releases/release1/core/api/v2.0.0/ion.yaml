                  - type: object
                    properties:
                      action:
                        type: string
                        const: on_raise
                message:
                  $ref: '#/components/schemas/OnRaiseAction'
      responses:
        '200':
          description: Ack
          content:
            application/json:
              schema:
                # LOCAL (default — active):
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Ack
                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /raise_status:
    post:
      summary: Query current dispute ticket status
      description: ION EXTENSION. Poll for ticket status by ID.
      operationId: raiseStatus
      tags:
      - ION Extensions — Escalation
      requestBody:
        required: true
