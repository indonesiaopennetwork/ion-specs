  x-ion-semantic-model:
    currentAuthoritative: openapi
    targetAuthoritative: json-ld
    transitionPlan: docs/ION_Semantic_Model_Transition.md
    vocabularyRoot: https://schema.ion.id/
    schemaLayerModel:
      description: >
        Every L4/L5 schema pack has two layers introduced in v0.7.0.
        Generic layer uses upstream beckn/schemas IRI namespace.
        ION layer uses schema.ion.id IRI namespace and inherits from generic via allOf.
      genericLayerIriPattern: https://spec.beckn.io/vocab/v2.0.0#{GenericSchemaName}
      ionLayerIriPattern: https://schema.ion.id/{sector}/{pack}/{version}#{IONSchemaName}
      activeAttachmentLayer: ion
    urlPattern:
      packRoot: https://schema.ion.id/{sector}/{pack}/{version}/
      termIri: https://schema.ion.id/{sector}/{pack}/{version}#{term}
      contextJson: https://schema.ion.id/{sector}/{pack}/{version}/context.jsonld
      vocabJson: https://schema.ion.id/{sector}/{pack}/{version}/vocab.jsonld
      openapiYaml: https://schema.ion.id/{sector}/{pack}/{version}/attributes.yaml
      humanHtml: https://schema.ion.id/{sector}/{pack}/{version}/
    contentNegotiation:
      application/ld+json: context.jsonld (or vocab.jsonld under /vocab path)
      application/json: context.jsonld
      application/yaml: attributes.yaml
      text/turtle: vocab.ttl (v0.7+)
      default: text/html
    allowedContexts:
    - prefix: ion
      namespace: https://schema.ion.id/
      description: ION's own vocabulary — ION layer schemas, policies, states, error categories
      status: authoritative
    - prefix: beckn
      namespace: https://spec.beckn.io/vocab/v2.0.0#
      description: Beckn core transport and object-model types; also the IRI namespace for generic layer schemas
      status: authoritative
    crossNetworkMappings:
      status: none-ratified-yet
      publishedUnder: https://schema.ion.id/mappings/
      ratificationRequired: true
    x-ion-deprecated-names:
      description: >
        Schema names that were renamed in v0.7.0. Each entry carries an owl:sameAs
        pointer to the conformant replacement. Consumers resolving old IRIs MUST
        follow the sameAs chain to the new name.
      renames:
        - oldName: IONBusinessIdentity
          newName: IONBusinessRegistration
          owl:sameAs: https://schema.ion.id/core/business-registration/v1#IONBusinessRegistration
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
        - oldName: IONProductCertifications
          newName: IONProductCompliance
          owl:sameAs: https://schema.ion.id/core/product-compliance/v1#IONProductCompliance
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
        - oldName: LogisticsParticipantAddendum
          newName: IONLogisticsAgent
          owl:sameAs: https://schema.ion.id/logistics/agent/v1#IONLogisticsAgent
          renamedIn: 0.7.0
          reason: Non-standard suffix 'Addendum' — renamed per NFH-012 naming rules
        - oldName: LogisticsShipment
          newName: LogisticsResource
          owl:sameAs: https://schema.ion.id/logistics/resource/v1#LogisticsResource
          renamedIn: 0.7.0
          reason: Aligned with schemaPacks entry logistics/resource per GAP 8
        - oldName: CreditContractAttributes
          newName: CreditContract
          owl:sameAs: https://schema.ion.id/finance/contract/v1#CreditContract
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
        - oldName: CreditOfferAttributes
          newName: CreditOffer
          owl:sameAs: https://schema.ion.id/finance/offer/v1#CreditOffer
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
        - oldName: ActiveLoanTerms
          newName: LoanTerms
          owl:sameAs: https://schema.ion.id/finance/contract/v1#LoanTerms
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
        - oldName: FnbMenuItem
          newName: FnbItem
          owl:sameAs: https://schema.ion.id/hospitality/menu-item/v1#FnbItem
          renamedIn: 0.7.0
          reason: Three-component name — renamed per NFH-012 naming rules
