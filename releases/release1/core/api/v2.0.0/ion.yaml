components:
  schemas:
    RaiseAction:
      type: object
      required:
      - ticket
      additionalProperties: false
      properties:
        ticket:
          $ref: '#/components/schemas/DisputeTicket'
    DisputeTicket:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - type
      - priority
      - contractReference
      - applicablePolicyIri
      properties:
        id:
          type: string
          description: Ticket ID — assigned by ION Gateway on /on_raise. Not set on /raise.
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        type:
          type: string
          enum:
          - WEIGHT_DISCREPANCY
          - DAMAGE_CLAIM
          - LOSS_CLAIM
          - SLA_BREACH
          - COD_REMITTANCE_FAILURE
          - FWA_TERM_VIOLATION
          - EKYC_DISPUTE
          - CUSTOMS_DUTY_DISPUTE
          - GENERAL_COMMERCIAL
          - SECURITY_INCIDENT
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        contractReference:
          type: string
          description: Contract.id of the contract in dispute
        applicablePolicyIri:
          type: string
          format: iri
          description: ion://policy/... IRI specifying the resolution regime
        bilateralAttemptLog:
          type: array
          description: Log of bilateral resolution attempts via /update before escalating
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              messageId:
                type: string
              summary:
                type: string
              outcome:
                type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - PHOTO
                - DOCUMENT
                - MESSAGE_LOG
                - SIGNATURE
                - GPS_TRACE
                - OTHER
              url:
                type: string
                format: uri
              description:
                type: string
        status:
          type: string
          description: Ticket status — set by ION Gateway
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - EVIDENCE_REQUESTED
          - ADJUDICATION_IN_PROGRESS
          - RESOLVED_IN_FAVOUR_OF_BAP
          - RESOLVED_IN_FAVOUR_OF_BPP
          - RESOLVED_PARTIAL
          - CLOSED_WITHOUT_ADJUDICATION
        stage:
          type: string
        expectedResolutionTimeline:
          type: string
          format: duration
        resolutionNotes:
          type: string
    OnRaiseAction:
      type: object
      required:
      - ticket
      additionalProperties: false
      properties:
        ticket:
          $ref: '#/components/schemas/DisputeTicket'
    RaiseStatusAction:
      type: object
      additionalProperties: false
      required:
      - ticket
      properties:
        ticket:
          type: object
          required:
          - id
          properties:
            id:
              type: string
    OnRaiseStatusAction:
      type: object
      additionalProperties: false
      required:
      - ticket
      properties:
        ticket:
          $ref: '#/components/schemas/DisputeTicket'
    RaiseDetailsAction:
      type: object
      additionalProperties: false
      required:
      - ticket
      properties:
        ticket:
          type: object
          required:
          - id
          properties:
            id:
              type: string
    OnRaiseDetailsAction:
      type: object
      additionalProperties: false
      required:
      - ticket
      properties:
        ticket:
          allOf:
          - $ref: '#/components/schemas/DisputeTicket'
          - type: object
            properties:
              thread:
                type: array
                description: All messages exchanged on this ticket
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    from:
                      type: string
                    message:
                      type: string
                    attachments:
                      type: array
                      items:
                        type: object
    ReconcileAction:
      type: object
      required:
      - contract
      additionalProperties: false
      properties:
        contract:
          allOf:
          # LOCAL (default — active):
          - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Contract
          # REMOTE (uncomment to use upstream directly):
          # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Contract
          - required:
            - id
            - settlements
    OnReconcileAction:
      type: object
      required:
      - contract
      additionalProperties: false
      properties:
        contract:
          allOf:
          # LOCAL (default — active):
          - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Contract
          # REMOTE (uncomment to use upstream directly):
          # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Contract
          - required:
            - id
            - settlements
    IONAddressSubdivisions:
      type: object
      title: Indonesia Address Subdivisions
      additionalProperties: true
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:AddressSubdivisions
      x-beckn-attaches-to: (reusable shape — embedded inside participantAttributes.addressDetail, providerAttributes.availableAt[*].ionSubdivisions,
        performanceAttributes.stops[*].location.ionSubdivisions)
      properties:
        provinsiCode:
          type: string
          enum:
          - BPS-11
          - BPS-12
          - BPS-13
          - BPS-14
          - BPS-15
          - BPS-16
          - BPS-17
          - BPS-18
          - BPS-19
          - BPS-21
          - BPS-31
          - BPS-32
          - BPS-33
          - BPS-34
          - BPS-35
          - BPS-36
          - BPS-51
          - BPS-52
          - BPS-53
          - BPS-61
          - BPS-62
          - BPS-63
          - BPS-64
          - BPS-65
          - BPS-71
          - BPS-72
          - BPS-73
          - BPS-74
          - BPS-75
          - BPS-76
          - BPS-81
          - BPS-82
          - BPS-91
          - BPS-92
          - BPS-94
          description: 'Indonesian province code using BPS 2-digit numeric codes prefixed with BPS-. 34 provinces. Used for
            serviceability, tax zone determination, and logistics pricing.

            '
          example: BPS-31
          x-ion-regulatory: Permendagri 72/2019 tentang Perubahan atas Permendagri 137/2017
        kabupatenCode:
          type: string
          pattern: ^[0-9]{4}$
          description: 'BPS 4-digit kabupaten/kota code. 514 kabupaten and kota in Indonesia. Used for granular serviceability
            and tax zone resolution.

            '
          example: '3171'
          x-ion-regulatory: Permendagri 72/2019
        kelurahan:
          type: string
          description: 'Village or urban administrative zone (kelurahan/desa). Required for precise last-mile delivery address.

            '
          example: Gambir
          x-ion-conditional: true
          x-ion-condition: Required for delivery addresses
        kecamatan:
          type: string
          description: 'District or sub-city (kecamatan). Administrative level between kabupaten and kelurahan.

            '
          example: Gambir
          x-ion-conditional: true
          x-ion-condition: Required for delivery addresses
        rt:
          type: string
          description: 'Rukun Tetangga — neighborhood group, typically ~40 households. Critical for last-mile delivery in
            Indonesia — riders use RT/RW to locate specific houses in dense residential areas.

            '
          example: '02'
        rw:
          type: string
          description: 'Rukun Warga — association of RTs, typically ~400 people. Used together with RT for precise address
            resolution.

            '
          example: '03'
        postalCode:
          type: string
          pattern: ^[0-9]{5}$
          description: 'Indonesian kodepos (postal code). 5 digits. Distinct from Beckn core area_code which conflates many
            country-specific codes.

            '
          example: '12190'
          x-ion-regulatory: PermenKomInfo — Standar Kodepos Nasional
        addressType:
          type: string
          enum:
          - HOME
          - OFFICE
          - APARTMENT
          - BOARDING_HOUSE
          - WAREHOUSE
          - PO_BOX
          - PICKUP_POINT
          - OTHER
          description: 'Address classification. Affects delivery SLA and surcharges — offices have restricted delivery hours,
            apartments require lobby/concierge handling, warehouses accept larger shipments. BOARDING_HOUSE (kost) is common
            in Indonesian urban delivery.

            '
          example: HOME
        receiverInstructions:
          type: string
          maxLength: 500
          description: 'Instructions for delivery receiver. Distinct from buyerInstructions — used for gift orders where receiver
            != buyer, and for handover preferences (leave at door, signature required, call first).

            '
          example: Tinggalkan di pos satpam apartemen. Jangan ketuk pintu.
        gpsAccuracyMeters:
          type: number
          minimum: 0
          description: 'Accuracy of GPS coordinate in metres. Required for pin-point delivery addresses in unaddressed areas
            (kampung, peri-urban). Affects agent last-mile routing.

            '
          example: 10
        landmark:
          type: string
          description: 'Notable nearby landmark for finding the address. Common in Indonesian urban delivery where street
            numbering is inconsistent.

            '
          example: Sebelah Indomaret, seberang masjid
        blockUnit:
          type: string
          description: 'Block/unit identifier for apartments and complexes. Beckn core ''door'' captures house number; this
            captures block/floor/unit where applicable.

            '
          example: Blok A3 Lantai 12 Unit 05
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
      x-ion-closed-extensions: false
      # REMOTE (uncomment to use upstream directly):
      # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Attributes
    IONBusinessRegistration:
      type: object
      title: Indonesia Business Identity
      description: >
        Indonesian legal business registration and tax identity for a Provider Node (PN/BPP) operating
        on the ION network. Produced by the merchant or logistics provider at onboarding and
        re-validated by ONIX at every /on_confirm boundary. Consumed by Consumer Nodes (CNs/BAPs) to
        verify merchant legitimacy, by the ION settlement layer to determine tax withholding obligations,
        and by ONIX to enforce Indonesian regulatory requirements (PMK 136/2023 tax compliance, PP
        24/2018 OSS business licensing, UU 27/2022 PDP data residency). Extends beckn.yaml Attributes;
        mounts onto Provider.providerAttributes as a composed extension. Upstream parent: Participant
        v2.0 (schema.beckn.io). ION-native fields: all — this schema has no generic layer counterpart
        in the extension pack sense; it IS the ION-specific layer for provider identity.
      additionalProperties: true
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:BusinessIdentity
      x-beckn-attaches-to: Provider.providerAttributes (composed)
      properties:
        npwp:
          type: string
          pattern: ^[0-9]{16}$
          description: 'Nomor Pokok Wajib Pajak — 16-digit tax identification number. New format post-2024 (previously 15
            digits). Required for all registered sellers on ION. Validated against DJP registry.

            '
          example: '1234567890123456'
          x-ion-regulatory: PMK 136/2023 tentang Perubahan atas PMK No 112/PMK.03/2022
        nib:
          type: string
          pattern: ^[0-9]{13}$
          description: 'Nomor Induk Berusaha — 13-digit business registration number issued by OSS (Online Single Submission).
            Mandatory for all ION network participant sellers.

            '
          example: '1234567890123'
          x-ion-regulatory: PP 5/2021 tentang Penyelenggaraan Perizinan Berusaha Berbasis Risiko
        nikNumber:
          type: string
          pattern: ^[0-9]{16}$
          description: 'Nomor Induk Kependudukan — 16-digit national identity number from e-KTP. Required for individual (non-business)
            sellers.

            '
          example: '3271012345678901'
          x-ion-regulatory: UU 24/2013 tentang Administrasi Kependudukan
          x-ion-condition: Required for individual sellers (businessType=PERORANGAN)
        pkpStatus:
          type: string
          enum:
          - PKP
          - NON_PKP
          description: 'PKP = Pengusaha Kena Pajak (VAT-registered, can issue Faktur Pajak). NON_PKP = non-VAT-registered
            (cannot issue Faktur Pajak). PKP sellers are mandated once turnover exceeds IDR 4.8 billion/year.

            '
          example: PKP
          x-ion-regulatory: UU 8/1983 tentang Pajak Pertambahan Nilai Pasal 3A
        legalEntityName:
          type: string
          description: 'Registered business name as per OSS/notary deed. For PT: "PT Nama Perusahaan Tbk". For UD/CV: "UD
            Nama Usaha". For individual: full name as per KTP.

            '
          example: PT Paragon Technology and Innovation
        businessType:
          type: string
          enum:
          - PT
          - CV
          - UD
          - FIRMA
          - KOPERASI
          - YAYASAN
          - PERORANGAN
          - LAINNYA
          description: 'Legal entity type. PT=Limited company, CV=Commanditaire Vennootschap, UD=Usaha Dagang, PERORANGAN=Individual.

            '
          example: PT
        siupNumber:
          type: string
          description: 'Surat Izin Usaha Perdagangan — business trade license. Legacy field, being replaced by NIB under OSS
            but still referenced by some regulatory frameworks.

            '
          example: SIUP.3201.001.2024
        spPIRTNumber:
          type: string
          description: 'SP-P-IRT (Surat Pernyataan Pemilik) — small-scale food production license for home industries. Required
            for UMKM food sellers who do not have BPOM registration.

            '
          example: SPIRT.2064701011023
          x-ion-regulatory: PerBPOM 22/2018 tentang Pedoman Pemberian Sertifikat Produksi Pangan Industri Rumah Tangga
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
      allOf:
      # LOCAL (default — active):
      # REMOTE (uncomment to use upstream directly):
      # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Attributes
      - if:
          properties:
            businessType:
              const: PERORANGAN
          required:
          - businessType
        then:
          required:
          - nikNumber
      x-ion-closed-extensions: false
    IONCatalogLocalization:
      type: object
      additionalProperties: false
      title: ION Catalog Localization
      description: 'Localised text fields for catalog content — name, short description, long description. All three use the
        LocalisedText pattern. These extend beckn:descriptor fields with proper multilingual support.

        '
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:CatalogLocalization
      properties:
        name:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Product or service name as a language object. Supplements Beckn `Descriptor.name` (which carries the
            default-locale text, normally `id`). Consumers that read only Beckn-native fields see Indonesian; ION-aware consumers
            read the multilingual map here. "id" always mandatory.

            '
          x-ion-regulatory: ION Network Policy — Bahasa Indonesia localisation requirement
        shortDesc:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Short description for catalog listings and search results. Max 150 characters per language. Supplements
            Beckn `Descriptor.shortDesc`. "id" mandatory.

            '
          x-ion-regulatory: ION Network Policy — bilingual catalog requirement
        longDesc:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Full product description for product detail page. Supplements Beckn `Descriptor.longDesc`. "id" mandatory.
            "en" mandatory for cross-border pattern.

            '
          x-ion-regulatory: ION Network Policy — Bahasa Indonesia localisation requirement
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    LocalisedText:
      title: Localised Text Object
      description: 'Language-keyed text object. Keys are ISO 639-1 language codes. "id" is always mandatory per ION network
        policy. "en" is mandatory for export commerce (cross-border pattern). Additional languages optional: ms (Malay), zh
        (Chinese), ar (Arabic), ta (Tamil), ko (Korean), ja (Japanese).

        '
      minProperties: 1
      additionalProperties:
        type: string
      properties:
        id:
          type: string
          description: Bahasa Indonesia — always required
        en:
          type: string
          description: English — required for cross-border pattern
        ms:
          type: string
          description: Bahasa Melayu
        zh:
          type: string
          description: Mandarin Chinese (Simplified)
        ar:
          type: string
          description: Arabic
        ta:
          type: string
          description: Tamil
        ko:
          type: string
          description: Korean
        ja:
          type: string
          description: Japanese
      example:
        id: Nasi Goreng Spesial
        en: Special Fried Rice
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    IONParticipant:
      type: object
      title: ION Participant Attributes
      description: >
        Role-specific identity and contact attributes for a participant in an ION transaction.
        A participant is any actor recorded on a Contract — buyer, seller, carrier, consignee,
        delivery agent, guarantor, or platform. Produced by the party declaring their own role
        at /init or /confirm time; consumed by counterparties and ONIX to enforce role-based
        access controls, regulatory identity checks, and notification routing. Fields attach
        as DIRECT PROPERTIES on the Beckn v2.0.0 Participant object — NOT inside a
        participantAttributes wrapper. This is the single exception to the *Attributes container
        pattern; Beckn v2.0.0 Participant has no participantAttributes extension bag.
        Upstream parent: Participant v2.0 (schema.beckn.io).
      additionalProperties: true
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:IONParticipant
      x-beckn-attaches-to: Participant (direct properties — NOT participantAttributes)
      properties:
        role:
          type: string
          description: 'Role this participant plays in the transaction. The enum spans all ION sectors. Sector working groups
            may narrow this at publish time (e.g. trade uses BUYER/SELLER/MERCHANT; logistics uses CONSIGNOR/CONSIGNEE/CARRIER).

            '
          enum:
          - BAP
          - BPP
          - PROVIDER
          - MERCHANT
          - BUYER
          - SELLER
          - AGENT
          - BANK
          - UNDERWRITER
          - CONSIGNOR
          - CONSIGNEE
          - SHIPPER
          - NOTIFY_PARTY
          - FORWARDER
          - ACTUAL_CARRIER
          - CUSTOMS_BROKER
          - INSURANCE_BROKER
          - DRIVER
          - CUSTOMS_AUTHORITY
          - GOVERNMENT_BUYER
        subscriberId:
          type: string
          description: 'ION-registered subscriber ID when the participant is itself a subscriber. Not applicable for individuals
            (end-consumer CONSIGNEE in B2C).

            '
          x-ion-conditional: true
          x-ion-condition: Required when the participant is itself an ION-registered subscriber
        npwp:
          type: string
          description: 'NPWP (Nomor Pokok Wajib Pajak) tax ID. 16 digits post-2024 (Indonesia migrated from 15-digit to 16-digit
            format per PMK 112/2022). Some implementations still accept legacy 15-digit format via the punctuated pattern
            below.

            '
          pattern: ^([0-9]{16}|[0-9]{2}\.[0-9]{3}\.[0-9]{3}\.[0-9]-[0-9]{3}\.[0-9]{3})$
          x-ion-conditional: true
          x-ion-condition: Required when participant is a business (PKP or non-PKP) and NPWP is available
        nib:
          type: string
          description: NIB (Nomor Induk Berusaha) business registration — 13 digits
          x-ion-conditional: true
          x-ion-condition: Required for all seller/provider/merchant participants
        nik:
          type: string
          description: NIK — Indonesian customs registration number for international trade
          x-ion-conditional: true
          x-ion-condition: Required for cross-border trade (Nomor Identitas Kepabeanan — customs registration number)
        pkpStatus:
          type: string
          enum:
          - PKP
          - NON_PKP
          - NOT_APPLICABLE
          description: VAT-registered status — declared at participant onboarding
          x-ion-conditional: true
        ktpNumber:
          type: string
          description: KTP national ID number (16 digits)
          x-ion-conditional: true
          x-ion-condition: Required for DRIVER role; optional for consignee verification
        passportNumber:
          type: string
          x-ion-conditional: true
          x-ion-condition: Required for foreign consignees/shippers in cross-border patterns
        bankCode:
          type: string
          description: BI bank code
          x-ion-condition: Required when role=BANK
        insurerLicenceNumber:
          type: string
          description: OJK (Otoritas Jasa Keuangan) licence number
          x-ion-condition: Required when role=UNDERWRITER
        authorisedSignatory:
          type: object
          properties:
            name:
              type: string
            nik:
              type: string
            position:
              type: string
            email:
              type: string
              format: email
          x-ion-conditional: true
          x-ion-condition: Required for B2B contracts over materiality threshold
        addressDetail:
          type: object
          description: 'Full Indonesian administrative hierarchy plus landmark and accessibility metadata. Applies to participants
            with a physical location: CONSIGNOR, CONSIGNEE, SHIPPER, NOTIFY_PARTY, MERCHANT, BANK_OFFICE, CUSTOMS_BROKER office,
            buyer/seller for trade, etc.

            '
          properties:
            provinsiCode:
              type: string
              pattern: ^[0-9]{2}$
              description: 'Province code per BPS. 34 provinces. E.g. "31" DKI Jakarta, "35" Jawa Timur, "51" Bali.

                '
            provinsiName:
              type: string
            kabupatenCode:
              type: string
              pattern: ^[0-9]{4}$
              description: '4-digit kabupaten/kota BPS code. E.g. "3174" Jakarta Selatan, "3578" Surabaya.

                '
            kabupatenName:
              type: string
            kabupatenType:
              type: string
              enum:
              - KOTA
              - KABUPATEN
            kecamatanCode:
              type: string
              pattern: ^[0-9]{7}$
              description: '7-digit kecamatan (sub-district) code. Essential for parcel zone-based rate computation.

                '
            kecamatanName:
              type: string
            kelurahanCode:
              type: string
              pattern: ^[0-9]{10}$
              description: 10-digit kelurahan/desa code.
            kelurahanName:
              type: string
            rt:
              type: string
              pattern: ^[0-9]{1,3}$
              description: 'Rukun Tetangga. Required for rural / kampung addresses without formal street numbers. Essential
                for COD routing and last-mile parcel delivery.

                '
            rw:
              type: string
              pattern: ^[0-9]{1,3}$
            patokan:
              type: string
              description: 'Landmark description. How addresses work in rural Indonesia. Example: "Depan warung Bu Siti, seberang
                Masjid Al-Ikhlas".

                '
            patokanLocationType:
              type: string
              enum:
              - MOSQUE
              - CHURCH
              - TEMPLE
              - SCHOOL
              - WARUNG
              - MARKET
              - HEALTH_CENTER
              - VILLAGE_OFFICE
              - OTHER
            areaType:
              type: string
              enum:
              - URBAN_RESIDENTIAL
              - URBAN_COMMERCIAL
              - INDUSTRIAL
              - SUBURBAN
              - RURAL
              - REMOTE
              - PORT_AREA
              - AIRPORT_AREA
              - BONDED_ZONE
              - FREE_TRADE_ZONE
              - SPECIAL_ECONOMIC_ZONE
            remoteAreaClassification:
              type: string
              enum:
              - NOT_REMOTE
              - TERTINGGAL
              - TERDEPAN
              - TERLUAR
              - DISASTER_RECOVERY_AREA
              description: 3T classification per Kementerian Desa PDTT
            accessibility:
              type: object
              properties:
                motorcycleAccessible:
                  type: boolean
                carAccessible:
                  type: boolean
                smallTruckAccessible:
                  type: boolean
                heavyTruckAccessible:
                  type: boolean
                containerChassisAccessible:
                  type: boolean
                requiresBoat:
                  type: boolean
                requiresOjek:
                  type: boolean
                roadCondition:
                  type: string
                  enum:
                  - PAVED_GOOD
                  - PAVED_DAMAGED
                  - GRAVEL
                  - DIRT
                  - UNPAVED
            safeLocationForContactlessDelivery:
              type: string
            securityAccessRequired:
              type: boolean
            operatingHoursForDelivery:
              type: array
              items:
                type: object
                properties:
                  dayOfWeek:
                    type: string
                  opens:
                    type: string
                    format: time
                  closes:
                    type: string
                    format: time
          x-ion-conditional: true
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
      allOf:
      # LOCAL (default — active):
      # REMOTE (uncomment to use upstream directly):
      # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Attributes
      - if:
          properties:
            role:
              const: BANK
          required:
          - role
        then:
          required:
          - bankCode
      - if:
          properties:
            role:
              const: UNDERWRITER
          required:
          - role
        then:
          required:
          - insurerLicenceNumber
      x-ion-closed-extensions: false
    BISettlement:
      type: object
      title: Bank Indonesia Settlement Rail
      description: BI-FAST, RTGS, or SKN bank settlement
      additionalProperties: false
      properties:
        settlementType:
          type: string
          enum:
          - BI_FAST
          - RTGS
          - SKN
          description: 'BI_FAST: real-time settlement, max IDR 250 million per transaction. RTGS: high-value same-day settlement,
            unlimited amount. SKN: batch clearing, lower value transactions.

            '
        biRef:
          type: string
          description: BI clearing reference number
        settlementAt:
          type: string
          format: date-time
          description: Settlement timestamp in UTC
        beneficiaryName:
          type: string
        beneficiaryBank:
          type: string
        beneficiaryAccount:
          type: string
        ifscEquivalent:
          type: string
          description: Indonesian equivalent — bank routing code
      x-ion-regulatory: PBI 22/23/PBI/2020 tentang Sistem Pembayaran; SNAP BI specification
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    BNPL:
      type: object
      title: Buy Now Pay Later
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - KREDIVO
          - AKULAKU
          - INDODANA
          - SPAYLATER
          - TOKOPEDIA_PAYLATER
          - GOPAYLATER
          - ATOME
          - CICIL
          - TRAVELOKA_PAYLATER
          - HOME_CREDIT
          - UANGME
          - AKULAKU_PAYLATER
          description: BNPL provider name
        tenure:
          type: integer
          description: Repayment tenure in months
          example: 3
        installmentAmount:
          type: number
          description: Per-installment amount in IDR
        interestRate:
          type: number
          description: Monthly interest rate as decimal e.g. 0.02 = 2%
        totalRepayment:
          type: number
          description: Total repayment amount including interest
        currency:
          type: string
          const: IDR
        firstPaymentDate:
          type: string
          format: date
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    BankTransfer:
      type: object
      title: Bank Transfer
      additionalProperties: false
      properties:
        bankCode:
          type: string
          description: Recipient bank code
        accountNumber:
          type: string
          description: Recipient bank account number
        accountName:
          type: string
          description: Recipient account holder name
        transferType:
          type: string
          enum:
          - ATM
          - INTERNET_BANKING
          - MOBILE_BANKING
          - TELLER
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    CardPayment:
      type: object
      title: Credit or Debit Card Payment
      additionalProperties: false
      properties:
        cardType:
          type: string
          enum:
          - CREDIT
          - DEBIT
        scheme:
          type: string
          enum:
          - VISA
          - MASTERCARD
          - JCB
          - AMEX
          - UNIONPAY
        maskedPan:
          type: string
          description: Last 4 digits of card for display
          example: '****4242'
        bankIssuer:
          type: string
          description: Card-issuing bank name
        gatewayRef:
          type: string
          description: Payment gateway transaction reference
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    CashOnDelivery:
      type: object
      title: Cash On Delivery
      description: 'Runtime COD collection state. Offer-level COD policy fields (OTP required, denominations accepted, buyer
        daily limit, hold period, reconciliation variance) are declared per-offer in schema/extensions/logistics/offer/v1
        — they govern how COD is accepted, not the per-transaction collection record.

        '
      additionalProperties: false
      properties:
        collectionAmount:
          type: number
          description: Expected cash amount to collect from consumer
        collectionAmountCollected:
          type: number
          description: Actual cash amount the carrier collected
          x-ion-conditional: true
          x-ion-condition: Required after handover — actual amount collected
        collectionTimestamp:
          type: string
          format: date-time
          description: UTC timestamp of cash handover at delivery
          x-ion-conditional: true
          x-ion-condition: Required after handover
        collectionReceiptRef:
          type: string
          description: Receipt reference for the collected cash (scan, photo URL, or receipt ID)
        currency:
          type: string
          const: IDR
        changeIssuedBy:
          type: string
          enum:
          - PROVIDER
          - COURIER
          description: Who provides change to consumer
        maxCodAmount:
          type: number
          description: Maximum COD value allowed per ION network policy
        partialCollectionReason:
          type: string
          enum:
          - CONSUMER_SHORT_ON_CASH
          - DENOMINATION_UNAVAILABLE
          - CONSUMER_NEGOTIATED
          - CONSUMER_DISPUTED_AMOUNT
          - OTHER
          x-ion-conditional: true
          x-ion-condition: Required when collectionAmountCollected < collectionAmount
    CreditTerms:
      type: object
      title: Credit Terms
      description: 'Credit-based payment terms (business-procurement pattern, FWA-governed logistics, any deferred-payment
        scenario). Populated on PaymentDeclaration when method=CREDIT_FACILITY or when an active FWA grants credit terms to
        this transaction. ION Central validates credit availability at /init.

        '
      additionalProperties: false
      properties:
        creditTermsDays:
          type: integer
          description: Net payment terms in days from invoice date (e.g. 30 for NET-30, 60 for NET-60)
          example: 30
        paymentDueDate:
          type: string
          format: date
          description: Computed due date for this specific invoice
        creditLimit:
          type: number
          description: Total credit limit extended to buyer under the governing FWA / contract
        creditAvailable:
          type: number
          description: Credit currently available after open invoices — for ION Central validation at /init
        dunningSchedule:
          type: array
          description: Reminder schedule leading up to and past due date
          items:
            type: object
            properties:
              daysRelativeToDueDate:
                type: integer
                description: Negative before due, positive after
              channel:
                type: string
                enum:
                - EMAIL
                - SMS
                - WHATSAPP
                - VOICE_CALL
                - IN_APP
    EWallet:
      type: object
      title: Indonesia E-Wallet
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - OVO
          - DANA
          - GOPAY
          - LINKAJA
          - SHOPEEPAY
          - ASTRAPAY
          - SAKUKU
          - JENIUS
          - ISAKU
          - FLIP
          - ALLOBANK
          - SEABANK_WALLET
          - BLU
          - LIVIN
          - FLIP
          - ISAKU
          description: E-wallet provider identifier
        accountRef:
          type: string
          description: Consumer's wallet account reference (phone or wallet ID)
        amount:
          type: number
        currency:
          type: string
          const: IDR
        expiresAt:
          type: string
          format: date-time
        deepLink:
          type: string
          format: uri
          description: Deep link to open wallet app for payment
      x-ion-regulatory: PBI 23/6/PBI/2021 tentang Penyedia Jasa Pembayaran
      # required: [] — removed per NFH-012 CON-012-18; mandatoriness enforced via x-ion-field-requirements + x-ion-crc-rules
    InvoiceReference:
      type: object
      title: Invoice Reference
      description: 'Invoice document references. A transaction may have a proforma (issued at /init for credit-term scenarios)
        and a final invoice (issued at /on_confirm or later). Faktur Pajak tax-invoice references live in core/tax/v1 — this
        block is for commercial invoices.

        '
      additionalProperties: false
      properties:
        invoiceReference:
          type: string
          description: Seller-issued commercial invoice number
        invoiceIssuedAt:
          type: string
          format: date-time
        proformaInvoiceReference:
          type: string
          description: Proforma invoice number (pre-shipment, for credit terms)
        invoiceUrl:
          type: string
          format: uri
          description: URL to PDF invoice (access-controlled, time-limited)
    PaymentDeclaration:
      title: Payment Declaration
      description: 'Contents of a Beckn Settlement''s settlementAttributes bag for a buyer-facing payment event. Binds a payment
        method to a transaction and carries method-specific instrument details in methodDetail.

        '
      additionalProperties: true
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:PaymentDeclaration
      x-beckn-attaches-to: Settlement.settlementAttributes
      properties:
        method:
          type: string
          enum:
          - QRIS
          - VIRTUAL_ACCOUNT
          - EWALLET
          - COD
          - BANK_TRANSFER
          - BI_FAST
          - RTGS
          - SKN
          - BNPL
          - CREDIT_CARD
          - DEBIT_CARD
          - DIRECT_DEBIT
          - CREDIT_FACILITY
          - ESCROW
        collectedBy:
          type: string
          enum:
          - BAP
          - BPP
          - LSP
          description: Which network participant collects payment from consumer.
        timing:
          type: string
          enum:
          - ON_ORDER
          - PRE_FULFILLMENT
          - ON_FULFILLMENT
          - POST_FULFILLMENT
          description: When payment is collected relative to fulfilment.
        status:
          type: string
          enum:
          - PENDING
          - PAID
          - FAILED
          - REFUNDED
          - PARTIALLY_REFUNDED
        amount:
          type: number
          description: Payment amount in IDR
          x-ion-conditional: true
          x-ion-condition: Required when payment is confirmed
        currency:
          type: string
          const: IDR
          default: IDR
        paidAt:
          type: string
          format: date-time
          description: Timestamp of successful payment confirmation
          x-ion-conditional: true
          x-ion-condition: Required after payment is confirmed
        gatewayRef:
          type: string
          description: Payment gateway transaction reference ID
          x-ion-conditional: true
          x-ion-condition: Required when payment gateway is used
        methodDetail:
          oneOf:
          - $ref: '#/components/schemas/QRIS'
          - $ref: '#/components/schemas/VirtualAccount'
          - $ref: '#/components/schemas/EWallet'
          - $ref: '#/components/schemas/CashOnDelivery'
          - $ref: '#/components/schemas/BankTransfer'
          - $ref: '#/components/schemas/BISettlement'
          - $ref: '#/components/schemas/BNPL'
          - $ref: '#/components/schemas/CardPayment'
          x-ion-conditional: true
