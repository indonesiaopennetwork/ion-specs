  x-ion-context-extensions:
    status: EXPERIMENTAL
    mandatoryFrom: 0.6.0 (tentative — pending Council ratification)
    optionalIn: 0.6.0
    ionDivergenceNote: >
      The Beckn Protocol v2.0.0 LTS base Context schema (beckn.yaml) does not
      include a domain field. Domain identity in base Beckn is expressed through
      networkId or catalog @context. ION introduces the domain field as an explicit
      ION extension to Context for the following reasons:

      1. SECTOR ROUTING — ION operates six sectors on a single network (ion.id).
         networkId alone does not distinguish sector; domain gives ONIX a
         deterministic routing signal without requiring separate sub-networks per sector.

      2. REGULATORY ROUTING — Indonesian regulations differ by sector (OJK for finance,
         BPOM for trade/health, Kemenhub for logistics/mobility). ONIX uses domain to
         apply the correct regulatory rule-set at every API boundary.

      3. POLICY ATTACHMENT — ION policy IRIs (cancellation, return, grievance-SLA) are
         sector-scoped. domain lets ONIX resolve and enforce the correct policy registry
         without parsing catalog @context on every call.

      ION-specific handling: ONIX validates domain against x-ion-sector-registry.
      Non-ION Beckn nodes that receive a message with this field MUST ignore it per
      Beckn Protocol extension rules (unknown Context fields are non-breaking).
      This divergence is explicitly documented here and does not affect Beckn LTS
      conformance — ION does not modify beckn.yaml.
    fields:
      domain:
        type: string
        description: >
          ION sector identity for this transaction. An ION-specific extension to the
          Beckn Context — not present in the base beckn.yaml Context schema. See
          ionDivergenceNote above for the full rationale. Values correspond to the
          six ION sectors declared in x-ion-sector-registry. ONIX validates this
          field at every API boundary; non-ION Beckn nodes MUST ignore it.
        enum:
          - ion:trade
          - ion:hospitality
          - ion:logistics
          - ion:mobility
          - ion:finance
          - ion:services
        example: ion:trade
      pattern:
        type: string
        description: 'Pattern name claimed by this transaction (e.g. storefront, parcel). Enables deterministic flow validation
          at ION Central.

          '
        example: parcel
      patternVersion:
        type: string
        description: Pattern version in force for this transaction
        example: 1.0.0
      activeVariants:
        type: array
        description: 'Variants currently active for this transaction (e.g. ["cold-chain", "cash-on-delivery", "weight-dispute"]).
          Tells ION Central which conditional flow rules apply.

          '
        items:
          type: string
      policyIris:
        type: array
        description: 'Snapshot of policy IRIs applicable to this transaction. Lets ION Central enforce the exact terms declared
          at contract time even if the registry is later updated.

          '
        items:
          type: string
          format: iri
