                # REMOTE (uncomment to use upstream directly):
                # $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Ack
  /reconcile:
    post:
      summary: Initiate financial settlement reconciliation
      description: 'ION EXTENSION. Not in Beckn 2.0 core. BAP initiates reconciliation of settlement amounts after contract
        COMPLETE. Covers final amount with all adjustments (weight disputes, SLA rebates, COD remittance, FWA rebates, tax).

        Supports context.try=true (ION-extended use of the Beckn try pattern) for preview without committing Settlement state
        transition.

        '
      operationId: reconcile
      tags:
      - ION Extensions — Reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - context
              - message
              properties:
                context:
                  allOf:
                  # LOCAL (default — active):
                  - $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context
                  # REMOTE (uncomment to use upstream directly):
                  # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Context
