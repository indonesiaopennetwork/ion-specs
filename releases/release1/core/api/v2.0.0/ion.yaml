  x-ion-crc-rules:
    description: >
      CRC-conditional attribute enforcement rules. When a resource carries a crc
      field matching one of the codes below, ONIX enforces the listed requiredBlocks
      and requiredFields at catalog/publish time. Fields listed under requiredFields
      are validated as non-null on the resource's ION attributes schema sub-object.
    enforcedBy: ONIX
    enforcementPoint: catalog/publish
    rules:
      - crc: TRC-food-bev
        requiredBlocks: [food, packaged]
        requiredFields:
          food: [classification, allergens]
          packaged: [genericName, countryOfOrigin]
      - crc: TRC-health-beauty
        requiredBlocks: [regulatory]
        requiredFields:
          regulatory:
            - registrations  # at least one registration entry required
      - crc: TRC-fashion
        requiredBlocks: [fashion]
        requiredFields:
          fashion: [gender, size, fabricComposition]
      - crc: TRC-electronics
        requiredBlocks: [electronics]
        requiredFields:
          electronics: [connectivity, wattage, energyRating]
      - crc: TRC-digital
        requiredBlocks: [digital]
        requiredFields:
          digital: [digitalCategory, denomination]
      - crc: HSC-restaurant-ordering
        requiredBlocks: []
        requiredFields:
          root: [classification, allergens, preparationTime]
      - crc: LGC-lastmile
        requiredBlocks: []
        requiredFields:
          root: [serviceType, weight, dimensions]
      - crc: LGC-freight
        requiredBlocks: []
        requiredFields:
          root: [serviceType, weight, dimensions]
      - crc: LGC-warehouse
        requiredBlocks: []
        requiredFields:
          root: [serviceType]
      - crc: FNC-lending
        requiredBlocks: []
        requiredFields:
          root: [productType, maxLoanAmount, tenureMonths, interestRateType]

  x-ion-transaction-types:
    description: >
      Seven transaction types derived from resource attributes and sector membership.
      Transaction type is not a declared wire field — it is derived by ONIX at
      validation time from the resource's ION attribute values. The derived type
      determines which patterns are eligible and which performance state machine applies.
    derivedBy: ONIX
    types:
      PHYSICAL_GOOD:
        description: A tangible item that requires physical logistics for delivery
        derivedFrom:
          resourceTangibility: PHYSICAL
          preparationTime: absent
        eligiblePatterns:
          - storefront
          - marketplace-listed
          - marketplace-inhouse
          - business-procurement
          - cross-border
          - live-commerce
          - forward-auction
          - reverse-auction
      PREPARED_GOOD:
        description: A tangible item prepared after order placement — food, custom bakery, tailoring
        derivedFrom:
          resourceTangibility: PHYSICAL
          preparationTime: present
        eligiblePatterns:
          - made-to-order
      DIGITAL_ENTITLEMENT:
        description: A digitally delivered good — pulsa, voucher, top-up, game credits, e-book
        derivedFrom:
          resourceTangibility: DIGITAL
        eligiblePatterns:
          - digital-goods
      SLOT:
        description: A time-bounded reservation — restaurant table, accommodation, event ticket
        derivedFrom:
          resourceTangibility: SLOT
        eligiblePatterns:
          - storefront
      CAPACITY:
        description: A logistics or mobility capacity booking — parcel, freight, ride
        derivedFrom:
          sector: ["ion:logistics", "ion:mobility"]
        eligiblePatterns:
          - hyperlocal
          - parcel
          - freight
          - roro
          - warehouse
          - cross-border
      FINANCIAL_INSTRUMENT:
        description: A financial product — loan, insurance, investment instrument
        derivedFrom:
          sector: ion:finance
        eligiblePatterns: []
        note: Finance patterns defined separately under flows/finance/
      PROFESSIONAL_SERVICE:
        description: A human labour or expertise engagement
        derivedFrom:
          sector: ion:services
        eligiblePatterns: []
        note: Services patterns defined separately under flows/services/

  x-ion-extension-zones:
    description: >
      Four zones inside any Attributes bag, applied in order. Each zone has
      different governance rules, validation behaviour, and IRI namespace
      requirements. ONIX validates zones 1 and 2 at every API boundary.
      Zone 3 is accepted but not validated by ONIX. Zone 4 must be explicitly
      flagged and auto-expires if not ratified.
    zones:
      beckn_defined:
        zoneNumber: 1
        description: >
          The Beckn-defined base fields. Exactly two fields: @context and @type.
          Governed by beckn.yaml LTS. MUST be present on every Attributes bag.
          @context MUST be a single string URL resolving to a published JSON-LD
          context document. @type MUST identify the domain type being expressed.
        fields: ['@context', '@type']
        governance: beckn-cwg
        namespace: null
        validated: true
        note: >
          @context and @type are the ONLY fields that belong in zone 1.
          Core objects (Descriptor, Location, Catalog, Resource, Offer,
          Commitment, Consideration, Performance, Participant, Entitlement)
          MUST NOT carry @context or @type directly — only their *Attributes
          extension containers do.
      ion_mandated:
        zoneNumber: 2
        description: >
          ION core, sector, and conditional fields. Governed by ion.yaml v0.7.0+.
          These are the fields defined in the ION extension pack schemas published
          at schema.ion.id. ONIX validates all zone 2 fields at every API boundary.
          Mandatory fields are declared via network policy (x-ion-crc-rules,
          x-ion-conditional-rules) not in the shared schema itself.
        namespace: https://schema.ion.id/
        governance: ion-council
        validated: true
      participant_extensions:
        zoneNumber: 3
        description: >
          Network participant (NP) declared fields. Published under the NP's own
          IRI namespace — never ion: or beckn:. Accepted by ONIX without structural
          validation. Size-capped at 10 fields per Attributes bag to prevent
          uncontrolled growth. NPs wishing to promote a zone 3 field to zone 2
          MUST open a contribution via the ION schema contribution process.
        maxFields: 10
        governance: participant-self
        namespace: participant-owned
        validated: false
        iriRule: >
          MUST NOT use ion: or beckn: prefix. MUST use a namespace owned by the
          declaring NP and registered on dedi.global under their namespace.
      experimental:
        zoneNumber: 4
        description: >
          Sector Working Group (SWG) pilot fields. Declared by an active SWG during
          a ratification cycle. MUST carry x-ion-experimental: true tag on each
          experimental field. Auto-expire after one ION release cycle (90 days)
          if not ratified by the ION Council into zone 2. Experimental fields
          that expire are treated as zone 3 fields from the expiry date.
        tag: x-ion-experimental
        governance: ion-sector-working-group
        autoExpire: true
        autoExpireDays: 90
        ratificationPath: >
          SWG proposes → ION Council vote → if ratified, field promoted to zone 2
          and added to the relevant ion.yaml schema pack in the next release cycle.
  x-ion-field-requirements:
    description: >
      ION network policy field requirements per NFH-012 CON-012-18. Shared schemas
      MUST NOT declare mandatory fields — mandatoriness is expressed here through
      network policy, enforced by ONIX at catalog/publish and API boundaries.
      These were formerly declared as required: arrays on the shared schemas
      (removed in v0.7.0). The source of truth for enforcement is x-ion-crc-rules
      (CRC-conditional) and x-ion-conditional-rules (cross-schema conditional).
    enforcedBy: ONIX
    enforcementPoints:
      - catalog/publish
      - on_select
      - on_init
      - on_confirm
    alwaysRequired:
      description: >
        Fields required on every ION transaction regardless of sector, pattern,
        or CRC. These apply to all L4/L5 schemas at every API boundary. This block
        is the canonical source of truth for mandatory fields — replacing the
        removed required: arrays on shared schemas (removed in v0.7.0 per NFH-012
        CON-012-18 and GAP 32).
      fields:
        - schema: IONBusinessRegistration
          fields: [npwp, nib, pkpStatus, legalEntityName, businessType]
          reason: Indonesian tax and business identity — required for all ION network participants
          regulation: PMK 136/2023, PP 24/2018 OSS
        - schema: IONAddressSubdivisions
          fields: [provinsiCode]
          reason: Province code required for tax routing and logistics zone determination
        - schema: IONCatalogLocalization
          fields: [name, shortDesc]
          reason: Minimum localised catalog content required for display on ION marketplace surfaces
        - schema: LocalisedText
          fields: [id]
          reason: Indonesian (id) locale always required; en required only for cross-border pattern
        - schema: IONParticipant
          fields: [role]
          reason: Participant role required for ONIX access control and regulatory routing
        - schema: BISettlement
          fields: [settlementType]
          reason: Settlement rail type required for BI SNAP routing
        - schema: BNPL
          fields: [provider]
          reason: BNPL provider required for OJK-licensed BNPL routing
        - schema: BankTransfer
          fields: [bankCode, accountNumber]
          reason: Bank identity required for BI RTGS / SKN transfer
        - schema: CardPayment
          fields: [cardType, scheme]
          reason: Card type and scheme required for payment gateway routing
        - schema: EWallet
          fields: [provider]
          reason: E-wallet provider required for OJK-licensed wallet routing
        - schema: PaymentDeclaration
          fields: [method, collectedBy, timing, status, currency]
          reason: Payment declaration completeness — required for all financial transactions
        - schema: QRIS
          fields: [qrisType, merchantId]
          reason: QRIS merchant identity required for BI QRIS mandate compliance
        - schema: Refund
          fields: [refundAmount, refundMethod]
          reason: Refund amount and method required for consumer protection compliance
        - schema: VirtualAccount
          fields: [bankCode, vaNumber]
          reason: VA identity required for reconciliation and settlement routing
        - schema: IONProductCompliance
          fields: [halalStatus, ageRestricted]
          reason: MUI halal status and age restriction required for all trade products per ION consumer protection policy
        - schema: IONTicket
          fields: [id, title, description, type, priority, raisedBy, status, createdAt, updatedAt]
          reason: Ticket identity and lifecycle fields required for ION dispute and grievance tracking
        - schema: IONRating
          fields: [ratingCategory, ratingValue]
          reason: Rating category and value required for ION trust and reputation system
        - schema: IONReconciliation
          fields: [reconId, contractId, collectedBy, settlementBasis, settlementWindow, amounts, counterparty, reconStatus]
          reason: Core reconciliation identity fields required for financial settlement integrity
        - schema: IONSupportTicket
          fields: [id, category, complainantInfo, description, source, status, createdAt, updatedAt]
          reason: Support ticket identity fields required for OJK-mandated grievance SLA tracking
        - schema: IONTaxDetail
          fields: [taxRegime, taxCategory]
          reason: Tax regime and category required for DJP/PMK compliance on every taxable transaction
        - schema: TradeCommitment
          fields: [lineId, resourceId, offerId, quantity]
          reason: Order line identification — required to form a valid trade contract
        - schema: TradeConsideration
          fields: [totalAmount, currency]
          reason: Financial completeness — required for every retail consideration
        - schema: TradeOffer
          fields: [policies.cancellation.policyRef, policies.cancellation.allowed, policies.returns.allowed, policies.returns.policyRef, policies.warranty.policyRef, policies.dispute.policyRef, timeToShip, paymentConstraints.codAvailable, contactDetailsConsumerCare, displayLanguage, policies.grievanceSla.policyRef, policies.paymentTerms.policyRef]
          reason: Merchant policy completeness — ONIX enforces these at catalog/publish; required for consumer protection compliance
        - schema: TradePerformance
          fields: [performanceMode, supportedPerformanceModes, sla]
          reason: Delivery mode and SLA required for ONIX performance tracking and penalty enforcement
        - schema: TradeProvider
          fields: [invoicing.model, operationalStatus.status, operatingHours, closures, providerCategories, businessRegistration.nib, verification.status, verification.level, verification.validUntil]
          reason: Provider operational identity required for ION marketplace listing
        - schema: TradeResource
          fields: [quantity, resourceStructure, resourceTangibility, images, logisticsServiceType, availability, ageRestricted, countryOfOrigin]
          reason: Core product fields required for discovery, logistics routing, and consumer protection
        - schema: LogisticsConsideration
          fields: [components, totalAmount]
          reason: Logistics charge breakdown required for billing transparency
        - schema: LogisticsOffer
          fields: [serviceLevel, transportMode, rateLogic, selectRequired, availableOnCod, cancellationPolicy, claimPolicy, slaPolicy, evidencePolicy, disputePolicy]
          reason: Logistics service terms required for shipper selection and ONIX contract validation
        - schema: LogisticsProvider
          fields: [catalogVersion, catalogPublishedAt, catalogValidFrom, nibRegistered, providerCategory, patternsSupported, modesSupported, coverage, operatingHours]
          reason: Logistics provider capability declaration required for network routing and compliance
        - schema: LogisticsResource
          fields: [serviceType, quantity]
          reason: Shipment service type and quantity required for logistics booking
        - schema: LogisticsTracking
          fields: [trackingType]
          reason: Tracking type required for ONIX to route tracking events to the correct handler
    crcConditional:
      description: >
        Fields required only when the resource carries a specific CRC code.
        Declared in x-ion-crc-rules. See that block for the full mapping.
      examples:
        - crc: TRC-food-bev
          requiredIn: IONTradeResource
          fields: [food.classification, food.allergens, packaged.genericName, packaged.countryOfOrigin]
        - crc: TRC-health-beauty
          requiredIn: IONTradeResource
          fields: [regulatory.registrations]
        - crc: TRC-fashion
          requiredIn: IONTradeResource
          fields: [fashion.gender, fashion.size, fashion.fabricComposition]
    crossSchemaConditional:
      description: >
        Fields required only when a field in a different schema bag has a specific value.
        Declared in x-ion-conditional-rules. ONIX enforces at API boundaries.
      examples:
        - trigger: IONParticipant.role = DRIVER
          requiredIn: IONLogisticsAgent
          fields: [driverLicenceCategory, driverLicenceNumber]
        - trigger: PaymentDeclaration.paymentRail = COD
          requiredIn: TradeConsideration
          fields: [codAmount]
        - trigger: IONBusinessRegistration.pkpStatus = PKP
          requiredIn: IONTaxDetail
          fields: [eFakturRef]
