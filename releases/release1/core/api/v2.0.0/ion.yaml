  /on_reconcile:
    post:
      summary: Callback — reconciliation result
      description: 'ION EXTENSION. BPP returns reconciliation status (AGREED, DISPUTED, PENDING_ADJUSTMENT), net settlement
        amount, and dispute reason if applicable. Settlement state transitions: DRAFT → COMMITTED on AGREED; stays DRAFT on
        DISPUTED pending further bilateral exchange or /raise escalation.

        '
      operationId: onReconcile
      tags:
      - ION Extensions — Reconciliation
