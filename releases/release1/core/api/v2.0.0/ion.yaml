  x-ion-sector-registry:
    description: >
      The six ION sectors. Each sector has a canonical domain identifier used in
      x-ion-context-extensions.domain and in vocab.jsonld linkages. Sector
      membership determines which attribute packs, patterns, and regulatory rules
      apply to a transaction.
    sectors:
      - id: trade
        domain: ion:trade
        description: Buyer ends up owning a physical or digital thing
        active: true
      - id: hospitality
        domain: ion:hospitality
        description: Time-bounded reservation of capacity or food ordering
        active: true
      - id: logistics
        domain: ion:logistics
        description: Movement and storage of goods
        active: true
      - id: mobility
        domain: ion:mobility
        description: Movement of people
        active: false
        note: Reserved — activation pending ION Council decision
      - id: finance
        domain: ion:finance
        description: Money and financial instruments
        active: false
        note: Reserved — activation pending ION Council decision
      - id: services
        domain: ion:services
        description: Human labour and expertise
        active: false
        note: Reserved — activation pending ION Council decision

  x-ion-category-registry:
