  schema_ref: schema/extension/logistics/LogisticsPerformance/v1
  schema_pointer: /components/schemas/LogisticsPerformance/properties/attempts
  flow_ref: flows/logistics/variants/delivery-attempts/v1
  resolution: {en: Follow the selected re-attempt policy and record RETURN_INITIATED when return-to-origin begins.}
  legacy_code: ION-LOG-5001
  sector: logistics

