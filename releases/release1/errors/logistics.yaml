# ION Error Registry — Logistics Sector (ION-Bxxxx)
# Authoritative Release 1 source for Logistics-specific errors.

- code: ION-B5001
  http_status: 409
  category: fulfillment
  title: {id: Batas upaya pengiriman tercapai, en: Delivery attempt limit reached}
  description: {en: The selected re-attempt policy permits no further delivery attempt.}
  affected_field: message.contract.performance[].performanceAttributes.attempts[]
