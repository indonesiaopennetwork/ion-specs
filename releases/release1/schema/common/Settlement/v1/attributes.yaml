openapi: 3.1.1
info:
  title: ION Settlement Extension (v1)
  description: >
    Settlement reconciliation attributes. IONSettlementReconciliation is the
    order's payment settlement, carried as Settlement.settlementAttributes
    from init through confirm, cancellation and updates, and on each contract
    in the /reconcile and /on_reconcile messages defined by
    core/api/v2.0.0/ion-additional.yaml. The settlement terms are not part
    of it: the payout terms are the offer's policies.settlement
    (IONTradeOffer, using the SettlementBasis and SettlementWindow defined
    here) and the commission terms are the buyer finder fee on each offer's
    consideration (IONTradeConsideration.buyerFinderFee), whose total for the
    order is buyerFinderFee.feeAmount on the contract's price consideration.
    Attaches to:
    beckn:Settlement.settlementAttributes.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    IONSettlementReconciliation:
      type: object
      title: IONSettlementReconciliation
      description: >
        The order's settlement, carried as one object from init to
        reconciliation. The BAP declares it in init (its payout account,
        payment method, status PENDING, and estimated figures); the BPP
        answers in on_init (its payout account, and the figures on its final
        price, with commission equal to the contract consideration's
        buyerFinderFee.feeAmount); the BAP records the payment in confirm
        (status PAID, paidAt, gatewayRef, orderAmount = amount paid); the BPP
        keeps the figures current in on_cancel and on_update; and each
        participant sends its figures in /reconcile and /on_reconcile. Before
        reconciliation the figures are estimates. The figures are each
        participant's own calculation of the two network participants'
        entitlements: commission is the BAP's and netPayable the BPP's.
        Without ADDITIONAL breakup entries, orderAmount.value =
        netPayable.value + commission.value + withholdingAmount.value +
        refundAmount.value; each ADDITIONAL entry's effectOnNetPayable adds
        to netPayable. A prepaid buyer payment is held at the PJP; collections
        records who collected the money when it is not (cash on delivery,
        credit, transfer). Agreement (accord) is per settlement and covers
        only these entitlements: SEAM separately verifies the funds and the
        accounts before it has any amount paid out, netPayable to the BPP
        (or the BPP's recipients in settlementAccounts), commission to the
        BAP, refundAmount to the buyer, with withholdingAmount kept back.
        The payment fields reuse the IONPayment definitions. The payout falls
        due as the commitments'
        offers state in policies.settlement (IONTradeOffer); with several
        offers, the one giving the latest due date applies. Earlier versions
        carried settlementBasis, settlementWindow and finderFee here; orders
        that still carry them remain valid (additionalProperties is true),
        but new settlements omit them.
      x-ion-layer: ion
      x-recommended-parent: Settlement.settlementAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/common/Settlement/v1/context.jsonld'
        '@type': ion:IONSettlementReconciliation
      x-beckn-attaches-to: Settlement.settlementAttributes
      required:
        - currency
        - orderAmount
        - commission
        - netPayable
        - settlementAccounts
      allOf:
        - if:
            properties:
              commission:
                properties:
                  value:
                    exclusiveMinimum: 0
                required: [value]
            required: [commission]
          then:
            properties:
              settlementAccounts:
                contains:
                  type: object
                  properties:
                    holderRole:
                      const: BAP
                  required: [holderRole]
        - if:
            properties:
              accord:
                const: true
            required: [accord]
          then:
            required: [dueDate]
        - if:
            properties:
              accord:
                const: false
            required: [accord]
          then:
            required: [dispute]
        - if:
            properties:
              status:
                const: PENDING
            required: [status]
          else:
            properties:
              settlementAccounts:
                contains:
                  type: object
                  anyOf:
                    - properties:
                        holderRole:
                          const: BPP
                      required: [holderRole]
                    - properties:
                        allocationFor:
                          const: BPP
                      required: [allocationFor]
        - if:
            properties:
              status:
                const: PAID
            required: [status]
          then:
            required: [paidAt]
      dependentRequired:
        adjustmentType: [relatedSettlementId]
      properties:
        collectedBy:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/collectedBy
        currency:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/currency
        settlementAccounts:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/settlementAccounts
          minItems: 1
          description: >
            Payout accounts: the BAP declares its account in init, the BPP
            adds its own in on_init, and the BPP may add the recipients it
            splits netPayable among (allocationFor BPP). Once the payment is
            no longer PENDING, the BPP's own account or its split is
            required; the BAP account is required when commission is greater
            than zero.
        method:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/method
        paymentRail:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/paymentRail
        paymentGatewayProvider:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/paymentGatewayProvider
        methodDetail:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/methodDetail
        timing:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/timing
        status:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/status
        paidAt:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/paidAt
        gatewayRef:
          $ref: https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/gatewayRef
        orderAmount:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            Gross amount the buyer pays for this settlement: the order total
            in init and on_init, the amount paid from confirm on. When a
            contract has several settlements, each covers its own part.
        commission:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            The BAP's entitlement: the buyer finder fee the BPP owes the BAP
            for the contract, equal to buyerFinderFee.feeAmount on the
            contract's price consideration in force (IONTradeConsideration),
            which sums the offers' fees. Zero when the offers carry no buyer
            finder fee.
        withholdingAmount:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            Amount kept back from the BPP's side, for example against returns;
            breakup entries with includedIn WITHHOLDING itemize it.
        refundAmount:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            Total refunded to the buyer for this settlement; breakup entries
            with includedIn REFUND itemize it.
        netPayable:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            The BPP's total entitlement for this settlement: orderAmount −
            commission − withholdingAmount − refundAmount, plus the
            effectOnNetPayable of each ADDITIONAL breakup entry. The BPP may
            split it among recipients in settlementAccounts; the BAP agrees
            the total, not the split.
        recoveryAmount:
          allOf:
            - $ref: '#/components/schemas/ReconAmount'
          description: >
            Amount owed back on a correction settlement (relatedSettlementId),
            for example after a chargeback or a refund forced after payout,
            when it exceeds what is still to be paid. Amounts are never
            negative; a recovery is stated here instead.
        orderDate:
          type: string
          format: date
          description: >
            Date the order was created, in Asia/Jakarta time (UTC+07:00),
            taken from the order's original creation timestamp. Groups
            settlements by order day; it is not the due date.
        breakup:
          type: array
          description: >
            Optional itemization of the figures. Entries with includedIn
            COMMISSION, WITHHOLDING or REFUND explain part of that amount and
            are not deducted again; ADDITIONAL entries change netPayable by
            their effectOnNetPayable.
          items:
            $ref: '#/components/schemas/FinancialComponent'
        collections:
          type: array
          description: >
            Optional record of who collected the buyer's money and how much,
            for the cases the payment fields do not describe: cash on
            delivery, credit, bank transfer, partial or mixed collection.
            Reported by the sender; it is not proof of funds. Its method and
            status are the collection's (JSON-LD ion:collectionMethod and
            ion:collectionStatus), not the payment's.
          items:
            $ref: '#/components/schemas/CollectionInformation'
        settlementObligations:
          type: array
          description: >
            Optional, informational: who is expected to pay whom, for example
            a cash-on-delivery collector remitting to the BPP and the BPP
            paying the BAP's commission. Not a payment instruction; legs that
            pass on the same money are not added up as separate value.
          items:
            $ref: '#/components/schemas/SettlementObligation'
        relatedSettlementId:
          type: string
          description: >
            On a correction settlement, the Settlement.id of the earlier
            settlement it adjusts. The correction has its own Settlement.id;
            the earlier settlement is not sent or paid again.
        adjustmentType:
          type: string
          enum:
            - CORRECTION
            - REFUND
            - CHARGEBACK
            - REVERSAL
            - PENALTY
            - OTHER
          description: Kind of correction. Requires relatedSettlementId.
        accord:
          type: boolean
          description: >
            Set only in /on_reconcile, on every settlement. true — the
            counterparty agrees with the entitlements it received (commission
            and netPayable and the amounts that make them up); false — it
            disagrees (dispute code, diffValue) or the settlement is not ready
            (a pending dispute code). Agreement is per settlement: an agreed
            settlement stays agreed whatever happens to the others. It covers
            the BAP's and the BPP's entitlements, not the BPP's split among
            its recipients, and it does not by itself release any payout.
        dueDate:
          type: string
          format: date
          description: >
            Date by which the payout is due: settlementWindow after the
            settlementBasis event of the commitments' offers'
            policies.settlement, the latest such date when the offers differ.
            Either participant may state it; required when accord is true.
        dispute:
          $ref: '#/components/schemas/Dispute'
      x-ion-closed-extensions: false

    ReconAmount:
      type: object
      title: ReconAmount
      description: >
        One settlement component. In /on_reconcile, diffValue is the
        counterparty's value minus the value in the /reconcile being answered;
        it is present only when the two differ.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: number
          minimum: 0
          description: Component amount in the settlement currency.
        diffValue:
          type: number
          description: Counterparty's value minus the value it is answering, when they differ.

    Dispute:
      type: object
      title: Dispute
      description: >
        Why a settlement has accord false. Required when accord is false. The
        code says whether the settlement is disputed or only pending.
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - ORDER_AMOUNT_MISMATCH
            - COMMISSION_MISMATCH
            - WITHHOLDING_MISMATCH
            - REFUND_MISMATCH
            - TAX_MISMATCH
            - ADJUSTMENT_MISMATCH
            - MISSING_CONTRACT
            - MISSING_SETTLEMENT
            - DUPLICATE_SETTLEMENT
            - OTHER
            - SETTLEMENT_WINDOW_NOT_REACHED
            - AWAITING_INFORMATION
          description: >
            Machine-readable reason. SETTLEMENT_WINDOW_NOT_REACHED (sent
            before the settlement is due) and AWAITING_INFORMATION (the
            answering participant lacks what it needs to check the figures)
            make the settlement pending; it is sent again later. Every other
            code makes it disputed.
        field:
          type: string
          description: >
            Name of the field in dispute, for example commission or a breakup
            code, when the disagreement is about one figure.
          examples: [commission]
        referenceId:
          type: string
          description: Reference the disagreement rests on, such as an invoice or settlement ID.
        description:
          type: string
          description: Human-readable explanation of the disagreement.

    FinancialComponent:
      type: object
      title: FinancialComponent
      description: >
        One itemized part of a settlement's figures. Amounts are explained
        once: an entry included in commission, withholdingAmount or
        refundAmount is not deducted again.
      additionalProperties: false
      required: [code, includedIn, amount]
      allOf:
        - if:
            properties:
              includedIn:
                const: ADDITIONAL
            required: [includedIn]
          then:
            required: [effectOnNetPayable]
      properties:
        code:
          type: string
          enum:
            - PPN
            - PPH
            - PAYMENT_FEE
            - SELLER_APP_FEE
            - NETWORK_FEE
            - LOGISTICS
            - SELLER_FUNDED_DISCOUNT
            - BUYER_APP_SUBSIDY
            - PENALTY
            - COMPENSATION
            - CANCELLATION
            - RETURN
            - FORCED_REFUND
            - CHARGEBACK
            - CORRECTION
            - OFFSET
            - ROUNDING
            - OTHER
          description: >
            Category. PPN is Indonesian value-added tax and PPH Indonesian
            income-tax withholding; Release 1 withholds no tax from payouts,
            so tax entries only explain the figures.
        includedIn:
          type: string
          enum: [COMMISSION, WITHHOLDING, REFUND, ADDITIONAL]
          description: >
            The amount this entry is part of. ADDITIONAL: not part of
            commission, withholdingAmount or refundAmount; it changes
            netPayable by effectOnNetPayable.
        amount:
          type: number
          minimum: 0
          description: Size of the entry, in the settlement currency.
        effectOnNetPayable:
          type: number
          description: >
            Signed change to netPayable; required when includedIn is
            ADDITIONAL. Negative for a fee or penalty charged to the BPP,
            positive for a credit to it.
        referenceId:
          type: string
          description: Reference for the entry, such as an invoice or a return ID.

    CollectionInformation:
      type: object
      title: CollectionInformation
      description: >
        One collection of the buyer's money, as reported by the sender. Not
        proof of funds: SEAM verifies collections separately.
      additionalProperties: false
      required: [method, status]
      properties:
        method:
          type: string
          enum: [PREPAID, COD, BANK_TRANSFER, CREDIT, MIXED, OTHER]
          description: How the buyer pays this part.
        status:
          type: string
          enum: [NOT_COLLECTED, PARTIALLY_COLLECTED, COLLECTED, REVERSED, UNKNOWN]
          description: How far this part has been collected.
        collectorRole:
          type: string
          enum: [PJP, BAP, BPP, SELLER, LOGISTICS, BUYER, OTHER]
          description: >
            Who holds the money collected; BUYER when nothing has been
            collected yet on credit.
        collectorId:
          type: string
          description: Identifier of the collector, such as a subscriber ID or the BPP's ID for a seller or courier.
        reportedCollectedAmount:
          type: number
          minimum: 0
          description: Amount the sender reports as collected so far.
        referenceId:
          type: string
          description: Reference for the collection, such as a payment-gateway or invoice reference.
        dueDate:
          type: string
          format: date
          description: When the buyer must pay, for credit.

    SettlementObligation:
      type: object
      title: SettlementObligation
      description: >
        One expected payment between parties, for information. It is not a
        payment instruction.
      additionalProperties: false
      required: [payerId, payeeId, amount]
      properties:
        payerId:
          type: string
          description: Who is expected to pay.
        payeeId:
          type: string
          description: Who is expected to receive.
        amount:
          type: number
          minimum: 0
          description: Expected amount, in the settlement currency.
        purpose:
          type: string
          enum: [BPP_PROCEEDS, BAP_COMMISSION, COD_REMITTANCE, REFUND, OTHER]
          description: What the payment is for.
        dueDate:
          type: string
          format: date
        referenceId:
          type: string

    SettlementBasis:
      title: SettlementBasis
      description: >
        Contract lifecycle event from which a settlement falls due. Used by
        IONTradeOffer.policies.settlement.settlementBasis.
        ON_CONFIRMATION starts at order confirmation, AFTER_SHIPMENT at
        hand-over to logistics, AFTER_DELIVERY at confirmed delivery, and
        AFTER_RETURN_WINDOW when the applicable return window closes.
      type: string
      enum:
        - ON_CONFIRMATION
        - AFTER_SHIPMENT
        - AFTER_DELIVERY
        - AFTER_RETURN_WINDOW
      example: AFTER_DELIVERY

    SettlementWindow:
      title: SettlementWindow
      description: >
        ISO 8601 duration, measured from the SettlementBasis event, within
        which the settlement must be paid out. Used by
        IONTradeOffer.policies.settlement.settlementWindow.
      type: string
      format: duration
      example: P1D
