openapi: 3.1.1
info:
  title: ION Address (v1)
  description: >
    ION-maintained postal Address with the standard Beckn fields and an
    addressAttributes extension point. IONAddress supplies Indonesian
    administrative subdivisions and delivery-premises details through that
    extension point without adding network-specific properties directly to the
    closed Address object.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    Address:
      type: object
      title: Address
      description: >
        ION-maintained postal address aligned with the Address component in
        ion-beckn.yaml. Standard international fields remain directly on the
        object; domain- and network-specific fields belong in addressAttributes.
      additionalProperties: false
      properties:
        addressCountry:
          description: Country name or ISO-3166-1 alpha-2 code.
          type: string
          example: ID
        addressLocality:
          description: City or locality.
          type: string
          example: Jakarta Pusat
        addressRegion:
          description: State, region, or province.
          type: string
          example: DKI Jakarta
        extendedAddress:
          description: Address extension such as apartment, suite, floor, block, unit, or care-of information.
          type: string
          example: Blok A3, Lantai 12, Unit 05
        postalCode:
          description: Postal or ZIP code.
          type: string
          example: '12190'
        streetAddress:
          description: Street address including building name or number and street.
          type: string
          example: Jl. Jend. Sudirman No. 45
        addressAttributes:
          description: Domain- or network-specific extension attributes for this address.
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Attributes/2.0/attributes.yaml#/components/schemas/Attributes
            - type: object
              properties:
                '@context':
                  type: string
                '@type':
                  type: string
              required: ['@context', '@type']

    IONAddress:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      title: Indonesian Address Attributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/common/Address/v1/context.jsonld'
        '@type': ion:IONAddress
      x-ion-data-residency: ID  # RT/RW and building sub-fields can identify a household
      x-beckn-attaches-to: Address.addressAttributes
      properties:
        provinsiCode:
          type: string
          enum:
          - BPS-11
          - BPS-12
          - BPS-13
          - BPS-14
          - BPS-15
          - BPS-16
          - BPS-17
          - BPS-18
          - BPS-19
          - BPS-21
          - BPS-31
          - BPS-32
          - BPS-33
          - BPS-34
          - BPS-35
          - BPS-36
          - BPS-51
          - BPS-52
          - BPS-53
          - BPS-61
          - BPS-62
          - BPS-63
          - BPS-64
          - BPS-65
          - BPS-71
          - BPS-72
          - BPS-73
          - BPS-74
          - BPS-75
          - BPS-76
          - BPS-81
          - BPS-82
          - BPS-91
          - BPS-92
          - BPS-94
          description: 'Indonesian province code using BPS 2-digit numeric codes prefixed with BPS-. 34 provinces.
            Used for serviceability, tax zone determination, and logistics pricing.

            '
          example: BPS-31
          x-ion-regulatory: Permendagri 72/2019 tentang Perubahan atas Permendagri 137/2017
        kabupatenCode:
          type: string
          pattern: ^[0-9]{4}$
          description: 'BPS 4-digit kabupaten/kota code. 514 kabupaten and kota in Indonesia. Used for granular
            serviceability and tax zone resolution.

            '
          example: '3171'
          x-ion-regulatory: Permendagri 72/2019
        kelurahan:
          type: string
          description: 'Village or urban administrative zone (kelurahan/desa). Required for precise last-mile delivery
            address.

            '
          example: Gambir
          x-ion-condition: Required for delivery addresses
        kecamatan:
          type: string
          description: 'District or sub-city (kecamatan). Administrative level between kabupaten and kelurahan.

            '
          example: Gambir
          x-ion-condition: Required for delivery addresses
        rt:
          type: string
          description: 'Rukun Tetangga — neighborhood group, typically ~40 households. Critical for last-mile delivery
            in Indonesia — riders use RT/RW to locate specific houses in dense residential areas.

            '
          example: '02'
        rw:
          type: string
          description: 'Rukun Warga — association of RTs, typically ~400 people. Used together with RT for precise
            address resolution.

            '
          example: '03'
        addressType:
          type: string
          enum:
          - HOME
          - OFFICE
          - APARTMENT
          - BOARDING_HOUSE
          - WAREHOUSE
          - PO_BOX
          - PICKUP_POINT
          - OTHER
          description: 'Address classification. Affects delivery SLA and surcharges — offices have restricted delivery
            hours, apartments require lobby/concierge handling, warehouses accept larger shipments. BOARDING_HOUSE
            (kost) is common in Indonesian urban delivery.

            '
          example: HOME
        landmark:
          type: string
          description: 'Notable nearby landmark for finding the address. Common in Indonesian urban delivery where
            street numbering is inconsistent.

            '
          example: Sebelah Indomaret, seberang masjid
      # ION network mandatory: Indonesian address components required per BPS administrative hierarchy
      # NETWORK POLICY NOTE (GAP 32 / NFH-012 CON-012-18):
      # Shared schemas MUST NOT declare mandatory fields.
      # The following fields were required in v0.6.0 and are now
      # enforced via ION network policy (x-ion-crc-rules,
      # x-ion-conditional-rules) rather than the shared schema:
      # provinsiCode
      x-ion-closed-extensions: false
