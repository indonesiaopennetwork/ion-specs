openapi: 3.1.1
info:
  title: ION Participant Extension (v1)
  description: >
    Common participant identity attributes for ION transactions. Identifies the
    participant's role in the applicable relationship and carries either
    person or organization details using the pinned NFH schemas.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    IONParticipant:
      type: object
      title: IONParticipant
      description: >
        Common attributes describing the role and identity of a Beckn
        Participant in an ION relationship or transaction.
      additionalProperties: true
      x-ion-closed-extensions: false
      x-beckn-attaches-to: Participant.participantAttributes
      x-jsonld:
        '@context': https://schema.ion.id/release1/schema/common/IONParticipant/v1/context.jsonld
        '@type': ion:IONParticipant
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Attributes/2.0/attributes.yaml#/components/schemas/Attributes
      properties:
        role:
          type: string
          enum: [BUYER, PROVIDER, DRIVER, COURIER, CUSTOMS_BROKER]
          description: Role performed by the participant in the applicable relationship or transaction.
        person:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Person/2.0/attributes.yaml#/components/schemas/Person
          description: Natural-person identity details when the participant is an individual.
        organization:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Organization/2.0/attributes.yaml#/components/schemas/Organization
          description: Organization identity details when the participant is an organization.
