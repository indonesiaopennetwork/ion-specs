openapi: 3.1.1
info:
  title: ION Tax Detail Extension (v1)
  description: >
    Indonesia-specific classification and compliance semantics for a tax
    component in RetailConsideration.breakup[]. Extends the inherited
    taxDetail object; the containing breakup item carries the calculated tax
    amount. Attaches to:
    beckn:Consideration.considerationAttributes.breakup[].taxDetail
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONTaxDetail:
      type: object
      title: IONTaxDetail
      description: >
        Indonesia-specific extension of the RetailConsideration v2.1 taxDetail
        object. Inherits rate, included, and taxableBase. The containing
        breakup item's amount is the calculated tax amount.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Consideration.considerationAttributes.breakup[].taxDetail
      x-beckn-attaches-to: Consideration.considerationAttributes.breakup[].taxDetail
      x-jsonld:
        '@context': https://schema.ion.id/releases/release1/schema/common/Tax/v1/context.jsonld
        '@type': ion:IONTaxDetail
      additionalProperties: true
      allOf:
        - $ref: https://schema.ion.id/releases/release1/schema/vendored/beckn/schemas/RetailConsideration/2.1/attributes.yaml#/components/schemas/RetailConsideration/properties/breakup/items/properties/taxDetail
      properties:
        taxRegime:
          type: string
          enum:
          - PPN
          - PPNBM
          - PPH22
          - PPH23
          - PPN_FINAL
          - EXEMPT
          description: >
            Indonesian tax regime applied by this tax breakup entry. PPN is
            value-added tax; PPNBM is luxury-goods sales tax; PPH22 and PPH23
            are withholding regimes; PPN_FINAL is final VAT for applicable
            categories; EXEMPT identifies a non-taxable transaction.
          example: PPN
          x-ion-regulatory: UU 7/2021 tentang Harmonisasi Peraturan Perpajakan (HPP)
        taxCategory:
          type: string
          enum:
          - BKP
          - JKP
          - NON_BKP
          description: >
            Indonesian taxable-supply classification. BKP identifies taxable
            goods, JKP identifies taxable services, and NON_BKP identifies
            goods or services outside those taxable categories.
          example: BKP
          x-ion-regulatory: UU 8/1983 tentang PPN Pasal 4
        eFakturRef:
          type:
          - string
          - 'null'
          description: >
            DJP e-Faktur reference for the tax entry, when an electronic Faktur
            Pajak has been issued. Format: XXX.XXX-YY.XXXXXXXX.
          example: 010.000-26.00000001
          x-ion-regulatory: PMK 168/PMK.010/2023 tentang Faktur Pajak
      # rate replaces the removed taxRate and ppnRate/ppnbmRate properties.
      # included replaces the removed taxIncluded property.
      # taxableBase replaces the removed taxBaseAmount property.
      # breakup[].amount replaces the removed taxAmount property.
      # x-ion-condition: Required when taxRegime is not EXEMPT
      # x-ion-condition: Required for proper tax computation trail
      x-ion-closed-extensions: false
