openapi: 3.1.1
info:
  title: ION Location (v1)
  description: >
    ION-maintained Location shape aligned with ion-beckn.yaml. It accepts a
    GeoJSON geometry, an ION-maintained extensible Address, or both.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    Location:
      type: object
      title: Location
      description: >
        Geographic or postal representation of a place. At least one of geo or
        address must be supplied. Geometry is authoritative when both are present.
      additionalProperties: false
      anyOf:
        - required: [geo]
        - required: [address]
      x-jsonld:
        '@context': https://schema.ion.id/release1/schema/common/Location/v1/context.jsonld
        '@type': ion:Location
      properties:
        geo:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/GeoJSONGeometry/2.0/attributes.yaml#/components/schemas/GeoJSONGeometry
          description: GeoJSON geometry for the place.
        address:
          $ref: https://schema.ion.id/release1/schema/common/Address/v1/attributes.yaml#/components/schemas/Address
          description: Postal address, including its addressAttributes extension point.
