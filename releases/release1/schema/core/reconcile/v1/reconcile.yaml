openapi: 3.1.1
info:
  title: ION Settlement Reconciliation API
  version: 1.0.0
  description: >
    ION network extension to Beckn Protocol v2.0.0 for settlement
    reconciliation between the two network participants of an order: the
    Consumer Node (BAP) and the Provider Node (BPP).


    This file extends Beckn; it does not copy or embed it. Every Beckn type is
    referenced from the Release 1 vendored contract at
    https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml.
    Validate this file together with that contract; do not merge them.


    ION has no separate settle or report API. Reconciliation, agreement, and
    the payout trigger are all carried by `/reconcile` and `/on_reconcile`:

    1. Either participant (BAP or BPP) sends `/reconcile` with its figures for
       each contract whose settlement falls due on `settlementDate`.

    2. The counterparty answers with `/on_reconcile`, setting `accord` per
       contract. `accord: true` means both participants agree on that
       contract's figures; `accord: false` carries the counterparty's own
       figures, the per-component `diffValue`, and a `dispute` reason.

    3. For a contract with `accord: false`, the initiator sends a new
       `/reconcile` round with revised figures.

    4. The buyer's payment is held at the PJP (Penyelenggara Jasa
       Pembayaran), not in a participant's account. When a contract reaches
       `accord: true`, SEAM (Settlement Assurance Mechanism) instructs the PJP
       to pay it out of the held funds: `netPayable` to the BPP, `commission`
       to the BAP, each into the participant's account in
       `settlementAccounts`. SEAM may combine agreed contracts into a single
       transfer per participant. Payout status reaches the participants
       through the PJP's webhook, which is outside this specification.


    The settlement terms used to compute the figures (`settlementBasis`,
    `settlementWindow`, and `finderFee`) are agreed in `init` and `on_init`
    on `IONTradeContract`. The participants' bank accounts
    (`settlementAccounts`) are declared on `IONPayment` in
    `Contract.settlements[]`.


    Beckn v2.0 terminology applies: Consumer Node (CN) replaces BAP and
    Provider Node (PN) replaces BPP; the wire-level fields `bapId` and `bppId`
    are retained.
  contact:
    name: ION Network
    url: https://schema.ion.id
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{subscriberUrl}
    description: Base URL of the receiving network participant (resolved via the registry).
    variables:
      subscriberUrl:
        default: example.beckn.io

tags:
  - name: Post-Fulfillment
    description: Settlement reconciliation between the BAP and BPP of an order.

paths:
  /reconcile:
    post:
      summary: A participant submits its settlement figures for the due contracts
      operationId: reconcile
      tags: [Post-Fulfillment]
      description: >
        Sent by either participant of an order (BAP or BPP) to its
        counterparty, normally once per settlement date, listing every contract
        between them whose settlement falls due on that date, with the sender's
        figures for each. Also sent again for the same contracts as a new round
        after the counterparty disagrees.


        `context.bapId` and `context.bppId` are always the BAP and BPP of the
        original orders, whoever sends. `context.senderId` and
        `context.receiverId` identify the actual sender and receiver.
        `context.transactionId` identifies the reconciliation exchange; it is
        not any one contract's transactionId.


        Callback relationship: the receiver MUST answer with `/on_reconcile`
        correlated by `context.messageId`.
      parameters:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, message]
              properties:
                context:
                  allOf:
                    - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context'
                    - type: object
                      properties:
                        action:
                          type: string
                          const: reconcile
                message:
                  $ref: '#/components/schemas/ReconcileAction'
      responses:
        '200':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/Ack'
        '400':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/NackBadRequest'
        '401':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized'
        '409':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/NackConflict'
        '500':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/ServerError'

  /on_reconcile:
    post:
      summary: The counterparty agrees or disagrees with each contract's figures
      operationId: on_reconcile
      tags: [Post-Fulfillment]
      description: >
        Sent by the receiver of `/reconcile` back to its sender, correlated by
        `context.messageId`. For each contract it sets `accord`. A contract
        with `accord: true` is agreed by both participants, and SEAM instructs
        the PJP to pay it out of the held funds. A contract with `accord: false`
        carries the counterparty's own figures, a `diffValue` on each differing
        component, and a `dispute` reason; the initiator may then send a new
        `/reconcile` round for it.
      parameters:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, message]
              properties:
                context:
                  allOf:
                    - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Context'
                    - type: object
                      properties:
                        action:
                          type: string
                          const: on_reconcile
                message:
                  $ref: '#/components/schemas/OnReconcileAction'
      responses:
        '200':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/Ack'
        '400':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/NackBadRequest'
        '401':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized'
        '500':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/responses/ServerError'

components:
  schemas:
    ReconcileAction:
      title: Reconcile Action
      description: >
        The sender's settlement figures for one settlement date against one
        counterparty: the due contracts and their batch totals.
      type: object
      additionalProperties: false
      required: [reconciliationId, settlementDate, contracts, settlementSummary]
      properties:
        reconciliationId:
          type: string
          description: >
            Identifier of the reconciliation batch, unique per batch: the
            settlement date and UTC send time of the first round, plus the
            sender's subscriber ID — recon-<YYYY-MM-DD>T<HHMMSS>Z-<senderId>.
            Later rounds for the same contracts reuse it.
          examples: ['recon-2026-09-30T170000Z-bpp.example.id']
        settlementDate:
          type: string
          format: date
          description: The date whose due settlements this batch reconciles.
        contracts:
          type: array
          minItems: 1
          description: The sender's figures for each due contract.
          items:
            $ref: '#/components/schemas/ContractSettlement'
        settlementSummary:
          $ref: '#/components/schemas/SettlementSummary'

    OnReconcileAction:
      title: On Reconcile Action
      description: >
        The counterparty's answer to a reconciliation round: its verdict and
        figures for every contract in the round.
      type: object
      additionalProperties: false
      required: [reconciliationId, reconciliationStatus, contracts]
      properties:
        reconciliationId:
          type: string
          description: The reconciliationId of the /reconcile being answered.
        reconciliationStatus:
          type: string
          enum: [AGREED, PARTIALLY_AGREED, DISPUTED]
          description: >
            Batch-level outcome. AGREED — every contract has accord true.
            PARTIALLY_AGREED — some contracts have accord true; those proceed
            to payout while the rest continue to another round. DISPUTED — no
            contract has accord true.
        contracts:
          type: array
          minItems: 1
          description: The counterparty's verdict for every contract in the round.
          items:
            $ref: '#/components/schemas/ContractReconciliation'
        settlementSummary:
          description: The counterparty's own batch totals.
          $ref: '#/components/schemas/SettlementSummary'

    ContractSettlement:
      title: Contract Settlement
      description: >
        One participant's settlement figures for one contract. The buyer's
        payment for the contract is held at the PJP; the figures split it.
        Invariant: orderAmount.value = netPayable.value + commission.value +
        withholdingAmount.value + sum(taxes[].value) + refundAmount.value.
        On agreement the PJP pays netPayable to the BPP and commission to the
        BAP, returns refundAmount to the buyer, and keeps withholdingAmount.
      type: object
      required:
        - contractId
        - settlementId
        - currency
        - orderAmount
        - commission
        - netPayable
        - settlementAccounts
      properties:
        contractId:
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id'
        settlementId:
          description: >
            Id of the contract's payment record (Contract.settlements[].id)
            whose held funds this settlement pays out.
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Settlement/properties/id'
        collectedBy:
          description: >
            Participant whose checkout collected the buyer payment into the
            PJP, as declared on IONPayment.collectedBy. Informational: the
            funds are held at the PJP whichever participant collected them.
          $ref: 'https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/collectedBy'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code for every amount in this contract; IDR for domestic ION trade.
        settlementBasis:
          $ref: '#/components/schemas/SettlementBasis'
        settlementWindow:
          $ref: '#/components/schemas/SettlementWindow'
        orderAmount:
          description: Gross amount the buyer paid for the contract, held at the PJP.
          $ref: '#/components/schemas/ReconAmount'
        commission:
          description: >
            BAP finder fee for the contract, computed from
            IONTradeContract.finderFee; the PJP pays it to the BAP. Zero when
            no finder fee was agreed.
          $ref: '#/components/schemas/ReconAmount'
        withholdingAmount:
          description: Amount the PJP keeps back, for example against returns.
          $ref: '#/components/schemas/ReconAmount'
        taxes:
          type: array
          description: Taxes withheld from the BPP's proceeds, one entry per tax regime.
          items:
            $ref: '#/components/schemas/TaxDeduction'
        refundAmount:
          description: Total the PJP returns to the buyer for the contract.
          $ref: '#/components/schemas/ReconAmount'
        netPayable:
          description: >
            Amount the PJP pays to the BPP for this contract: orderAmount −
            commission − withholdingAmount − sum(taxes) − refundAmount.
          $ref: '#/components/schemas/ReconAmount'
        settlementAccounts:
          type: array
          minItems: 1
          description: >
            Payout accounts as declared on IONPayment.settlementAccounts in the
            order. The BPP account is always required; the BAP account is
            required when commission is greater than zero.
          items:
            $ref: 'https://schema.ion.id/release1/schema/common/Payment/v1/attributes.yaml#/components/schemas/SettlementAccount'
          contains:
            type: object
            properties:
              holderRole:
                const: BPP
            required: [holderRole]
        contract:
          description: >
            Optional copy of the contract as the sender holds it (status,
            commitments, consideration, settlements), for verification.
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Contract'
      if:
        properties:
          commission:
            properties:
              value:
                exclusiveMinimum: 0
            required: [value]
        required: [commission]
      then:
        properties:
          settlementAccounts:
            contains:
              type: object
              properties:
                holderRole:
                  const: BAP
              required: [holderRole]

    ContractReconciliation:
      title: Contract Reconciliation
      description: >
        The counterparty's verdict on one contract: its own figures (with
        diffValue where they differ from the round being answered) and accord.
      allOf:
        - $ref: '#/components/schemas/ContractSettlement'
        - type: object
          required: [accord]
          properties:
            accord:
              type: boolean
              description: >
                true — the counterparty agrees with the figures in /reconcile;
                both participants have agreed and SEAM triggers the payout.
                false — it disagrees; see diffValue and dispute.
            dueDate:
              type: string
              format: date
              description: Date by which the payout is due. Required when accord is true.
            dispute:
              description: Why the counterparty disagrees (code and human-readable text). Required when accord is false.
              $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Descriptor'
          if:
            properties:
              accord:
                const: true
            required: [accord]
          then:
            required: [dueDate]
          else:
            required: [dispute]

    ReconAmount:
      title: Reconciliation Amount
      description: >
        One settlement component. In /on_reconcile, diffValue is the
        counterparty's value minus the value in the /reconcile being answered;
        it is present only when the two differ.
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: number
          minimum: 0
        diffValue:
          type: number

    TaxDeduction:
      title: Tax Deduction
      description: A tax withheld from the payout under one Indonesian tax regime.
      type: object
      additionalProperties: false
      required: [taxRegime, value]
      properties:
        taxRegime:
          $ref: 'https://schema.ion.id/release1/schema/common/Tax/v1/attributes.yaml#/components/schemas/IONTaxDetail/properties/taxRegime'
        value:
          type: number
          minimum: 0
        diffValue:
          type: number
          description: Counterparty's value minus the value in /reconcile, when they differ.

    SettlementSummary:
      title: Settlement Summary
      description: >
        Batch totals over the contracts in the message, for cross-checking.
        Payouts are per contract (ContractSettlement.netPayable); there is no
        batch-level payable.
      type: object
      additionalProperties: false
      required:
        - bapId
        - bppId
        - currency
        - settlementDate
        - contractCount
        - totalOrderAmount
        - totalCommission
        - totalWithholding
        - totalTax
        - totalRefund
      properties:
        bapId:
          type: string
        bppId:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code; IDR for domestic ION trade.
        settlementDate:
          type: string
          format: date
        contractCount:
          type: integer
          minimum: 1
        totalOrderAmount:
          type: number
          description: Sum of contracts[].orderAmount.value.
        totalCommission:
          type: number
          description: Sum of contracts[].commission.value.
        totalWithholding:
          type: number
          description: Sum of contracts[].withholdingAmount.value.
        totalTax:
          type: number
          description: Sum of contracts[].taxes[].value.
        totalRefund:
          type: number
          description: Sum of contracts[].refundAmount.value.

    SettlementBasis:
      title: Settlement Basis
      description: >
        Contract lifecycle event from which a settlement falls due.
        ON_CONFIRMATION starts at order confirmation, AFTER_SHIPMENT at
        hand-over to logistics, AFTER_DELIVERY at confirmed delivery, and
        AFTER_RETURN_WINDOW when the applicable return window closes.
      type: string
      enum:
        - ON_CONFIRMATION
        - AFTER_SHIPMENT
        - AFTER_DELIVERY
        - AFTER_RETURN_WINDOW
      examples: [AFTER_DELIVERY]

    SettlementWindow:
      title: Settlement Window
      description: >
        ISO 8601 duration, measured from the SettlementBasis event, within
        which the settlement must be paid out.
      type: string
      format: duration
      examples: [P1D]
