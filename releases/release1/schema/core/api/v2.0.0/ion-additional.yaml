openapi: 3.1.1
info:
  title: ION Additional API
  version: 1.0.0
  description: >
    ION network endpoints that Beckn Protocol v2.0.0 does not define. This
    file holds every such endpoint in Release 1; new ION endpoints are added
    here rather than in separate files.


    This file extends Beckn; it does not copy or embed it. Every Beckn type is
    referenced from the Release 1 vendored upstream Beckn contract at
    https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml.
    Validate this file together with that contract; do not merge them.


    ## Settlement reconciliation (`/reconcile`, `/on_reconcile`)


    Settlement reconciliation runs between the two network participants of an
    order: the Consumer Node (BAP) and the Provider Node (BPP).


    ION has no separate settle or report API. Reconciliation, agreement, and
    the payout trigger are all carried by `/reconcile` and `/on_reconcile`:

    1. Either participant (BAP or BPP) sends `/reconcile` with the contracts
       whose settlements fall due on `settlementDate`. Each contract is a
       Beckn `Contract`; the sender's figures are in its
       `settlements[].settlementAttributes` as `IONSettlementReconciliation`
       (defined by the common/Settlement/v1 attribute pack). Each settlement
       states its own `orderDate` and `dueDate`.

    2. The counterparty answers with `/on_reconcile`, setting `accord` on
       every settlement. `accord: true` means both participants agree on that
       settlement's entitlements: the BAP's `commission` and the BPP's
       `netPayable`. `accord: false` carries the counterparty's own figures,
       the per-component `diffValue` (its value minus the value it answers),
       and a `dispute` code that makes the settlement disputed or, for
       `SETTLEMENT_WINDOW_NOT_REACHED` and `AWAITING_INFORMATION`, pending.

    3. Agreement is per settlement. An agreed settlement stays agreed and
       goes on to SEAM whatever happens to the others in the batch.
       `reconciliationStatus` only summarizes the answer: `AGREED` when every
       settlement is agreed, `DISPUTED` when any is disputed, and otherwise
       `PENDING`. The sender then sends only the disputed and pending
       settlements again, in a new `/reconcile` with the same
       `context.transactionId` and a new `context.messageId`, corrected or
       once due.

    4. `accord: true` is not a payout instruction. SEAM (Settlement
       Assurance Mechanism) separately verifies the funds, the accounts in
       `settlementAccounts` and that nothing is paid twice before it has an
       agreed settlement paid: `netPayable` to the BPP, or to the recipients
       the BPP splits it among, and `commission` to the BAP. A prepaid
       buyer payment is held at the PJP (Penyelenggara Jasa Pembayaran);
       `collections` records cash-on-delivery, credit and transfer
       collections. Payout status reaches the participants through the
       PJP's webhook, which is outside this specification.


    A reconciliation exchange is identified by `context.transactionId` and
    each request–callback pair by `context.messageId`; there is no separate
    reconciliation ID. Unlike a Beckn order flow, where the BAP starts the
    transaction, either participant may start a reconciliation exchange and
    create its `transactionId`. A plain retransmission repeats the same
    `messageId` and is processed once. The economic identity of a settlement
    is the BAP–BPP pair with `Contract.id` and `Settlement.id`; an agreed
    settlement is never paid twice, whichever message repeats it. A later
    correction is a new settlement with its own `Settlement.id` and
    `relatedSettlementId`.


    `IONSettlementReconciliation` is the order's payment settlement from
    `init` on: the participants' bank accounts (`settlementAccounts`) are
    agreed on it in `init` and `on_init`, and reconciliation sends the same
    object with each participant's figures. The settlement terms come from
    the offers: the payout terms from each offer's `policies.settlement`
    (`IONTradeOffer`) and the commission from each offer's
    `policies.commission` (`IONTradeOffer`), whose total for the order is the
    contract consideration's `commission.feeAmount` (`IONTradeConsideration`).


    A contract in these messages is a snapshot that carries reconciliation
    figures. It does not update the contract: `commitments` are included only
    because Beckn requires them, and receivers MUST NOT treat them as a change.


    Beckn v2.0 terminology applies: Consumer Node (CN) replaces BAP and
    Provider Node (PN) replaces BPP; the wire-level fields `bapId` and `bppId`
    are retained.
  contact:
    name: ION Network
    url: https://schema.ion.id
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{subscriberUrl}
    description: Base URL of the receiving network participant (resolved via the registry).
    variables:
      subscriberUrl:
        default: example.beckn.io

# As in the ION Beckn contract: requests are authenticated by the signed
# Authorization header parameter, not an OpenAPI security scheme.
security: []

tags:
  - name: Post-Fulfillment
    description: Settlement reconciliation between the BAP and BPP of an order.

paths:
  /reconcile:
    post:
      summary: A participant submits its settlement figures for the due contracts
      operationId: reconcile
      tags: [Post-Fulfillment]
      description: >
        Sent by either participant of an order (BAP or BPP) to its
        counterparty, normally once per settlement date, listing the contracts
        between them whose settlements fall due on that date, with the
        sender's figures for each. Settlements left disputed or pending are
        sent again, alone, in a new `/reconcile` with the same
        `context.transactionId` and a new `context.messageId`.


        `context.bapId` and `context.bppId` are always the BAP and BPP of the
        original orders, whoever sends. `context.senderId` and
        `context.receiverId` identify the actual sender and receiver.
        `context.transactionId` identifies the reconciliation exchange; it is
        not any one contract's transactionId, and the sender creates it
        whether it is the BAP or the BPP.


        Callback relationship: the receiver MUST answer with `/on_reconcile`
        correlated by `context.messageId`.
      parameters:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, message]
              properties:
                context:
                  allOf:
                    - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Context'
                    - type: object
                      properties:
                        action:
                          type: string
                          const: reconcile
                message:
                  $ref: '#/components/schemas/ReconcileAction'
      responses:
        '200':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/Ack'
        '400':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackBadRequest'
        '401':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized'
        '500':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/ServerError'

  /on_reconcile:
    post:
      summary: The counterparty agrees or disagrees with each contract's figures
      operationId: on_reconcile
      tags: [Post-Fulfillment]
      description: >
        Sent by the receiver of `/reconcile` back to its sender, with the same
        `context.transactionId` and `context.messageId`. It answers every
        settlement in the request and no other. On each settlement it sets
        `accord`; one with `accord: false` carries the counterparty's own
        figures, a `diffValue` on each differing component, and a `dispute`
        code. Agreed settlements go on to SEAM; the sender sends the disputed
        and pending ones again in a new `/reconcile`. Signed as a Beckn
        callback, whichever participant answers.
      parameters:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/parameters/CallbackAuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, message]
              properties:
                context:
                  allOf:
                    - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Context'
                    - type: object
                      properties:
                        action:
                          type: string
                          const: on_reconcile
                message:
                  $ref: '#/components/schemas/OnReconcileAction'
      responses:
        '200':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/Ack'
        '400':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackBadRequest'
        '401':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/NackUnauthorized'
        '500':
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/responses/ServerError'

components:
  schemas:
    ReconcileAction:
      title: Reconcile Action
      description: >
        The sender's reconciliation figures for one settlement date against one
        counterparty: the contracts to reconcile and their totals.
      type: object
      additionalProperties: false
      required: [settlementDate, contracts, settlementSummary]
      properties:
        settlementDate:
          type: string
          format: date
          description: >
            The business date of this reconciliation run, whose due
            settlements it carries. Each settlement's own orderDate and
            dueDate are in its settlementAttributes.
        contracts:
          type: array
          minItems: 1
          description: >
            The contracts to reconcile, each carrying the sender's figures on
            its settlements. A Contract.id appears once, and a Settlement.id
            once within its contract.
          items:
            $ref: '#/components/schemas/ReconcileContract'
        settlementSummary:
          $ref: '#/components/schemas/SettlementSummary'

    OnReconcileAction:
      title: On Reconcile Action
      description: >
        The counterparty's answer to a /reconcile: its figures and accord for
        every settlement in it.
      type: object
      additionalProperties: false
      required: [settlementDate, reconciliationStatus, contracts, settlementSummary]
      properties:
        settlementDate:
          type: string
          format: date
          description: The settlementDate of the /reconcile being answered.
        reconciliationStatus:
          type: string
          enum: [AGREED, DISPUTED, PENDING]
          description: >
            Summary of the answer; it does not override any settlement's
            accord. AGREED — every settlement has accord true. DISPUTED — at
            least one is disputed (accord false with a disputed code).
            PENDING — none is disputed, and at least one is pending
            (SETTLEMENT_WINDOW_NOT_REACHED or AWAITING_INFORMATION). Agreed
            settlements go on to SEAM in every case.
        contracts:
          type: array
          minItems: 1
          description: >
            The counterparty's figures and accord for every contract and
            settlement in the /reconcile, and no others.
          items:
            $ref: '#/components/schemas/OnReconcileContract'
        settlementSummary:
          description: >
            The counterparty's totals over its own figures, with the outcome
            counts and the agreed and unreconciled entitlements.
          allOf:
            - $ref: '#/components/schemas/SettlementSummary'
            - required:
                - agreedCount
                - disputedCount
                - pendingCount
                - totalAgreedCommission
                - totalUnreconciledCommission
                - totalAgreedNetPayable
                - totalUnreconciledNetPayable

    ReconcileContract:
      title: Reconcile Contract
      description: >
        A Beckn Contract snapshot whose settlements carry reconciliation
        figures. id identifies the contract; each settlement's id identifies
        a settlement obligation, prepaid or not.
      allOf:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract'
        - type: object
          required: [id, settlements]
          properties:
            id:
              $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id'
            settlements:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ReconcileSettlement'

    ReconcileSettlement:
      title: Reconcile Settlement
      description: A settlement with the sender's figures.
      type: object
      required: [id, settlementAttributes]
      properties:
        id:
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Settlement/properties/id'
        settlementAttributes:
          $ref: 'https://schema.ion.id/release1/schema/common/Settlement/v1/attributes.yaml#/components/schemas/IONSettlementReconciliation'

    OnReconcileContract:
      title: On Reconcile Contract
      description: A ReconcileContract whose settlements carry the counterparty's figures and accord.
      allOf:
        - $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract'
        - type: object
          required: [id, settlements]
          properties:
            id:
              $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id'
            settlements:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OnReconcileSettlement'

    OnReconcileSettlement:
      title: On Reconcile Settlement
      description: >
        A settlement with the counterparty's figures and its accord; dispute
        is required when accord is false, dueDate when it is true.
      type: object
      required: [id, settlementAttributes]
      properties:
        id:
          $ref: 'https://schema.ion.id/release1/schema/vendored/beckn/api/v2.0.0/beckn.yaml#/components/schemas/Settlement/properties/id'
        settlementAttributes:
          allOf:
            - $ref: 'https://schema.ion.id/release1/schema/common/Settlement/v1/attributes.yaml#/components/schemas/IONSettlementReconciliation'
            - type: object
              required: [accord]

    SettlementSummary:
      title: Settlement Summary
      description: >
        Totals over the settlements in the message, for cross-checking, from
        the sending participant's own figures. Payouts are per settlement;
        there is no batch-level payable. The outcome counts and agreed and
        unreconciled totals appear only in /on_reconcile.
      type: object
      additionalProperties: false
      required:
        - bapId
        - bppId
        - currency
        - settlementDate
        - contractCount
        - totalOrderAmount
        - totalCommission
        - totalWithholding
        - totalRefund
        - totalNetPayable
      properties:
        bapId:
          type: string
        bppId:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code; IDR for domestic ION trade. Every settlement in the message uses it.
        settlementDate:
          type: string
          format: date
        contractCount:
          type: integer
          minimum: 1
        settlementCount:
          type: integer
          minimum: 1
          description: Number of settlements in the message.
        agreedCount:
          type: integer
          minimum: 0
          description: >
            /on_reconcile only: contracts whose settlements all have accord
            true. agreedCount + disputedCount + pendingCount = contractCount.
        disputedCount:
          type: integer
          minimum: 0
          description: /on_reconcile only — contracts with at least one disputed settlement.
        pendingCount:
          type: integer
          minimum: 0
          description: >
            /on_reconcile only: contracts with no disputed settlement and at
            least one pending one.
        agreedSettlementCount:
          type: integer
          minimum: 0
          description: >
            /on_reconcile only, optional: settlements with accord true. With
            the disputed and pending settlement counts it adds up to
            settlementCount.
        disputedSettlementCount:
          type: integer
          minimum: 0
          description: /on_reconcile only, optional — disputed settlements.
        pendingSettlementCount:
          type: integer
          minimum: 0
          description: /on_reconcile only, optional — pending settlements.
        totalOrderAmount:
          type: number
          description: Sum of orderAmount.value over the message's settlements.
        totalCommission:
          type: number
          description: Sum of commission.value — the BAP's entitlement.
        totalWithholding:
          type: number
          description: Sum of withholdingAmount.value.
        totalRefund:
          type: number
          description: Sum of refundAmount.value.
        totalNetPayable:
          type: number
          description: Sum of netPayable.value — the BPP's entitlement.
        totalAgreedCommission:
          type: number
          minimum: 0
          description: /on_reconcile only — sum of commission.value over the settlements with accord true.
        totalUnreconciledCommission:
          type: number
          minimum: 0
          description: >
            /on_reconcile only: sum of the counterparty's commission.value
            over the settlements with accord false. Its own claim, not an
            agreed amount.
        totalAgreedNetPayable:
          type: number
          minimum: 0
          description: /on_reconcile only — sum of netPayable.value over the settlements with accord true.
        totalUnreconciledNetPayable:
          type: number
          minimum: 0
          description: >
            /on_reconcile only: sum of the counterparty's netPayable.value
            over the settlements with accord false. Its own claim, not an
            agreed amount.
        orderDayCounts:
          type: array
          description: >
            Optional, informational: for each order day the message touches,
            the sending participant's own count of the pair's orders created
            that day, including those not yet due. The two participants'
            counts may differ; a difference is for them to investigate.
          items:
            $ref: '#/components/schemas/OrderDayCount'

    OrderDayCount:
      title: Order Day Count
      description: One order day's counts, from the sending participant's own records.
      type: object
      additionalProperties: false
      required: [orderDate, reportedOrderCount]
      properties:
        orderDate:
          type: string
          format: date
          description: Order creation date in Asia/Jakarta time.
        reportedOrderCount:
          type: integer
          minimum: 0
          description: Orders between the BAP and BPP created on orderDate.
        remainingOrderCount:
          type: integer
          minimum: 0
          description: >
            Of those, orders not yet fully reconciled: not due, pending,
            disputed or not yet sent.
