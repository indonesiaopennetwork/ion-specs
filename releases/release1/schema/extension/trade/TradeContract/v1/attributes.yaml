openapi: 3.1.1
info:
  title: ION Trade Contract Extension (v1)
  description: >
    Trade-sector contract attributes. Inherits buyer instructions, delivery
    preferences, gifting, invoice preferences, loyalty, quote reference, and
    source attribution from RetailContract v2.1. Adds contract-level purchase
    order, parent-contract, cancellation, subscription, gifting-recipient, and
    source-attribution refinements. Attaches to:
    beckn:Contract.contractAttributes.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    IONTradeContract:
      type: object
      title: IONTradeContract
      description: >
        ION trade contract attributes. Inherits directly from RetailContract v2.1
        and combines generic contract semantics with Indonesia-specific invoice
        preferences and buyer business registration.

        Properties originating in the former ION-specific layer are identified by
        x-attr-ion-layer: ion.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Contract.contractAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeContract/v1/context.jsonld'
        '@type': ion:IONTradeContract
      x-beckn-attaches-to: Contract.contractAttributes
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract
      properties:
        quoteReference:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/quoteReference

        buyerInstructions:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/buyerInstructions

        deliveryPreferences:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/deliveryPreferences

        loyalty:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/loyalty

        purchaseOrderReference:
          type: string
          description: >
            Buyer-issued purchase-order reference for business or government
            procurement. This is distinct from inherited quoteReference, which
            identifies the seller quote or pro-forma invoice preceding the
            Contract.
          example: PO-2026-00456
          # x-ion-condition: Required by network policy for applicable procurement patterns

        parentContractId:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Contract/properties/id
          description: >
            Identifier of the parent Contract when this Contract is a child
            transaction, such as a recurring delivery generated by a
            subscription. Trade-to-logistics linkage belongs on
            LogisticsContract.parentContractReference instead.

        cancellation:
          type: object
          additionalProperties: false
          description: >
            Cancellation request or outcome recorded on this Contract. The
            reason code should match the cancellation policy governing the
            selected Offer. Partial cancellation identifies the affected core
            Commitment IDs.
          properties:
            reason:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Descriptor
              description: >
                Machine- and human-readable cancellation reason. Descriptor.code
                is the policy-comparable reason code.
            commitmentIds:
              type: array
              uniqueItems: true
              description: Core Commitment IDs affected by a partial cancellation.
              items:
                $ref: https://schema.ion.id/release1/schema/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Commitment/properties/id
            forced:
              type: boolean
              description: >
                True when cancellation is forced because the provider missed
                the applicable response or status SLA.
            lastProviderInteractionAt:
              type: string
              format: date-time
              description: >
                Timestamp of the last provider interaction supporting a forced
                cancellation.
            expectedStatusBy:
              type: string
              format: date-time
              description: >
                Time by which the provider was expected to report the next
                status under the governing SLA.
          # x-ion-condition: reason is required by network policy on cancellation
          # x-ion-condition: commitmentIds is required by network policy for partial cancellation
          # x-ion-condition: forced evidence is required by network policy when forced is true

        subscription:
          type: object
          additionalProperties: false
          description: >
            Contract-level terms and current state for a recurring trade
            subscription. Individual billing obligations and payment events
            remain in Consideration, Payment, and Settlement.
          properties:
            billingCycle:
              type: string
              enum:
                - WEEKLY
                - FORTNIGHTLY
                - MONTHLY
                - QUARTERLY
                - ANNUAL
            trialDays:
              type: integer
              minimum: 0
              description: Number of trial days before recurring billing begins.
            status:
              type: string
              enum:
                - ACTIVE
                - PAUSED
                - CANCELLED
              description: Current subscription lifecycle state.
            pausedUntil:
              type: string
              format: date-time
              description: Time at which a paused subscription resumes automatically.
            nextBillingAt:
              type: string
              format: date-time
              description: Expected next billing event for the subscription.
          # x-ion-condition: billingCycle is required by network policy for subscription patterns
          # x-ion-condition: pausedUntil is required by network policy for a time-bounded pause

        source:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/source
            - type: object
              description: >
                Inherited transaction source enriched with channel-neutral
                content, creator, affiliate, and group-buy attribution.
              properties:
                sessionId:
                  type: string
                  description: Source session identifier, such as a live-stream session.
                creatorId:
                  type: string
                  description: Creator or streamer participant identifier.
                affiliateId:
                  type: string
                  description: Affiliate participant identifier.
                platform:
                  type: string
                  description: Platform on which the source content was presented.
                contentId:
                  type: string
                  description: Video, post, advertisement, episode, or other source-content identifier.
                contentTimestampSeconds:
                  type: integer
                  minimum: 0
                  description: Playback position at which the traded resource was presented.
                groupBuyId:
                  type: string
                  description: Group-buy session identifier.

        gift:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/gift
            - type: object
              description: >
                Inherited gifting preferences enriched with recipient and
                presentation details.
              properties:
                recipientName:
                  type: string
                recipientPhone:
                  type: string
                hideSenderInfo:
                  type: boolean
                  default: false
                  description: Whether sender identity is hidden from recipient-visible material.
                showPrice:
                  type: boolean
                  default: false
                  description: Whether prices appear on recipient-visible material.

      # Inherited through property-level references: quoteReference,
      # buyerInstructions, deliveryPreferences, loyalty, and the base gift,
      # invoicePreferences, and source structures.
      #
      # Relocated ownership:
      # - fulfillingLocationId -> TradePerformance
      # - credit terms, payment due date, refund destination -> core/payment,
      #   attached through Settlement.settlementAttributes
      # - COD and monetary changes -> TradeConsideration
      # - payment schedules -> Consideration plus Settlement records
      # - cancellation/dispute eligibility -> TradeOffer policies
      # - detailed reconciliation -> core/reconcile
        invoicePreferences:
          x-attr-ion-layer: ion
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailContract/2.1/attributes.yaml#/components/schemas/RetailContract/properties/invoicePreferences
            - type: object
              description: >
                Inherited invoice preferences enriched with the requested ION
                invoice-document type. Tax identity remains in inherited taxId.
              properties:
                invoiceType:
                  type: string
                  enum:
                    - RECEIPT
                    - TAX_INVOICE
                    - EINVOICE
                    - SURAT_TAGIHAN
                    - COMMERCIAL_INVOICE
                  description: >
                    Requested invoice-document type. TAX_INVOICE and EINVOICE
                    are used for Indonesian tax invoicing; SURAT_TAGIHAN is a
                    commercial billing document; COMMERCIAL_INVOICE supports
                    cross-border trade.
                  x-ion-regulatory: PMK 168/PMK.010/2023 tentang Faktur Pajak
          # x-ion-condition: taxId is required by network policy for applicable tax-invoice requests

        buyerBusinessRegistration:
          x-attr-ion-layer: ion
          allOf:
            - $ref: https://schema.ion.id/release1/schema/common/BusinessRegistration/v1/attributes.yaml#/components/schemas/IONBusinessRegistration
          description: >
            Verified Indonesian business registration of the buying
            organisation when business identity is required for procurement,
            credit, or tax invoicing.
          # x-ion-condition: Required by network policy for applicable B2B procurement patterns

      # Faktur Pajak reference moved to
      # Consideration.breakup[].taxDetail.eFakturRef.
      # x-ion-regulatory: PMK 168/PMK.010/2023 tentang Faktur Pajak
      #
      # Bea Cukai declaration moved to the associated
      # IONLogisticsContract.beaCukaiDeclaration.
      # x-ion-regulatory: UU 17/2006 tentang Kepabeanan; PMK 199/PMK.010/2019
      #
      # Top-level nib, npwp, and legalEntityName were replaced by
      # buyerBusinessRegistration. Invoice tax IDs use inherited
      # invoicePreferences.taxId.
      # x-ion-regulatory: PP 5/2021 tentang Penyelenggaraan Perizinan Berusaha Berbasis Risiko
      # x-ion-regulatory: PMK 136/2023 tentang Perubahan atas PMK No 112/PMK.03/2022
      x-ion-closed-extensions: false
