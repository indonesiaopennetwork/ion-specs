openapi: 3.1.1
info:
  title: ION Trade Commitment Extension (v1)
  description: 'Trade sector commitment attributes for committed prices, selected add-ons,
    customizations, special instructions, and replacement preference. Core commitment identity,
    resources, offers, and quantities remain on beckn:Commitment. Attaches to:
    beckn:Commitment.commitmentAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONTradeCommitment:
      type: object
      title: IONTradeCommitment
      description: >
        Trade-specific attributes of a Beckn Commitment. Core Commitment fields
        identify the commitment, resources, quantities, and offer; this extension
        carries only the line-specific commercial and buyer-selection details that
        are not represented by the core object.
      x-recommended-parent: Commitment.commitmentAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeCommitment/v1/context.jsonld'
        '@type': ion:IONTradeCommitment
      x-beckn-attaches-to: Commitment.commitmentAttributes
      x-ion-closed-extensions: false
      properties:
        price:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/PriceSpecification/2.0/attributes.yaml#/components/schemas/PriceSpecification
          description: Committed post-discount price for this commitment.
          x-jsonld-id: rccma:price
        originalPrice:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/PriceSpecification/2.0/attributes.yaml#/components/schemas/PriceSpecification
          description: >
            Pre-discount price for display and audit. Omit when it is equal to
            price and no discount applies.
          x-jsonld-id: rccma:originalPrice
        addOnIds:
          type: array
          description: >
            Identifiers of offer add-ons selected for this commitment. Add-ons are
            defined by the selected Offer; this field records the buyer's selection.
          items:
            type: string
          x-jsonld-id: rccma:addOnIds
        selectedCustomizations:
          type: array
          description: >
            Customization options selected for this commitment. The combination of
            groupId and optionId must identify each selection without ambiguity;
            label is display-only.
          items:
            type: object
            required: [groupId, optionId]
            properties:
              groupId:
                type: string
                description: Identifier of the customization group.
                x-jsonld-id: rccma:customizationGroupId
              optionId:
                type: string
                description: Identifier of the selected option within the group.
                x-jsonld-id: rccma:customizationOptionId
              label:
                type: string
                description: Human-readable display label for the selection.
                x-jsonld-id: rccma:customizationLabel
          x-jsonld-id: rccma:selectedCustomizations
        specialInstructions:
          type: string
          description: Buyer instructions that apply specifically to this commitment.
          x-jsonld-id: rccma:specialInstructions
        replacementPreferred:
          type: boolean
          description: >
            Whether the buyer prefers replacement over refund for this committed
            line if the supplied resource is defective, incorrect, or otherwise
            eligible for remediation. This is line-specific because different
            commitments in the same contract may require different remedies.
          default: false
      # x-ion-condition: Required for COMPOSED and WITH_EXTRAS resources
