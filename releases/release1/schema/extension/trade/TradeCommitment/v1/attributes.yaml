openapi: 3.1.1
info:
  title: ION Trade Commitment Extension (v1)
  description: 'Trade sector commitment attributes. Inherits line identifiers, resource and offer references,
    quantity, committed prices, selected customizations, and special instructions from RetailCommitment v2.1.
    Adds trade semantics for ION. Attaches to:
    beckn:Commitment.commitmentAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONTradeCommitment:
      type: object
      title: IONTradeCommitment
      description: >
        ION trade commitment attributes. Inherits directly from RetailCommitment v2.1
        and adds replacement preference semantics. The former ION-specific layer
        defined no additional properties, so no x-attr-ion-layer markers are needed.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Commitment.commitmentAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeCommitment/v1/context.jsonld'
        '@type': ion:IONTradeCommitment
      x-beckn-attaches-to: Commitment.commitmentAttributes
      x-ion-closed-extensions: false
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailCommitment/2.1/attributes.yaml#/components/schemas/RetailCommitment
      properties:
        replacementPreferred:
          type: boolean
          description: >
            Whether the buyer prefers replacement over refund for this committed
            line if the supplied resource is defective, incorrect, or otherwise
            eligible for remediation. This is line-specific because different
            commitments in the same contract may require different remedies.
          default: false
      # selectedCustomizations is inherited from RetailCommitment v2.1.
      # x-ion-condition: Required for COMPOSED and WITH_EXTRAS resources
      # RetailCommitment v2.1 requires lineId, resourceId, and quantity.
      # ION network policy additionally requires offerId. These inherited
      # compatibility fields overlap the direct Commitment.id, resources,
      # and offer properties in the current Beckn core model.
