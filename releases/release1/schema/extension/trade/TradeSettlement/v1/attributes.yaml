openapi: 3.1.1
info:
  title: ION Trade Settlement Extension (v1)
  description: >
    Trade-sector settlement discharge attributes. Inherits the settlement
    method, payment rail, gateway, settled amount, refund, adjustment, and
    reconciliation structures defined by RetailSettlement v2.1 for ION.
    Buyer-facing payment declaration fields
    belong to core/payment/v1; detailed reconciliation fields belong to
    core/reconcile/v1. Attaches to:
    beckn:Settlement.settlementAttributes.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    IONTradeSettlement:
      type: object
      title: IONTradeSettlement
      description: >
        ION trade settlement attributes. Inherits RetailSettlement v2.1 and
        exposes its fields through property-level references so the local
        OpenAPI and JSON-LD artifacts remain aligned, and adds the ION
        settlement due-date terms settlementBasis and settlementWindow.
        Properties originating in the ION-specific layer are identified by
        x-attr-ion-layer: ion.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Settlement.settlementAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeSettlement/v1/context.jsonld'
        '@type': ion:IONTradeSettlement
      x-beckn-attaches-to: Settlement.settlementAttributes
      x-ion-closed-extensions: false
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement
      properties:
        gateway:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/gateway
        method:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/method
        paymentRail:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/paymentRail
        settledAt:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/settledAt
        settledAmount:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/settledAmount
        currency:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/currency
        refund:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/refund
        adjustments:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/adjustments
        reconciliationId:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/reconciliationId
        reconciliationStatus:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailSettlement/2.1/attributes.yaml#/components/schemas/RetailSettlement/properties/reconciliationStatus
        settlementBasis:
          type: string
          x-attr-ion-layer: ion
          enum:
            - ON_CONFIRMATION
            - AFTER_SHIPMENT
            - AFTER_DELIVERY
            - AFTER_RETURN_WINDOW
          description: >
            Contract lifecycle event from which the settlement falls due.
            ON_CONFIRMATION starts at order confirmation, AFTER_SHIPMENT at
            hand-over to logistics, AFTER_DELIVERY at confirmed delivery, and
            AFTER_RETURN_WINDOW when the applicable return window closes.
          example: AFTER_DELIVERY
        settlementWindow:
          type: string
          format: duration
          x-attr-ion-layer: ion
          description: >
            ISO 8601 duration, measured from the settlementBasis event, within
            which the collector must settle with the receiver.
          example: P1D
      #
      # Payment intent, collection timing, collector, payment status, and
      # instrument details are modeled by core/payment/v1 IONPayment.
      # Settlement basis and settlement window are owned by this pack in
      # Release 1. Reconciliation calculations and disputes are modeled by
      # core/reconcile/v1 IONReconcile.
      # Domestic ION policy: currency is IDR unless an applicable cross-border
      # agreement explicitly permits another ISO 4217 settlement currency.
      # Removed duplicate payment declarations previously owned here:
      # method, paymentRail, collectedBy, timing, status, currency, amount,
      # methodDetail, gatewayRef, and paidAt.
      # Removed flat refund fields in favor of inherited RetailSettlement.refund.
      # Removed reconciliation details duplicated by core/reconcile/v1.
