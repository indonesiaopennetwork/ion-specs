openapi: 3.1.1
info:
  title: ION Trade Resource Extension (v1)
  description: >
    Trade sector resource attributes for the Indonesia Open Network.
    Properties are split across two layers following the Beckn schema inheritance model:

    1. RetailResource (schema.beckn.io) — inherited via allOf, not defined here.
       Covers: resourceStructure, resourceTangibility, variantGroup, variantMatrix,
       customisationGroups, productCode, images, imageSet, videos, itemRating,
       logisticsServiceType, availability, identity, physical, packaged
       (packagedGoodsDeclaration), ageRestricted, minAge, countryOfOrigin,
       canonicalId, featuredOfferEligible, featuredOfferScore, bundleComposition,
       brandIdentity, parentResourceId, isDefaultVariant.

    2. IONTradeResource (this file) — fields useful for retail across
       any geography, not yet in RetailResource: name, shortDesc, menuCategory,
       preparationTime, food, preparation, fashion, electronics, beauty, agritech,
       pharmacy, installation, usage, warranty; plus Indonesia-specific fields:
       crc, regulatory, regionOfOrigin, digital, and dataResidency. Indonesia-specific
       fields are identified by x-attr-ion-layer: ion.

    Availability model: stock count is NEVER transmitted. Only availability signal.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:

    LocalisedText:
      type: object
      title: LocalisedText
      description: >
        Language-keyed text object for multilingual content. The 'id' key carries
        Bahasa Indonesia text and is always required. The 'en' key carries English
        text and is required for cross-border patterns.
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
          description: Bahasa Indonesia text value.
        en:
          type: string
          description: English text value. Required for cross-border pattern.

    # ─────────────────────────────────────────────────────────────────────
    # IONTradeResource
    # Inherits from RetailResource v2.1 at schema.beckn.io via allOf.
    # Adds generic trade fields and explicitly marked Indonesia-specific fields
    # that are not yet part of the upstream RetailResource schema.
    # ─────────────────────────────────────────────────────────────────────
    IONTradeResource:
      type: object
      title: IONTradeResource
      description: >
        ION Trade sector resource attributes. Inherits from RetailResource v2.1
        (schema.beckn.io) via allOf, which provides the core retail fields
        (resourceStructure, variants, images, availability, physical, packaged
        goods, age restriction, country of origin, etc.).

        This schema adds fields that are useful for retail networks in general,
        plus Indonesia-specific regulatory and compliance fields. Properties
        specific to Indonesia are identified by x-attr-ion-layer: ion.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Resource.resourceAttributes
      additionalProperties: true
      x-ion-closed-extensions: false
      x-beckn-attaches-to: Resource.resourceAttributes
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeResource/v1/context.jsonld'
        '@type': ion:IONTradeResource
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource
        # NOTE Conditional validation rules have been removed. They were
        # If resourceStructure is [VARIANT] then [parentResourceId,isDefaultVariant,variantGroup] are required
        # If resourceStructure is [COMPOSED, WITH_EXTRAS] then [customizationGroups] is required
        # If ageRestricted is true, then [minAge] is required
        # If regionOfOrigin is present, then [geographicIndicaitonCert] is required
      properties:
        # Inherited properties repeated as refs so this pack's standalone JSON-LD
        # context and vocabulary can declare their upstream-owned terms.
        ageRestricted:
          $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/ageRestricted

        foodRegulatoryDeclaration:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/foodRegulatoryDeclaration
            - type: object
              properties:
                additives:
                  $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/foodRegulatoryDeclaration/properties/additives

        credentials:
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/credentials
            - type: array
              items:
                type: object
                properties:
                  type:
                    $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/credentials/items/properties/type
                  uri:
                    $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/credentials/items/properties/uri
                  issuer:
                    $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/credentials/items/properties/issuer

        menuCategory:
          type: object
          additionalProperties: false
          description: >
            Menu or category section this resource belongs to. Used by food service
            and marketplace providers to group resources for display. Drives display
            order and grouping in BAP interfaces.
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: object
              additionalProperties:
                type: string
            sequence:
              type: integer
              description: Display order of this category relative to others.
            imageUrl:
              type: string
              format: uri
          x-ion-condition: Required for food and beverage providers

        preparationTime:
          type: string
          format: duration
          description: >
            ISO 8601 duration. Time from order confirmation to item ready for
            pickup or dispatch. Used for SLA computation and estimated delivery
            time display to the consumer. Applicable to made-to-order food,
            custom-built products, and services with lead times.
          example: PT20M
          x-ion-condition: Required for food, beverage and made-to-order items

        food:
          description: >
            Packaged food product attributes for filtering and regulatory compliance.
            Use for FMCG packaged food, grocery products, bottled beverages,
            packaged meal kits, snacks, and confectionery sold from warehouse stock.
            Do not use for restaurant or cloud kitchen menu items — those use
            MenuItem in the Hospitality sector (hospitality/menu-item/v1).
            Detailed nutritional information and ingredient lists belong in
            Descriptor.longDesc for agent readability.
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/food
            - type: object
              properties:
                classification:
                  $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/food/properties/classification
                allergens:
                  type: array
                  items:
                    type: string
                    enum: [GLUTEN, NUTS, DAIRY, EGGS, SOY, SHELLFISH, FISH, SESAME,
                           SULPHITES, CELERY, MUSTARD, LUPIN]
                cuisineType:
                  type: string
                  example: Padang
                spiceLevel:
                  type: string
                  description: >
                    Spiciness level of the food item. Free-text to accommodate regional
                    descriptors (e.g. "Pedas Sedang", "Level 3", "Extra Hot").
                  x-ion-suggested-values: [NONE, LOW, MEDIUM, HIGH, EXTRA_HOT]
                  example: MEDIUM
                freshProduce:
                  type: object
                  additionalProperties: false
                  properties:
                    netQuantityDeclaration:
                      allOf:
                        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
                      description: Declared net quantity of the fresh produce.
                      example:
                        unitQuantity: 1
                        unitText: kg
                    harvestDate:
                      type: string
                      format: date
          unevaluatedProperties: false
          x-ion-condition: Required for food and beverage resources

        preparation:
          type: object
          additionalProperties: false
          description: >
            Preparation, storage, and shelf-life instructions for the resource.
            Applicable to food, beverage, perishable, and made-to-order products.
            Detailed cooking instructions and usage guides belong in Descriptor.longDesc.
          properties:
            instructions:
              type: string
              example: Panggang di oven 200°C selama 15 menit
            storage:
              type: string
              example: Simpan di tempat sejuk dan kering
            shelfLife:
              type: string
              format: duration
              description: ISO 8601 duration from production date.
              example: PT2H
          x-ion-condition: Required for food, beverage and perishable products

        fashion:
          type: object
          additionalProperties: false
          description: >
            Fashion and apparel attributes for filtering, size guidance and regulatory
            compliance (fabricComposition under SNI). Besides gender and size, the pack
            carries the attributes Indonesian fashion sellers state for every product —
            garment type, the wastra (batik, tenun, songket, ...) and how it was made,
            motif, dye, fit, sleeve, neckline, occasion, garment measurements and care —
            so buyer apps can filter and compare on them. The region a motif or weave
            comes from is IONTradeResource.regionOfOrigin; colour is
            physical.appearance.color. Descriptor.longDesc remains the place for prose.
          properties:
            gender:
              type: string
              enum: [MALE, FEMALE, UNISEX, BOYS, GIRLS]
            size:
              type: string
              example: L
            sizeChart:
              type: string
              format: uri
            fabric:
              type: string
              example: Katun
            fabricComposition:
              type: string
              example: 100% Katun
              x-ion-regulatory: PerBSN SNI 0055:2009
            garmentType:
              type: string
              enum: [SHIRT, BLOUSE, T_SHIRT, DRESS, SKIRT, TROUSERS, OUTERWEAR, JACKET,
                     KEBAYA, KOKO_SHIRT, SARONG, FABRIC, SCARF, HIJAB, OTHER]
              description: What the item is. FABRIC is uncut cloth (kain) sold by the piece.
            textileType:
              type: string
              enum: [BATIK, TENUN, SONGKET, IKAT, LURIK, KARAWO, PLAIN, PRINTED, KNIT, OTHER]
              description: >
                The textile or Indonesian wastra the item is made of. TENUN is woven
                cloth (e.g. tenun Troso), KARAWO is Gorontalo embroidery work.
            productionTechnique:
              type: string
              enum: [BATIK_TULIS, BATIK_CAP, BATIK_KOMBINASI, BATIK_PRINTING, TENUN_ATBM,
                     TENUN_GEDOG, HAND_EMBROIDERY, MACHINE_EMBROIDERY, MACHINE_MADE, OTHER]
              description: >
                How the textile was made. BATIK_TULIS is hand-drawn with a canting,
                BATIK_CAP is stamped, BATIK_KOMBINASI mixes both, BATIK_PRINTING is
                printed and not batik in the strict sense. TENUN_ATBM is woven on a
                non-machine loom (alat tenun bukan mesin), TENUN_GEDOG on a backstrap loom.
            motif:
              type: string
              example: Parang Rusak
              description: Name of the motif or pattern, e.g. Kawung, Mega Mendung, Punta Betawi.
            dyeType:
              type: string
              enum: [NATURAL, SYNTHETIC, MIXED]
              description: Natural (plant-based) or synthetic dyes.
            handmade:
              type: boolean
              description: Made by hand (e.g. batik tulis, hand-woven tenun).
            lining:
              type: string
              example: Trikot halus
              description: Inner lining (furing), if any.
            fit:
              type: string
              enum: [SLIM, REGULAR, LOOSE, OVERSIZED, A_LINE]
            sleeveLength:
              type: string
              enum: [SLEEVELESS, SHORT, THREE_QUARTER, LONG]
            neckline:
              type: string
              example: Kerah V
              description: Collar or neckline style.
            occasion:
              type: array
              items:
                type: string
                enum: [CASUAL, OFFICE, FORMAL, PARTY, WEDDING, RELIGIOUS, TRADITIONAL_CEREMONY, SPORT]
            measurements:
              type: object
              additionalProperties: false
              description: Garment measurements in centimetres, for the size given in size.
              properties:
                chestCm: {type: number, minimum: 0, description: Chest width (lingkar dada).}
                waistCm: {type: number, minimum: 0, description: Waist (lingkar pinggang).}
                hipCm: {type: number, minimum: 0, description: Hip (lingkar pinggul).}
                lengthCm: {type: number, minimum: 0, description: Body length (panjang badan).}
                shoulderCm: {type: number, minimum: 0, description: Shoulder width (lebar bahu).}
                sleeveLengthCm: {type: number, minimum: 0, description: Sleeve length (panjang lengan).}
            careInstructions:
              type: array
              items:
                type: string
                enum: [HAND_WASH, MACHINE_WASH_COLD, DRY_CLEAN_ONLY, DO_NOT_BLEACH,
                       DRY_IN_SHADE, IRON_LOW, DO_NOT_WRING]
              description: Washing and care. Natural-dye batik is usually hand-washed and dried in the shade.
          x-ion-condition: Required for fashion and apparel products

        electronics:
          type: object
          additionalProperties: false
          description: >
            Consumer electronics technical specifications for filtering, comparison and
            regulatory compliance (energyRating, wattage, Indonesian SDPPI certification
            and TKDN local content). Besides OS and connectivity, the pack carries the
            specifications buyers compare on — device type, model, processor, memory,
            storage, display, battery, power and plug, ingress rating — and the warranty
            provider (an official Indonesian warranty matters to buyers). Warranty
            duration and terms are IONTradeResource.warranty; colour is
            physical.appearance.color. Datasheets still belong in Descriptor.docs[].
          properties:
            osType:
              type: string
              enum: [IOS, ANDROID, WINDOWS, MACOS, LINUX, TIZEN, WEBOS, OTHER]
            connectivity:
              type: array
              items:
                type: string
                enum: [WIFI, BLUETOOTH, NFC, USB_C, USB_A, HDMI, ETHERNET,
                       LIGHTNING, MMWAVE_5G, SUB6_5G, 4G_LTE, 3G, IR_BLASTER, OTHER]
            wattage:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              example:
                unitQuantity: 45
                unitText: W
            voltage:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              example:
                minQuantity: 100
                maxQuantity: 240
                unitText: V
            energyRating:
              type: integer
              minimum: 1
              maximum: 5
              description: Energy efficiency star rating.
            deviceType:
              type: string
              enum: [SMARTPHONE, TABLET, LAPTOP, DESKTOP, AUDIO, TELEVISION, CAMERA, WEARABLE,
                     HOME_APPLIANCE, KITCHEN_APPLIANCE, COMPUTER_PERIPHERAL, ACCESSORY, OTHER]
            modelNumber:
              type: string
              example: SM-A556E
              description: Manufacturer model number.
            processor:
              type: string
              example: Exynos 1480
            ram:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              description: Memory (RAM).
              example:
                unitQuantity: 8
                unitText: GB
            storage:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              description: Built-in storage.
              example:
                unitQuantity: 256
                unitText: GB
            screenSizeInch:
              type: number
              minimum: 0
              example: 6.6
              description: Diagonal screen size in inches.
            displayType:
              type: string
              example: Super AMOLED
            batteryCapacity:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              example:
                unitQuantity: 5000
                unitText: mAh
            powerSource:
              type: string
              enum: [MAINS_220V, RECHARGEABLE_BATTERY, BATTERY, USB, SOLAR]
            plugType:
              type: string
              enum: [TYPE_C, TYPE_F, NONE]
              description: Mains plug. Indonesia uses type C and F (220 V, 50 Hz).
            ipRating:
              type: string
              pattern: '^IP[0-9X][0-9X]$'
              example: IP67
              description: Ingress protection rating (IEC 60529).
            warrantyType:
              type: string
              enum: [OFFICIAL, DISTRIBUTOR, STORE, INTERNATIONAL, NONE]
              description: >
                Who honours the warranty. OFFICIAL is the brand's Indonesian warranty
                (garansi resmi), DISTRIBUTOR a distributor's, STORE the seller's own.
            sdppiCertificate:
              type: string
              example: 12345/SDPPI/2026
              description: >
                SDPPI (Kominfo) certificate number of a device with a radio transmitter,
                required to sell such devices in Indonesia.
              x-ion-regulatory: Permenkominfo 16/2018
            tkdnPercentage:
              type: number
              minimum: 0
              maximum: 100
              example: 35
              description: >
                Local content level (Tingkat Komponen Dalam Negeri) in percent, as
                certified; 4G/5G devices sold in Indonesia must meet the minimum.
              x-ion-regulatory: Permenperin 29/2017
            inTheBox:
              type: array
              items:
                type: string
              example: [Charger 25W, Kabel USB-C, Buku manual]
              description: What is in the box (isi kotak).
          x-ion-condition: Required for electronics and appliance products

        beauty:
          type: object
          additionalProperties: false
          description: >
            Beauty and personal care product attributes for filtering and regulatory
            compliance. concern and ingredient are descriptive fields — include them
            in Descriptor.longDesc for richer agent-readable content. Structured
            fields below are for filtering and compliance.
          properties:
            conscious:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [NATURAL, ORGANIC, VEGAN, CRUELTY_FREE, HALAL_COSMETICS]
            preference:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [HERBAL, AYURVEDIC, CHEMICAL_FREE, FRAGRANCE_FREE, ALCOHOL_FREE]
            formulation:
              type: string
              enum: [LIQUID, CREAM, GEL, POWDER, SERUM, BALM, SPRAY, FOAM,
                     STICK, SHEET]
            skinType:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [ALL, NORMAL, OILY, DRY, COMBINATION, SENSITIVE]
            hairType:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [ALL, NORMAL, OILY, DRY, DAMAGED, CURLY, STRAIGHT]
            spf:
              type: integer
              minimum: 1
              example: 50
            gender:
              type: string
              enum: [MALE, FEMALE, UNISEX]
          x-ion-regulatory: PerBPOM 23/2019 tentang Persyaratan Teknis Kosmetika
          x-ion-condition: Required for beauty and personal care products

        agritech:
          type: object
          additionalProperties: false
          description: >
            Agricultural and fresh produce attributes. Covers harvest dates, produce
            grade, pesticide declarations, and unit of measure for weight-sold products.
            Represent organic certification through regulatory.credentials.
          properties:
            harvestDate:
              type: string
              format: date
            produceGrade:
              type: object
              additionalProperties: false
              required: [scheme, value]
              properties:
                scheme:
                  type: string
                  description: Grading standard or authority under which the grade is assigned.
                value:
                  type: string
                  example: GRADE_A
            pesticideDeclaration:
              type: string
              enum: [PESTICIDE_FREE, LOW_PESTICIDE, STANDARD, ORGANIC_CERTIFIED]
            unitOfMeasure:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
                - type: object
                  properties:
                    unitCode:
                      $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity/properties/unitCode
                    unitQuantity:
                      $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity/properties/unitQuantity
                    unitText:
                      $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity/properties/unitText
              description: Declared net quantity of the fresh produce.
              example:
                unitQuantity: 1
                unitText: kg
          x-ion-condition: Required for agritech and fresh produce

        pharmacy:
          type: object
          additionalProperties: false
          description: >
            Pharmaceutical and over-the-counter medicine attributes. Covers
            prescription requirements, dosage form, active ingredients, and
            cold chain requirements. Applicable to prescription drugs, OTC
            medicines, and medical devices sold through ION.
          properties:
            prescriptionRequired:
              type: boolean
            dosageForm:
              type: string
              description: >
                Pharmaceutical dosage form. Suggested values cover common forms;
                other values are permitted as pharmaceutical forms evolve.
              x-ion-suggested-values: [TABLET, CAPSULE, SYRUP, INJECTION, OINTMENT,
                                       DROPS, INHALER, SUPPOSITORY, PATCH]
              example: TABLET
            activeIngredients:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [ingredient]
                properties:
                  ingredient:
                    type: string
                  strength:
                    allOf:
                      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
                    description: Strength of this active ingredient.
            coldChainRequired:
              type: boolean
          x-ion-regulatory: PerBPOM Nomor 4 Tahun 2018
          x-ion-condition: Required for pharmaceutical and OTC medicine

        installation:
          type: object
          additionalProperties: false
          description: >
            Installation service information for products that require professional
            setup. Applicable to large appliances, heavy furniture, HVAC systems,
            and any product where the seller offers or requires installation.
          properties:
            providedBySeller:
              type: boolean
            notes:
              type: string
              example: Memerlukan instalasi profesional. Membutuhkan arus 220V khusus.
          x-ion-condition: Required for appliances and furniture needing installation

        usage:
          type: object
          additionalProperties: false
          description: >
            Usage constraints and compatibility information for the resource.
            Covers indoor/outdoor restrictions and compatibility with other
            products or infrastructure requirements.
          properties:
            indoorOnly:
              type: boolean
            compatibleWith:
              type: array
              items:
                type: string
              example: ["220V outlet", "36-inch doorway"]

        warranty:
          # NOTE Retained locally for ION annotations; its data shape is owned by Beckn.
          allOf:
            - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/warranty
            - type: object
              properties:
                duration:
                  $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/warranty/properties/duration
                terms:
                  $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailResource/2.1/attributes.yaml#/components/schemas/RetailResource/properties/warranty/properties/terms
          x-ion-regulatory: UU 8/1999 tentang Perlindungan Konsumen Pasal 25; PP 36/2023
          x-ion-condition: Required for electronics, appliances, consumer durables

        availability:
          type: object
          x-attr-ion-layer: ion
          additionalProperties: false
          required: [status]
          description: >
            The resource's availability signal. A stock count is never transmitted:
            the BPP keeps its inventory to itself and publishes one of these
            statuses (see README, Availability model).
          properties:
            status:
              type: string
              enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK, PREORDER, DISCONTINUED]
              description: >
                IN_STOCK — adequate quantity; LOW_STOCK — limited, the buyer app may
                show urgency; OUT_OF_STOCK — not available now; PREORDER — can be
                ordered ahead of availability; DISCONTINUED — permanently removed.
            maxOrderQty:
              type: integer
              minimum: 1
              description: Most units one order may contain.
            backorderAllowed:
              type: boolean
              description: Orders are accepted while OUT_OF_STOCK, to be fulfilled later.
            substitutionAllowed:
              type: boolean
              description: The seller may substitute an equivalent item if this one runs out.
          example:
            status: IN_STOCK
            maxOrderQty: 5
            backorderAllowed: false

        crc:
          type: string
          x-attr-ion-layer: ion
          description: >
            ION Catalogue Resource Category code classifying this resource within
            the ION item taxonomy and signaling how a CN may present and discover
            the resource. Release 1 does not publish a normative CRC registry;
            values such as TRC-fashion and TRC-electronics are informative
            examples for future registry work.
          example: TRC-fashion
          x-ion-enforcement: optional

        additionalAttributes:
          type: array
          x-attr-ion-layer: ion
          description: >
            Seller-defined attributes the pack has no field for, as name/value
            pairs (with an optional unit), e.g. "Asal pengrajin: Pekalongan" or
            "Jumlah lapisan: 18". Buyer apps show them on the product page; they
            are not used for filtering. A value the pack defines a field for
            belongs in that field.
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 60
                example: Asal pengrajin
              value:
                type: string
                minLength: 1
                maxLength: 500
                example: Pekalongan, Jawa Tengah
              unit:
                type: string
                maxLength: 20
                example: cm
          maxItems: 30
          x-ion-enforcement: optional

        regulatory:
          type: object
          x-attr-ion-layer: ion
          additionalProperties: false
          description: >
            Indonesian regulatory registrations and food safety declarations
            for the resource. Covers BPOM (food, medicine, cosmetics), MUI halal
            certification, SNI standards compliance, SP-PIRT for home-industry food,
            KEMENKES health product registration, and SIUP business licence references.
            All registration schemes are governed by Indonesian regulatory authorities.
          properties:
            # NOTE Is SIUP product specific or business license. Do we need it here.
            registrations:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [scheme, id]
                properties:
                  scheme:
                    type: string
                    enum: [BPOM_MD, BPOM_ML, BPOM_TR, MUI_HALAL, SNI,
                           SP_PIRT, KEMENKES, SIUP]
                    description: >
                      BPOM_MD: domestic food/medicine/cosmetic BPOM registration.
                      BPOM_ML: imported product BPOM registration.
                      BPOM_TR: traditional medicine BPOM registration.
                      MUI_HALAL: MUI halal certification.
                      SNI: Standar Nasional Indonesia certification.
                      SP_PIRT: home-industry food production permit (Sertifikat Produksi Pangan IRT).
                      KEMENKES: health product registration from Ministry of Health.
                      SIUP: business trading licence reference.
                  id:
                    type: string
                    description: Registration or certificate number.
                  role:
                    type: string
                    enum: [BRAND_OWNER, MANUFACTURER, IMPORTER, PACKER]
                  url:
                    type: string
                    format: uri
                    description: URL to publicly verify the registration.
                  validUntil:
                    type: string
                    format: date
            nutrition:
              type: array
              description: >
                Structured nutritional information per serving or per 100g.
                Used for regulatory compliance display and consumer filtering
                (e.g. low-calorie, high-protein product discovery).
              items:
                type: object
                additionalProperties: false
                required: [nutrient, value]
                properties:
                  nutrient:
                    type: string
                    example: Protein
                  value:
                    allOf:
                      - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
                    description: Measured amount of the nutrient.
            # NOTE: Removed additives. Use RetailResource.foodRegulatoryDeclaration.additives
            # NOTE: Removed credentials
            backImage:
              type: string
              format: uri
              description: >
                Back-of-pack statutory label image URL. Required for products
                subject to PerBPOM 31/2018 label display requirements.

        regionOfOrigin:
          type: string
          x-attr-ion-layer: ion
          pattern: '^[A-Z]{2,3}-[A-Z0-9]{1,3}$'
          description: >
            ISO 3166-2 sub-national region code for geographic indication products.
            Required when the product claims origin-protected status under Indonesian
            geographical indication law (e.g. Kopi Gayo from Aceh: ID-AC, Beras
            Cianjur from West Java: ID-JB). Supporting geographic-indication
            evidence should be supplied through the inherited credentials property.
          example: ID-AC
          x-ion-regulatory: UU 20/2016 tentang Merek dan Indikasi Geografis
          x-ion-condition: Required when product claims Geographic Indication status

        digital:
          type: object
          x-attr-ion-layer: ion
          additionalProperties: false
          description: >
            Digital goods attributes specific to Indonesian digital commerce.
            Required when resourceTangibility is DIGITAL_VOUCHER, DIGITAL_TOP_UP,
            or DIGITAL_SUBSCRIPTION. Covers Indonesian-specific digital product
            categories: mobile pulsa and data packages (Telkomsel, XL, Indosat, Tri,
            Smartfren), electricity tokens (PLN), water bills (PDAM), tax payments
            (PBB), BPJS health insurance payments, and e-wallet top-ups. Game voucher
            categories cover popular titles in the Indonesian market (Mobile Legends,
            Free Fire, Valorant, Genshin Impact).
          # NOTE: Check if PDAM_BILL and WATER_BILL are the same
          properties:
            digitalCategory:
              type: string
              enum:
                - MOBILE_PULSA
                - MOBILE_DATA_PACKAGE
                - ELECTRICITY_TOKEN
                - WATER_BILL
                - INTERNET_BILL
                - PDAM_BILL
                - PBB_TAX
                - BPJS_PAYMENT
                - GIFT_CARD
                - GAME_VOUCHER
                - STREAMING_VOUCHER
                - FOOD_VOUCHER
                - EWALLET_TOP_UP
                - TRANSPORT_VOUCHER
                - EDUCATION_VOUCHER
                - OTHER
            operatorOrIssuer:
              type: string
              description: >
                Issuing operator or brand. For MOBILE_PULSA: TELKOMSEL, XL, INDOSAT,
                TRI, SMARTFREN. For ELECTRICITY_TOKEN: PLN. For GAME_VOUCHER: Moonton,
                Garena, Riot, miHoYo etc.
              example: TELKOMSEL
            denomination:
              allOf:
                - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/Quantity/2.0/attributes.yaml#/components/schemas/Quantity
              description: Voucher or top-up denomination.
              example:
                unitQuantity: 50000
                unitCode: IDR
            deliveryMethod:
              type: string
              enum: [PUSH_TO_TARGET, CODE_TO_BUYER, ACCOUNT_CREDIT, QR_VOUCHER]
              description: >
                PUSH_TO_TARGET: delivered directly to consumer account (pulsa to
                phone number, PLN token to meter number, in-game currency to game
                account). CODE_TO_BUYER: redemption code sent to buyer for later
                use. ACCOUNT_CREDIT: credited to buyer wallet or account.
                QR_VOUCHER: scannable QR redeemable at merchant point.
            redemptionUrl:
              type: string
              format: uri
              description: URL for redemption (streaming service activation, game code page).
            expiryAfterPurchase:
              type: string
              description: >
                ISO 8601 duration — how long the voucher is valid from purchase date.
              example: P30D
            refundable:
              type: boolean
              default: false
              description: >
                Whether the digital good is refundable. Most pulsa and top-up products
                are non-refundable once delivered to the target. Vouchers may be
                refundable if unredeemed.
            cancellable:
              type: boolean
              default: false
              description: Whether cancellation is possible before delivery is initiated.
          # NOTE: Digital flow uses resourceStructure and not resourceTangibility
          x-ion-condition: >
            Required when resourceTangibility IN
            [DIGITAL_VOUCHER, DIGITAL_TOP_UP, DIGITAL_SUBSCRIPTION]

        dataResidency:
          type: string
          x-attr-ion-layer: ion
          enum: [DOMESTIC_ONLY, INTERNATIONAL_ALLOWED]
          description: >
            Data residency requirement for this resource under Indonesian Personal
            Data Protection Law (UU 27/2022 tentang Pelindungan Data Pribadi).
            DOMESTIC_ONLY means all PII and transaction data associated with this
            resource must be processed and stored within Indonesia. BAPs with foreign
            data processing infrastructure must refuse transactions for DOMESTIC_ONLY
            resources. Required for pharmacy, health data, financial services, and
            regulated biometric product categories.
          example: DOMESTIC_ONLY
          x-ion-regulatory: UU 27/2022 tentang Pelindungan Data Pribadi (PDP Law)
          x-ion-condition: >
            Required for pharmacy, health-data, and financial-services categories
