openapi: 3.1.1
info:
  title: ION Trade Consideration Extension (v1)
  description: >
    Trade sector consideration attributes. Inherits the monetary amount,
    payment method, breakup, voucher, and loyalty-point structures defined by
    RetailConsideration v2.1, refines tax details for ION, and adds the
    commission an order comes to (IONCommission), on the contract's price
    consideration.
    Attaches to: beckn:Consideration.considerationAttributes
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONTradeConsideration:
      type: object
      title: IONTradeConsideration
      description: >
        ION trade consideration attributes. Inherits directly from
        RetailConsideration v2.1 and refines inherited breakup taxDetail objects
        with the shared IONTaxDetail schema.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Consideration.considerationAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release1/schema/extension/trade/TradeConsideration/v1/context.jsonld'
        '@type': ion:IONTradeConsideration
      x-beckn-attaches-to: Consideration.considerationAttributes
      x-ion-closed-extensions: false
      allOf:
        - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailConsideration/2.1/attributes.yaml#/components/schemas/RetailConsideration
      properties:
        breakup:
          x-attr-ion-layer: ion
          type: array
          description: >
            Inherited RetailConsideration price breakup, refined so each
            taxDetail object may carry IONTaxDetail classification and
            compliance fields.
          items:
            allOf:
              - $ref: https://schema.ion.id/release1/schema/vendored/beckn/schemas/RetailConsideration/2.1/attributes.yaml#/components/schemas/RetailConsideration/properties/breakup/items
              - type: object
                properties:
                  taxDetail:
                    allOf:
                      - $ref: https://schema.ion.id/release1/schema/common/Tax/v1/attributes.yaml#/components/schemas/IONTaxDetail
        commission:
          x-attr-ion-layer: ion
          allOf:
            - $ref: '#/components/schemas/IONCommission'
          description: >
            Commission the order comes to: what the seller (BPP) pays the
            buyer app (BAP), deducted from the seller's payout. Not a charge to
            the buyer, and not part of breakup or totalAmount. Set only on the
            contract's price consideration in force; the offer's commission
            terms are IONTradeOffer.policies.commission (see IONCommission).
      # Monetary breakup, payment methods, total amount, applied vouchers,
      # and loyalty points are inherited from RetailConsideration v2.1.
      # Realized discounts use breakup[].type: DISCOUNT and breakup[].amount;
      # voucher attribution uses appliedVouchers[]. Promotion calculation
      # mechanics belong to the Offer rather than the Consideration.
      # Tax amounts and rates use inherited breakup[].taxDetail fields.
      # Removed duplicate ppnRate property; regulatory annotation retained:
      # x-ion-regulatory: UU 7/2021 HPP; PMK 131/2024 (or current applicable PMK)
      # x-ion-condition: Required on TAX consideration lines
      # Removed duplicate ppnbmRate property; regulatory annotation retained:
      # x-ion-regulatory: UU 42/2009 tentang PPN dan PPnBM; current applicable PMK
      # x-ion-condition: Required on PPNBM consideration lines for luxury goods
      # RetailConsideration v2.1 requires currency and totalAmount. These
      # inherited requirements cannot be relaxed by this allOf extension.

    IONCommission:
      type: object
      title: IONCommission
      description: >
        The commission an order comes to: what the seller (BPP) pays the buyer
        app (BAP), deducted from the seller's payout at settlement. Not a
        charge to the buyer, and not part of breakup or totalAmount. Set only
        on the contract's price consideration in force; the offer's terms are
        the named entries of IONTradeOffer.policies.commission.

        amount is the total commission for the items still ordered: the sum,
        over every offer still ordered, of all its policies.commission entries.
        The BPP sets it in on_select and on_init and recomputes it in on_cancel
        and on_update after cancellations and returns.

        When every offer still ordered has exactly one commission entry and
        they all share the same PERCENT terms, the contract repeats that type,
        value and appliesTo; otherwise type is AMOUNT and value is the total.

        At reconciliation the settlement's commission.value
        (IONSettlementReconciliation) equals amount.
      x-ion-layer: ion
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [PERCENT, AMOUNT]
          description: >
            PERCENT repeats the shared PERCENT terms of the offers ordered.
            AMOUNT means value is the order's total commission in the
            consideration currency.
          example: PERCENT
        value:
          type: number
          minimum: 0
          description: >
            Percentage (0-100) when type is PERCENT; the order's total
            commission in the consideration currency when type is AMOUNT.
          example: 3
        appliesTo:
          type: string
          enum: [ITEM_TOTAL, ORDER_TOTAL]
          default: ITEM_TOTAL
          description: >
            Base for a PERCENT commission. ITEM_TOTAL is the item value
            excluding tax, delivery and packing; ORDER_TOTAL includes tax.
            Only for type PERCENT.
          example: ITEM_TOTAL
        amount:
          type: number
          minimum: 0
          description: >
            Total commission in the consideration currency for the items still
            ordered: the sum over every offer still ordered of all its
            policies.commission entries. Equals the settlement's
            commission.value at reconciliation.
          example: 2670
      if:
        properties:
          type:
            const: PERCENT
      then:
        properties:
          value:
            maximum: 100
      else:
        not:
          required: [appliesTo]
