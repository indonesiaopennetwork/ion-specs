openapi: 3.1.1
info:
  title: ION Trade Offer Extension (v1)
  description: 'Trade sector offer attributes. Terms of sale — cancellability, returnability, policies, COD availability,
    consumer care contact, MOQ, promotion mechanics. Attaches to: beckn:Offer.offerAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONTradeOffer:
      type: object
      title: IONTradeOffer
      description: >
        ION trade offer attributes. Inherits directly from RetailOffer v2.1 and
        combines generic trade offer mechanics with Indonesia-specific policy,
        language, logistics-pricing, and payment-method extensions.

        Properties originating in the former ION-specific layer are identified by
        x-attr-ion-layer: ion.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Offer.offerAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/releases/release1/extension/trade/TradeOffer/v1/context.jsonld'
        '@type': ion:IONTradeOffer
      x-beckn-attaches-to: Offer.offerAttributes
      x-ion-closed-extensions: false
      allOf:
        - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer
        - type: object
          properties:
            policies:
              x-attr-ion-layer: ion
              type: object
              properties:
                cancellation:
                  type: object
                  properties:
                    policyRef:
                      allOf:
                        - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies/properties/cancellation/properties/policyRef
                      description: ION-registered cancellation policy URI.
                      example: ion://policy/cancel.prepacked.free
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 8/1999 Pasal 19

                returns:
                  type: object
                  properties:
                    policyRef:
                      allOf:
                        - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies/properties/returns/properties/policyRef
                      description: ION-registered returns policy URI.
                      example: ion://policy/return.standard.7d-sellerpays
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 8/1999 Pasal 25; Permendag 19/M-DAG/PER/5/2009

                warranty:
                  type: object
                  properties:
                    policyRef:
                      allOf:
                        - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies/properties/warranty/properties/policyRef
                      description: ION-registered warranty policy URI.
                      example: ion://policy/warranty.manufacturer.1y-distance-service
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 8/1999 Pasal 25; PP 36/2023

                dispute:
                  type: object
                  properties:
                    policyRef:
                      type: string
                      format: uri
                      description: ION-registered dispute-resolution policy URI.
                      example: ion://policy/dispute.consumer.bpsk
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 8/1999 Pasal 45; UU 30/1999 tentang Arbitrase
                grievanceSla:
                  type: object
                  properties:
                    policyRef:
                      type: string
                      format: uri
                      description: ION-registered grievance SLA policy URI.
                      example: ion://policy/grievance-sla.consumer.standard
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 8/1999 Pasal 45; Permendag 50/2020 Pasal 6
                paymentTerms:
                  type: object
                  properties:
                    policyRef:
                      type: string
                      format: uri
                      description: ION-registered payment-terms policy URI.
                      example: ion://policy/payment-terms.upfront.full
                      x-ion-policy-registry: https://registry.ion.id/policies
                      x-ion-regulatory: UU 7/2021 HPP; OJK POJK terkait metode pembayaran
                penalty:
                  type: object
                  properties:
                    policyRef:
                      type: string
                      format: uri
                      description: Optional ION-registered per-offer penalty-policy override. It cannot be weaker than the seller-tier minimum.
                      example: ion://policy/penalty.seller-sla-breach.standard
                      x-ion-policy-registry: https://registry.ion.id/policies
                      # x-ion-condition: Auto-derived from seller tier and other policies; declare only for an explicit override

      properties:
        policies:
          allOf:
            - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies
            - type: object
              properties:
                cancellation:
                  allOf:
                    - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies/properties/cancellation
                    - type: object
                      properties:
                        allowedReasons:
                          type: array
                          items:
                            type: string
                            enum:
                            - CHANGE_OF_MIND
                            - WRONG_ITEM_ORDERED
                            - ORDERED_WRONG_VARIANT
                            - FOUND_BETTER_PRICE
                            - DELIVERY_TOO_LONG
                            - INCORRECT_ADDRESS
                            - DUPLICATE_ORDER
                            - PAYMENT_METHOD_CHANGE
                            - ITEM_NO_LONGER_NEEDED
                            - SELLER_UNRESPONSIVE
                            - BUYER_FRAUD_SUSPECTED
                            - QUALITY_ISSUE_AT_PREVIEW
                          description: Seller-declared reasons for which cancellation is accepted when the inherited cancellation policy allows cancellation.
                          example:
                          - CHANGE_OF_MIND
                          - WRONG_ITEM_ORDERED
                          # x-ion-condition: Required when policies.cancellation.allowed is true
                returns:
                  allOf:
                    - $ref: https://schema.beckn.io/RetailOffer/v2.1/attributes.yaml#/components/schemas/RetailOffer/properties/policies/properties/returns
                    - type: object
                      properties:
                        evidenceRequirement:
                          type: string
                          enum:
                          - NONE
                          - PHOTO_OPTIONAL
                          - PHOTO_REQUIRED
                          - VIDEO_UNBOXING_REQUIRED
                          - VIDEO_UNBOXING_AND_PHOTO
                          - PHYSICAL_INSPECTION
                          description: >
                            Evidence required from buyer when initiating a return.
                            VIDEO_UNBOXING_REQUIRED is standard for high-value electronics.
                            PHYSICAL_INSPECTION is used for high-value items (>IDR 10M) where
                            seller sends an inspector before accepting the return.
                          example: PHOTO_REQUIRED
                        evidenceMinPhotos:
                          type: integer
                          minimum: 1
                          maximum: 10
                          description: Minimum number of evidence photos required.
                          # x-ion-condition: Required when policies.returns.evidenceRequirement includes PHOTO
        timeToShip:
          type: string
          format: duration
          description: 'Time from order confirm to when seller hands package to logistics. ISO 8601 duration.

            '
          example: PT2H
        selfPickupOtp:
          type: boolean
          description: 'Whether OTP verification is required when consumer picks up order. If true, BPP generates
            deliveryOtp in performanceAttributes.

            '
          example: false
        selfPickupInstructions:
          type: string
          description: Instructions for self-pickup — counter number, floor, collection point.
          example: Ambil di counter F&B lantai 1, tunjukkan kode pesanan Anda.
        proofOfDeliveryType:
          type: string
          enum:
          - OTP
          - SIGNATURE
          - PHOTO
          - NONE
          description: Type of delivery confirmation proof required.
          example: OTP
        contactDetailsConsumerCare:
          allOf:
            - $ref: https://schema.beckn.io/Contact/2.0#/components/schemas/Contact
          description: Structured consumer-care contact displayed for pre- and post-purchase support.
          example:
            name: Customer Service
            email: cs@toko.com
            phone: '08001234567'
          x-ion-regulatory: UU 8/1999 tentang Perlindungan Konsumen Pasal 7
        offerType:
          type: string
          enum:
          - LIST_PRICE
          - DISCOUNT
          - BUNDLE
          - BUY_X_GET_Y
          - CASHBACK
          - FREE_DELIVERY
          - VOUCHER
          - AUCTION
          - FLASH_SALE
          description: Commercial offer mechanic. AUCTION identifies bid-based offers; FLASH_SALE identifies time- or quantity-limited sale events.
          example: DISCOUNT
        priceModel:
          type: string
          enum:
          - FIXED
          - DYNAMIC
          - TIERED
          description: How pricing is determined for this offer.
          example: FIXED
        minBasketAmount:
          type: number
          description: Minimum basket value in IDR for offer to be valid.
          example: 50000
        maxDiscountAmount:
          type: number
          description: Maximum discount cap in IDR for percentage offers.
          example: 20000
        voucherCode:
          type: string
          description: Voucher or promo code to activate offer.
          example: HEMAT50
        usageLimitPerUser:
          type: integer
          minimum: 1
          description: Maximum times this offer can be used by a single user.
          example: 1
        customerSegment:
          type: string
          enum:
          - ALL
          - NEW_USER
          - LOYALTY
          - MEMBERSHIP
          - VERIFIED_SELLER
          description: Segment of customers eligible for this offer.
          example: ALL
        subsidyBreakup:
          type: object
          additionalProperties: false
          description: Who funds the discount/promotion.
          properties:
            sellerSubsidy:
              type: number
              minimum: 0
            platformSubsidy:
              type: number
              minimum: 0
            brandSubsidy:
              type: number
              minimum: 0
        priceChangeSchedule:
          type: array
          description: 'Price validity timeline for a campaign. Use one entry for a single price window and multiple entries when the price changes during the campaign. BAPs MUST render countdown UI and compute the correct price at transaction time. Entries MUST NOT overlap and must be sorted ascending by validFrom.

            '
          items:
            type: object
            additionalProperties: false
            properties:
              validFrom:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
              priceValue:
                type: number
                description: IDR amount valid in this window
              phaseLabel:
                type: string
                description: Human label e.g. "Jam pertama harga hemat"
                example: First hour at flash price
            required:
            - validFrom
            - validUntil
            - priceValue
        reservationWindowSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: 'Seconds for which the BPP will hold availability and the on_select price quote. Default
            300. BPP soft-reserves at on_select, hard-reserves at on_init. After window expires, availability is
            released and any subsequent /confirm for this messageId returns ION-3006.

            '
          example: 300
          x-ion-default: 300
        totalStockCap:
          type: integer
          minimum: 1
          description: 'Absolute total quantity available under this offer. When reached, all subsequent /select
            calls return ION-3008. Distinct from resource.availability.maxOrderQty (per-order cap).

            '
          example: 100
        perUserQuantityCap:
          type: integer
          minimum: 1
          description: 'Maximum units a single buyer can purchase under this offer across all transactions (enforced
            by BPP). Distinct from usageLimitPerUser which is number of separate redemptions.

            '
          example: 2
        queueEnabled:
          type: boolean
          description: 'Whether BPP uses a queue/throttle mechanism when demand exceeds supply. When true, on_select
            may return queuePosition.

            '
          default: false
        queuePosition:
          type: integer
          minimum: 0
          description: 'Consumer''s current position in the purchase queue. 0 = at front. Returned in on_select
            when queueEnabled=true.

            '
        estimatedWaitSeconds:
          type: integer
          minimum: 0
          description: Estimated wait time before this consumer reaches front of queue.
          # x-ion-condition: Returned in on_select when queuePosition is present
        stackingGroup:
          type: string
          enum:
          - PLATFORM
          - SELLER
          - PAYMENT
          - BRAND
          - SHIPPING
          - CASHBACK
          description: 'Voucher stacking group. Vouchers from different groups stack by default. Within a single
            group only one voucher can apply per order unless stackingRules override.

            '
        stackingRules:
          type: object
          additionalProperties: false
          description: 'Explicit voucher stacking rules. Used when offer has complex combination logic beyond the
            default group rules.

            '
          properties:
            mustCombineWith:
              type: array
              items:
                type: string
              description: Offer IDs that must also be applied for this offer to activate.
            cannotCombineWith:
              type: array
              items:
                type: string
              description: Offer IDs with which this offer cannot be combined.
            maxDiscountWhenStacked:
              type: number
              description: Cap on total discount when multiple offers stack (IDR).
        codEligibilityForBuyer:
          type: boolean
          description: 'BPP-evaluated COD eligibility for the specific buyer in this transaction. Returned in on_select.
            Distinct from paymentConstraints.codAvailable which is offer-level availability. Allows BPP to decline COD for new buyers,
            previous COD failures, high-value items exceeding buyer''s verified tier, etc.

            '
        codEligibilityReason:
          type: string
          enum:
          - ELIGIBLE
          - NEW_BUYER
          - PREVIOUS_COD_FAILURE
          - ADDRESS_NOT_VERIFIED
          - AMOUNT_EXCEEDS_LIMIT
          - PINCODE_NOT_SERVICED_FOR_COD
          - HIGH_RISK_CATEGORY
          - OTP_VERIFICATION_REQUIRED
          description: Reason for the codEligibilityForBuyer decision.
          # x-ion-condition: Required when codEligibilityForBuyer is declared
        handlingTime:
          type: string
          format: duration
          description: Time from order confirmation until the package is ready for logistics. Used for custom-print, made-to-measure, and pre-order merchandise.
          example: PT72H
        customTermsAddendum:
          type: string
          maxLength: 1000
          description: 'Free-text addendum for edge cases (e.g. watchmaker offering lifetime service). Supplements
            the declared policy IRIs but cannot contradict them. If addendum contradicts base policy, base policy
            wins and addendum is informational only. BAP displays addendum below the structured policy terms.

            '
          example: Garansi seumur hidup untuk mekanisme jam tangan mewah (terms & conditions apply - see seller
            page).
        displayLanguage:
          x-attr-ion-layer: ion
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - id
            - en
            - ms
            - zh
            - ar
            - ta
            - ko
            - ja
          description: Languages in which this offer's catalog content is available.
          example:
          - id
          - en
          x-ion-regulatory: ION Network Policy — language completeness validation
          # x-ion-condition: Must include id; cross-border offers must also include en
        weightSlabs:
          x-attr-ion-layer: ion
          type: array
          description: Weight-based pricing tiers for catalogued logistics offers.
          items:
            type: object
            additionalProperties: false
            properties:
              minKg:
                type: number
                minimum: 0
              maxKg:
                type: number
              priceIDR:
                type: integer
            required:
            - minKg
            - maxKg
            - priceIDR
          example:
          - minKg: 0
            maxKg: 5
            priceIDR: 15000
          - minKg: 5
            maxKg: 10
            priceIDR: 25000
          # x-ion-condition: Required for catalogued domestic logistics patterns
        paymentMethodEligibility:
          x-attr-ion-layer: ion
          type: array
          description: Structured ION payment-method restrictions applied in addition to inherited acceptedPaymentMethod.
          items:
            type: object
            additionalProperties: false
            properties:
              method:
                $ref: 'https://schema.ion.id/releases/release1/common/Payment/v1/attributes.yaml#/components/schemas/IONPayment/properties/method'
              minAmount:
                type: number
                minimum: 0
                description: Minimum order value in IDR for this method to be eligible.
              maxAmount:
                type: number
                minimum: 0
                description: Maximum order value in IDR for this method to be eligible.
              requiresBuyerTier:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - NEW
                  - STANDARD
                  - VERIFIED
                  - PREMIUM
                  - VIP
                description: Buyer tiers eligible for this method.
              requiresAddressVerification:
                type: boolean
                description: Whether the buyer must have a verified delivery address.
                default: false
              requiresPhoneVerification:
                type: boolean
                description: Whether the buyer must have a verified phone number.
                default: false
              excludedCategories:
                type: array
                uniqueItems: true
                items:
                  type: string
                description: Category codes excluded from this method.
              requiredBnplProvider:
                type: array
                uniqueItems: true
                items:
                  type: string
                description: BNPL providers accepted when method is BNPL.
                # x-ion-condition: Applicable only when method is BNPL
              eligibilityNote:
                type: string
                description: Optional human-readable explanation.
            required:
            - method
