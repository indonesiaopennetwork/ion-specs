openapi: 3.1.1
info:
  title: ION Trade Provider Extension (v1)
  description: >
    Trade-sector provider attributes covering operational availability,
    invoicing, category serviceability, preparation, logistics arrangements,
    commerce channels, and provider verification. Attaches to
    beckn:Provider.providerAttributes.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:
    IONTradeProvider:
      type: object
      title: IONTradeProvider
      description: >
        ION trade-provider attributes carried by Provider.providerAttributes.
        Inherits directly from Beckn Attributes and combines generic provider
        operations with Indonesia-specific registration, trust, verification-tier,
        and category-licensing extensions.

        Properties originating in the former ION-specific layer are identified by
        x-attr-ion-layer: ion.
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Provider.providerAttributes
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/releases/release1/extension/trade/TradeProvider/v1/context.jsonld'
        '@type': ion:IONTradeProvider
      x-beckn-attaches-to: Provider.providerAttributes
      allOf:
        - $ref: https://schema.ion.id/releases/release1/vendored/beckn/schemas/Attributes/2.0/attributes.yaml#/components/schemas/Attributes
        - type: object
          properties:
            verification:
              x-attr-ion-layer: ion
              allOf:
                - type: object
                  properties:
                    level:
                      type: string
                      enum:
                        - BASIC
                        - STANDARD
                        - ENHANCED
                        - ENTERPRISE
                      description: >
                        ION provider-verification tier. The criteria and transaction
                        limits associated with each tier are ION network policy.
                      example: STANDARD

      properties:
        invoicing:
          type: object
          additionalProperties: false
          description: >
            Provider-level invoicing arrangement. Transaction-specific invoice
            details remain on the Contract and Consideration.
          properties:
            model:
              type: string
              enum:
                - CENTRAL
                - PER_FULFILMENT_CENTRE
              description: >
                CENTRAL uses one invoicing entity across the provider.
                PER_FULFILMENT_CENTRE allows each fulfilment centre to invoice
                through its own entity.
              x-ion-regulatory: UU 6/1983 tentang Ketentuan Umum Perpajakan — NPWP obligation per taxable entity
            entityId:
              type: string
              description: >
                Identifier of the Participant or Provider that issues invoices
                when the model is CENTRAL.
              x-ion-regulatory: PMK 168/PMK.010/2023 tentang Faktur Pajak
          # x-ion-condition: entityId is required by network policy when model is CENTRAL

        operationalStatus:
          type: object
          additionalProperties: false
          description: Current catalog-visible operating state of the provider.
          properties:
            status:
              type: string
              enum:
                - OPEN
                - TEMPORARILY_CLOSED
                - DISABLED
            until:
              type: string
              format: date-time
              description: Expected end of a temporary closure.
          # x-ion-condition: until is required by network policy when status is TEMPORARILY_CLOSED

        operatingHours:
          type: array
          description: >
            Recurring weekly operating windows. A locationId scopes the window
            to a Provider.availableAt location; when omitted, it applies to the
            provider as a whole.
          items:
            type: object
            additionalProperties: false
            properties:
              locationId:
                type: string
                description: Identifier of the applicable Provider.availableAt location.
              type:
                type: string
                enum:
                  - ORDER
                  - DELIVERY
                  - SELF_PICKUP
                  - PREPARATION
              dayFrom:
                type: integer
                minimum: 1
                maximum: 7
                description: Day of week, where 1 is Monday and 7 is Sunday.
              dayTo:
                type: integer
                minimum: 1
                maximum: 7
                description: Last applicable day, where 1 is Monday and 7 is Sunday.
              startTime:
                type: string
                format: time
              endTime:
                type: string
                format: time

        closures:
          type: array
          description: >
            Exceptional dates on which the provider or a specific operating
            location is closed.
          items:
            type: object
            additionalProperties: false
            properties:
              date:
                type: string
                format: date
              locationId:
                type: string
                description: >
                  Identifier of the applicable Provider.availableAt location.
                  When omitted, the closure applies provider-wide.

        serviceabilityByCategory:
          type: array
          description: >
            Provider-level geographic serviceability overrides for a category.
            Offer- or Resource-specific serviceability takes precedence.
          items:
            type: object
            additionalProperties: false
            properties:
              categoryId:
                type: string
                description: Identifier of the applicable trade category.
              locationId:
                type: string
                description: Optional origin location to which this area applies.
              geo:
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/GeoJSONGeometry

        averagePreparationTime:
          type: string
          format: duration
          description: >
            Provider-level average duration from confirmation until a resource
            is ready for pickup or delivery. A Resource-specific preparation
            duration takes precedence.
          example: PT25M
          # x-ion-condition: Required by network policy for categories that prepare resources on demand

        providerCategories:
          type: array
          uniqueItems: true
          description: >
            Categories in which the provider operates. Values are category
            identifiers governed by the applicable trade taxonomy rather than
            a closed schema enum.
          items:
            type: string
          x-ion-suggested-values:
            - RESTAURANT
            - CLOUD_KITCHEN
            - GROCERY
            - PHARMACY
            - FASHION
            - ELECTRONICS
            - BEAUTY
            - FMCG
            - AGRITECH
            - B2B_DISTRIBUTOR
            - QUICK_COMMERCE
            - HOME_AND_KITCHEN
            - PET_SUPPLIES
            - BOOKS_STATIONERY
            - TOYS_GAMES
            - SPORTS_OUTDOORS
            - AUTOMOTIVE_PARTS

        logistics:
          type: object
          additionalProperties: false
          description: Provider-level logistics arrangement and preference.
          properties:
            preferredProviderId:
              type: string
              description: Identifier of the preferred logistics provider.
            managedByMarketplace:
              type: boolean
              description: >
                Whether the marketplace, rather than the seller, normally
                orchestrates logistics for this provider.

        commerceChannels:
          type: object
          additionalProperties: false
          description: Optional commerce channels supported by the provider.
          properties:
            supported:
              type: array
              uniqueItems: true
              items:
                type: string
                enum:
                  - LIVE_COMMERCE
                  - OTT_EMBEDDED_COMMERCE
            authorizedStreamerIds:
              type: array
              uniqueItems: true
              description: >
                Participant identifiers authorized to feature this provider's
                resources in live-commerce sessions.
              items:
                type: string

        verification:
          type: object
          additionalProperties: false
          description: >
            Catalog-visible summary of provider verification performed by the
            Provider Node. Sensitive evidence is not transmitted in the catalog.
          properties:
            status:
              type: string
              enum:
                - PENDING
                - APPROVED
                - APPROVED_WITH_CAVEATS
                - REJECTED
                - SUSPENDED
                - EXPIRED
            validUntil:
              type: string
              format: date
            caveats:
              type: array
              uniqueItems: true
              items:
                type: string
                enum:
                  - PENDING_BENEFICIAL_OWNERSHIP
                  - PENDING_AML_SCREEN
                  - PENDING_CATEGORY_LICENSE
                  - PENDING_FINAL_VERIFICATION
                  - PROBATIONARY_PERIOD
          # x-ion-condition: caveats are required by network policy when status is APPROVED_WITH_CAVEATS

        businessRegistration:
          x-attr-ion-layer: ion
          $ref: https://schema.ion.id/releases/release1/common/BusinessRegistration/v1/attributes.yaml#/components/schemas/IONBusinessRegistration
          description: >
            Indonesian business identity for the provider. The presence and
            validity of the actual nib value replaces the former
            nibRegistered boolean.

        trustMarks:
          x-attr-ion-layer: ion
          type: array
          description: >
            Signed or otherwise verifiable trust marks awarded to the provider,
            including an ION Trusted Seller credential. A provider must not
            assert trust through an unverified boolean.
          items:
            $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Document

        categoryLicenses:
          x-attr-ion-layer: ion
          type: array
          description: >
            Indonesian operating licences applicable to one or more provider
            categories. Licence types are governed by ION policy so new
            regulatory codes do not require a schema revision.
          items:
            type: object
            additionalProperties: false
            properties:
              categoryIds:
                type: array
                uniqueItems: true
                items:
                  type: string
              licenseType:
                type: string
                x-ion-suggested-values:
                  - SIA_ALCOHOL
                  - SIKA_MEAT
                  - PBF_PHARMACY
                  - BPOM_COSMETICS
                  - BPOM_FOOD
                  - SIUP_HEAVY
                  - OTHER
              licenseNumber:
                type: string
              validUntil:
                type: string
                format: date
              issuingAuthority:
                type: string
                example: BPOM
              evidence:
                $ref: https://schema.ion.id/releases/release1/vendored/beckn/protocol/v2.0.0/beckn.yaml#/components/schemas/Document
          x-ion-regulatory: PP 5/2021; PerBPOM various
          # x-ion-condition: Required by network policy for regulated categories

      # NETWORK POLICY NOTE (GAP 32 / NFH-012 CON-012-18):
      # Shared schemas do not declare mandatory ION fields. Requirements for
      # operationalStatus, invoicing, verification, businessRegistration,
      # and categoryLicenses are enforced through ION policy.
      x-ion-closed-extensions: false
