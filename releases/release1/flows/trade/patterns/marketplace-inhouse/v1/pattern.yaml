# ION Trade Pattern — marketplace-inhouse (MP-IH)
# NOT OAS. ION pattern specification document.

id: ion-trade-pattern-marketplace-inhouse-v1
version: "1.0.0"
patternName: marketplace-inhouse
sector: ion:trade
status: ready
description: >
  A first-party or consignment marketplace acts as the BPP, holds physical
  inventory in its fulfilment centres, invoices centrally, and owns the
  consumer-facing fulfilment SLA. The wire sequence is standard Beckn commerce.

applicableCategories: [all]

participants:
  BAP: Buyer App Platform
  MARKETPLACE_BPP: Marketplace inventory and order platform
  ION_CATALOG: ION Catalogue Service (Phase 1 only)

performanceStateMachine: schema/extension/trade/TradePerformanceStates/v1/states.yaml#standard

phases:
  phase1:
    name: Marketplace-held catalog
    communication: async pub/sub
    steps:
      - step: publish_catalog
        from: MARKETPLACE_BPP
        to: ION_CATALOG
        direction: publish
        requiredFields:
          - context.domain
          - context.bppId
          - context.timestamp
          - message.catalog.provider.id
          - message.catalog.provider.providerAttributes.invoicing.model
          - message.catalog.provider.providerAttributes.invoicing.entityId
          - message.catalog.provider.providerAttributes.operationalStatus.status
          - message.catalog.provider.providerAttributes.businessRegistration.nib
          - message.catalog.resources[].id
          - message.catalog.resources[].resourceAttributes.name.id
          - message.catalog.resources[].resourceAttributes.resourceStructure
          - message.catalog.resources[].resourceAttributes.availability.status
          - message.catalog.offers[].id
          - message.catalog.offers[].price
          - message.catalog.offers[].offerAttributes.policies.cancellation.policyRef
          - message.catalog.offers[].offerAttributes.policies.returns.policyRef
          - message.catalog.offers[].offerAttributes.policies.warranty.policyRef
          - message.catalog.offers[].offerAttributes.policies.dispute.policyRef
          - message.catalog.offers[].offerAttributes.policies.grievanceSla.policyRef
          - message.catalog.offers[].offerAttributes.policies.paymentTerms.policyRef
        businessRules:
          - providerAttributes.invoicing.model is CENTRAL
          - policies.cancellation.policyRef is ion://policy/cancel.standard.until-dispatched
          - policies.returns.policyRef is ion://policy/return.standard.14d-sellerpays
          - policies.warranty.policyRef is ion://policy/warranty.standard.none
          - policies.dispute.policyRef is ion://policy/dispute.consumer.bpsk
          - policies.grievanceSla.policyRef is ion://policy/grievance-sla.consumer.standard
          - policies.paymentTerms.policyRef is ion://policy/payment-terms.upfront.full
        schemaPacks:
          common: [BusinessRegistration/v1]
          trade: [TradeProvider/v1, TradeResource/v1, TradeOffer/v1]

      - step: on_discover
        from: ION_CATALOG
        to: BAP
        direction: push

  phase2:
    name: Transaction
    communication: direct BAP-marketplace BPP
    steps:
      - step: select
        from: BAP
        to: MARKETPLACE_BPP
        direction: request
        requiredFields:
          - context.transactionId
          - context.messageId
          - message.contract.participants[role=PROVIDER].id
          - message.contract.commitments[].id
          - message.contract.commitments[].commitmentAttributes.resourceId
          - message.contract.commitments[].commitmentAttributes.offerId
          - message.contract.commitments[].resources[].quantity.count
          - message.contract.performance[].performanceAttributes.performanceMode

      - step: on_select
        from: MARKETPLACE_BPP
        to: BAP
        direction: callback
        description: Marketplace returns its fulfilment-centre SLA and quote.
        requiredFields:
          - message.contract.consideration[].considerationAttributes.breakup[]
          - message.contract.consideration[].considerationAttributes.totalAmount
          - message.contract.performance[].performanceAttributes.sla
          - message.contract.performance[].performanceAttributes.fulfillingLocationId
        schemaPacks:
          common: [Tax/v1]
          trade: [TradeConsideration/v1, TradePerformance/v1]

      - step: init
        from: BAP
        to: MARKETPLACE_BPP
        direction: request
        requiredFields:
          - message.contract.participants[role=BUYER].person.name
          - message.contract.participants[role=BUYER].contact
          - message.contract.performance[].performanceAttributes.stops[].location.address
          - message.contract.settlements[].settlementAttributes.method
          - message.contract.settlements[].settlementAttributes.paymentRail
          - message.contract.settlements[].settlementAttributes.collectedBy
        schemaPacks:
          common: [Address/v1, Payment/v1]

      - step: on_init
        from: MARKETPLACE_BPP
        to: BAP
        direction: callback
        requiredFields:
          - message.contract.settlements[].settlementAttributes.methodDetail
          - message.contract.consideration[].considerationAttributes.totalAmount

      - step: confirm
        from: BAP
        to: MARKETPLACE_BPP
        direction: request
        requiredFields:
          - message.contract.commitments[]
          - message.contract.participants[role=BUYER]
          - message.contract.settlements[].settlementAttributes.status

      - step: on_confirm
        from: MARKETPLACE_BPP
        to: BAP
        direction: callback
        requiredFields:
          - message.contract.id
          - message.contract.status
          - message.contract.performance[].id
          - message.contract.performance[].performanceAttributes.fulfillingLocationId
          - message.contract.performance[].performanceAttributes.sla
        schemaPacks:
          common: [Payment/v1]
          trade: [TradeContract/v1, TradePerformance/v1]

  phase3:
    name: Marketplace fulfilment
    stateMachine: schema/extension/trade/TradePerformanceStates/v1/states.yaml#standard
    steps:
      - step: on_status
        trigger: PACKED
        from: MARKETPLACE_BPP
        to: BAP
        direction: unsolicited
      - step: on_status
        trigger: DISPATCHED
        from: MARKETPLACE_BPP
        to: BAP
        direction: unsolicited
        requiredFields:
          - message.contract.performance[].status.descriptor.code
          - message.contract.performance[].performanceAttributes.trackingNumber
      - step: on_status
        trigger: DELIVERED
        from: MARKETPLACE_BPP
        to: BAP
        direction: unsolicited
        requiredFields:
          - message.contract.performance[].status.descriptor.code
          - message.contract.status

policyRequirements:
  cancellation:
    policyRef: ion://policy/cancel.standard.until-dispatched
  returns:
    policyRef: ion://policy/return.standard.14d-sellerpays
  warranty:
    policyRef: ion://policy/warranty.standard.none
  dispute:
    policyRef: ion://policy/dispute.consumer.bpsk
  grievanceSla:
    policyRef: ion://policy/grievance-sla.consumer.standard
  paymentTerms:
    policyRef: ion://policy/payment-terms.upfront.full

