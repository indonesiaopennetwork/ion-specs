# ION Trade Pattern — digital-goods (B2C-DIG)
# NOT OAS. ION pattern specification document.
# Defines standard Beckn commerce for electronically delivered vouchers.

id: ion-trade-pattern-digital-goods-v1
version: "1.0.0"
patternName: digital-goods
sector: ion:trade
status: ready
description: >
  Consumer purchases a digital voucher or subscription that the provider
  delivers electronically to the buyer. Release 1 supports CODE_TO_BUYER and
  QR_VOUCHER delivery using the standard Beckn catalog, select, init, confirm,
  and status actions. PUSH_TO_TARGET and ACCOUNT_CREDIT are excluded because
  Release 1 has no transaction-level schema for a mobile number, meter number,
  game account, wallet account, or other delivery target.

applicableCategories:
  - digital-goods

participants:
  BAP: Buyer App Platform
  BPP: Buyer Price Provider (seller-facing)
  ION_CATALOG: ION Catalogue Service (Phase 1 only)

performanceStateMachine: schema/extension/trade/TradePerformanceStates/v1/states.yaml#digital

phases:
  phase1:
    name: Catalog
    communication: async pub/sub
    description: >
      The BPP publishes electronically delivered vouchers and subscriptions.
      Each denomination may be a VARIANT of a parent resource, but digital
      delivery type is expressed by resourceTangibility, not resourceStructure.
    steps:
      - step: publish_catalog
        from: BPP
        to: ION_CATALOG
        direction: publish
        requiredFields:
          - context.domain
          - context.bppId
          - context.timestamp
          - message.catalog.provider.id
          - message.catalog.provider.descriptor.name
          - message.catalog.provider.providerAttributes.operationalStatus.status
          - message.catalog.provider.providerAttributes.businessRegistration.nib
          - message.catalog.resources[].id
          - message.catalog.resources[].resourceAttributes.name.id
          - message.catalog.resources[].resourceAttributes.shortDesc.id
          - message.catalog.resources[].resourceAttributes.resourceStructure
          - message.catalog.resources[].resourceAttributes.resourceTangibility
          - message.catalog.resources[].resourceAttributes.availability.status
          - message.catalog.resources[].resourceAttributes.images[]
          - message.catalog.resources[].resourceAttributes.digital.digitalCategory
          - message.catalog.resources[].resourceAttributes.digital.operatorOrIssuer
          - message.catalog.resources[].resourceAttributes.digital.denomination
          - message.catalog.resources[].resourceAttributes.digital.deliveryMethod
          - message.catalog.resources[].resourceAttributes.digital.refundable
          - message.catalog.resources[].resourceAttributes.digital.cancellable
          - message.catalog.offers[].id
          - message.catalog.offers[].price
          - message.catalog.offers[].offerAttributes.policies.cancellation.policyRef
          - message.catalog.offers[].offerAttributes.policies.returns.allowed
          - message.catalog.offers[].offerAttributes.policies.returns.policyRef
          - message.catalog.offers[].offerAttributes.policies.dispute.policyRef
          - message.catalog.offers[].offerAttributes.policies.grievanceSla.policyRef
          - message.catalog.offers[].offerAttributes.policies.paymentTerms.policyRef
        conditionalFields:
          - field: message.catalog.resources[].resourceAttributes.parentResourceId
            condition: required when resourceStructure=VARIANT
          - field: message.catalog.resources[].resourceAttributes.isDefaultVariant
            condition: required when resourceStructure=VARIANT
          - field: message.catalog.resources[].resourceAttributes.variantGroup
            condition: required when resourceStructure=VARIANT
          - field: message.catalog.resources[].resourceAttributes.digital.expiryAfterPurchase
            condition: present when the voucher or subscription expires after purchase
        businessRules:
          - >-
            resourceTangibility is DIGITAL_VOUCHER or DIGITAL_SUBSCRIPTION;
            DIGITAL_TOP_UP is outside the Release 1 subset because it requires a
            transaction-level delivery target
          - >-
            digital.deliveryMethod is CODE_TO_BUYER or QR_VOUCHER; providers must
            not advertise PUSH_TO_TARGET or ACCOUNT_CREDIT for this flow
          - >-
            policies.cancellation.policyRef is
            ion://policy/cancel.digital.before-pending-operator
          - policies.returns.allowed is false
          - policies.returns.policyRef is ion://policy/return.standard.none
          - policies.dispute.policyRef is ion://policy/dispute.consumer.bpsk
          - >-
            policies.grievanceSla.policyRef is
            ion://policy/grievance-sla.consumer.standard
          - policies.paymentTerms.policyRef is ion://policy/payment-terms.upfront.full
        schemaPacks:
          common: [BusinessRegistration/v1]
          trade: [TradeProvider/v1, TradeResource/v1, TradeOffer/v1]

      - step: on_discover
        from: ION_CATALOG
        to: BAP
        direction: push

  phase2:
    name: Transaction
    communication: direct BAP-BPP
    steps:
      - step: select
        from: BAP
        to: BPP
        direction: request
        description: >
          The buyer selects an electronically delivered voucher or subscription.
          The selected resource does not require a physical delivery address or
          a separate operator target.
        requiredFields:
          - context.transactionId
          - context.messageId
          - context.domain
          - context.bapId
          - context.bapUri
          - context.bppId
          - context.bppUri
          - context.timestamp
          - context.ttl
          - message.contract.participants[role=PROVIDER].id
          - message.contract.commitments[].id
          - message.contract.commitments[].commitmentAttributes.lineId
          - message.contract.commitments[].commitmentAttributes.resourceId
          - message.contract.commitments[].commitmentAttributes.offerId
          - message.contract.commitments[].commitmentAttributes.quantity.value
          - message.contract.commitments[].resources[].quantity.count

      - step: on_select
        from: BPP
        to: BAP
        direction: callback
        description: The BPP returns the final quote for the selected digital good.
        requiredFields:
          - message.contract.participants[role=PROVIDER].id
          - message.contract.commitments[].id
          - message.contract.consideration[].considerationAttributes.breakup[]
          - message.contract.consideration[].considerationAttributes.totalAmount
        conditionalFields:
          - field: message.contract.consideration[].considerationAttributes.breakup[].taxDetail.rate
            condition: required on TAX breakup lines
        schemaPacks:
          common: [Tax/v1]
          trade: [TradeConsideration/v1]

      - step: init
        from: BAP
        to: BPP
        direction: request
        description: >
          The buyer supplies contact and payment details. No shipping address is
          required; delivery is through the authenticated buyer experience or
          the buyer contact channel.
        requiredFields:
          - message.contract.participants[role=PROVIDER].id
          - message.contract.commitments[].id
          - message.contract.participants[role=BUYER].person.name
          - message.contract.participants[role=BUYER].contact
          - message.contract.settlements[].settlementAttributes.method
          - message.contract.settlements[].settlementAttributes.paymentRail
          - message.contract.settlements[].settlementAttributes.collectedBy
        schemaPacks:
          common: [Payment/v1]

      - step: on_init
        from: BPP
        to: BAP
        direction: callback
        description: The BPP returns payment instructions and the final quote.
        requiredFields:
          - message.contract.settlements[].settlementAttributes.methodDetail
          - message.contract.consideration[].considerationAttributes.breakup[]
          - message.contract.consideration[].considerationAttributes.totalAmount
        schemaPacks:
          common: [Payment/v1]

      - step: confirm
        from: BAP
        to: BPP
        direction: request
        description: >
          The buyer confirms the contract after payment. Business-registration
          fields are not required for this consumer flow.
        requiredFields:
          - message.contract.participants[role=PROVIDER].id
          - message.contract.commitments[]
          - message.contract.participants[role=BUYER]
          - message.contract.settlements[].settlementAttributes.status

      - step: on_confirm
        from: BPP
        to: BAP
        direction: callback
        description: >
          The BPP accepts the contract and initiates the issuer delivery request.
          Cancellation is closed once PENDING_OPERATOR is returned.
        requiredFields:
          - message.contract.id
          - message.contract.status
          - message.contract.performance[].id
          - message.contract.performance[].status.descriptor.code
          - message.contract.settlements[].settlementAttributes.status
        businessRules:
          - message.contract.status is ACTIVE
          - >-
            message.contract.performance[].status.descriptor.code is
            PENDING_OPERATOR
        schemaPacks:
          common: [Payment/v1]
          trade: [TradePerformance/v1, TradeContract/v1, TradeSettlement/v1]

  phase3:
    name: Digital fulfilment
    description: >
      The provider reports the issuer outcome through standard on_status
      callbacks. No physical logistics performance is created.
    stateMachine: schema/extension/trade/TradePerformanceStates/v1/states.yaml#digital
    steps:
      - step: on_status
        trigger: PENDING_OPERATOR
        from: BPP
        to: BAP
        direction: unsolicited
        requiredFields:
          - message.contract.performance[].status.descriptor.code

      - step: on_status
        trigger: DELIVERED
        from: BPP
        to: BAP
        direction: unsolicited
        description: >
          The issuer confirmed delivery. The committed Resource may be enriched
          with the access-controlled redemption URL.
        requiredFields:
          - message.contract.performance[].status.descriptor.code
          - message.contract.status
        conditionalFields:
          - field: message.contract.commitments[].resources[].resourceAttributes.digital.redemptionUrl
            condition: present when redemption occurs through a URL
        businessRules:
          - message.contract.status is COMPLETE

      - step: on_status
        trigger: DELIVERY_FAILED
        from: BPP
        to: BAP
        direction: unsolicited
        description: >
          The issuer failed to deliver the digital good. The BPP reports the
          failure state and initiates a full refund. Release 1 does not define a
          provider-specific failure-reason field.
        requiredFields:
          - message.contract.performance[].status.descriptor.code
          - message.contract.settlements[].settlementAttributes.refund.refundAmount
          - message.contract.settlements[].settlementAttributes.refund.refundReason
          - message.contract.settlements[].settlementAttributes.refund.refundMethod
        businessRules:
          - >-
            settlementAttributes.refund.refundReason is DELIVERY_FAILED and the
            refund amount is the full collected amount
        schemaPacks:
          common: [Payment/v1]
          trade: [TradeSettlement/v1]

policyRequirements:
  cancellation:
    policyRef: ion://policy/cancel.digital.before-pending-operator
  returns:
    allowed: false
    policyRef: ion://policy/return.standard.none
  dispute:
    policyRef: ion://policy/dispute.consumer.bpsk
  grievanceSla:
    policyRef: ion://policy/grievance-sla.consumer.standard
  paymentTerms:
    policyRef: ion://policy/payment-terms.upfront.full

