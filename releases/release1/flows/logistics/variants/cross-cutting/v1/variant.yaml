id: ion-logistics-variant-cross-cutting-v1
version: 1.0.0
variantType: cross-cutting
sector: ion:logistics
status: ready
subBranches:
  tracking: {steps: [track, on_track], schemaPack: LogisticsTracking/v1}
  status-query: {steps: [status, on_status]}
  support: {steps: [support, on_support]}
  rating: {steps: [rate, on_rate]}
  reconciliation:
    endpointClass: ION_EXTENSION
    steps: [reconcile, on_reconcile]
