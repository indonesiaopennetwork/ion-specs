notes:
- Draft release envelope created during migration Phase 2.
- Phase 2 added the release-owned executable-rules scaffold, representative Trade
  and Logistics smoke inputs, and a pinned OPA toolchain. The area remains
  validation-pending until the later authoring, packaging, signing, and ONIX gates
  are implemented.
- Beckn dependencies were vendored and the offline reference graph was closed during
  Phase 4.
- Standalone Trade and Trade-required common packs, JSON-LD files, and examples were
  validated during Phase 5.
- Release 2 contains standalone Trade and its required common packs plus Logistics
  material under independent review. The Hospitality and Finance sectors are explicitly
  excluded.
- Phase 8A initially included the Storefront v1 flow, 67 Trade or cross-sector policy
  terms, and 8 Trade errors. Later Trade phases expanded this to seven reference flows,
  the During-Transaction v1 and Cancellation v1 variants, and 10 Trade errors.
- Logistics Phase 5 added 22 reviewed draft terms to the shared registry, bringing
  it to 89 terms. These terms are resolvable but are not ratified or effective.
- Logistics Phase 6 added six patterns and nine included or scoped variants. Phase
  7 reviewed all 97 legacy errors, included 30 connected errors under the ION-Bxxxx
  convention, and explicitly deferred 67.
- Logistics Phase 8 passed the complete schema-directory and example-object validator
  runs, connection checks, source-disposition closure, and the full Release 2 gate.
  Logistics is validated with preview implementation maturity.
- The Beckn Protocol contract was initially copied without changes from upstream file
  commit df1ade0c6610d4160968177a706f32df680e4758 to schema/core/api/v2.0.0/ion-beckn.yaml
  as the ION-maintained contract and the identical upstream bytes were re-verified
  at manifest-pinned commit a22300aa83796cb8dfc2b63cd9dd0e36a7f4d3a1. ION then corrected
  DiscoverAction.matchType.default from `any` to the declared enum value `ANY` and
  corrected the /catalog/publish example's offer validity values to RFC 3339 date-times.
  ION then integrated the beckn.yaml changes proposed in Beckn pull request 202, making
  asynchronous callback envelopes carry exactly one of message or error. ION then
  added the optional Support.supportAttributes slot proposed in Beckn pull request
  204. Release 2 publishes only this maintained protocol path; its upstream source
  and ION transformations are recorded under maintainedArtifacts.
- Schema content groups core, common, extension, and vendored below schema/ rather
  than flattening them at the release root.
- Draft Release 2 URLs are unsupported until publication.
- The Grievance common pack attaches to Support.supportAttributes, the optional slot
  ION added to Support in ion-beckn.yaml.
