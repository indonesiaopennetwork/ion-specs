openapi: 3.1.1
info:
  title: ION Address Extension (v1)
  description: >
    Complete Indonesian postal address shape. Reuses every property of the
    pinned Beckn Address and adds Indonesian administrative subdivisions and
    delivery details. Beckn Address is closed, so its properties are composed
    here through property-level references rather than allOf inheritance.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    IONAddress:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      title: Complete Indonesian Address
      description: >
        Complete Indonesian postal address combining the standard Beckn Address
        wire fields with Indonesian administrative subdivisions and delivery
        details.
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/release2/schema/common/Address/v1/context.jsonld'
        '@type': ion:IONAddress
      x-ion-data-residency: ID  # RT/RW and building sub-fields can identify a household
      x-beckn-attaches-to: (reusable shape — embedded by participant, provider,
        performance, and other attribute packs that require a complete Indonesian address)
      properties:
        addressCountry:
          $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/addressCountry
          description: Country name or ISO-3166-1 alpha-2 code; use ID for an Indonesian address.
        addressLocality:
          $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/addressLocality
          description: City or locality name, such as Jakarta Pusat.
        addressRegion:
          $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/addressRegion
          description: Province or region name, such as DKI Jakarta.
        extendedAddress:
          $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/extendedAddress
          description: Apartment, suite, floor, care-of, or other supplemental address information.
        streetAddress:
          $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/streetAddress
          description: Building name or number and street name.
        provinsiCode:
          type: string
          enum:
          - BPS-11
          - BPS-12
          - BPS-13
          - BPS-14
          - BPS-15
          - BPS-16
          - BPS-17
          - BPS-18
          - BPS-19
          - BPS-21
          - BPS-31
          - BPS-32
          - BPS-33
          - BPS-34
          - BPS-35
          - BPS-36
          - BPS-51
          - BPS-52
          - BPS-53
          - BPS-61
          - BPS-62
          - BPS-63
          - BPS-64
          - BPS-65
          - BPS-71
          - BPS-72
          - BPS-73
          - BPS-74
          - BPS-75
          - BPS-76
          - BPS-81
          - BPS-82
          - BPS-91
          - BPS-92
          - BPS-94
          description: 'Indonesian province code using BPS 2-digit numeric codes prefixed with BPS-. 34 provinces.
            Used for serviceability, tax zone determination, and logistics pricing.

            '
          example: BPS-31
          x-ion-regulatory: Permendagri 72/2019 tentang Perubahan atas Permendagri 137/2017
        kabupatenCode:
          type: string
          pattern: ^[0-9]{4}$
          description: 'BPS 4-digit kabupaten/kota code. 514 kabupaten and kota in Indonesia. Used for granular
            serviceability and tax zone resolution.

            '
          example: '3171'
          x-ion-regulatory: Permendagri 72/2019
        kelurahan:
          type: string
          description: 'Village or urban administrative zone (kelurahan/desa). Required for precise last-mile delivery
            address.

            '
          example: Gambir
          x-ion-condition: Required for delivery addresses
        kecamatan:
          type: string
          description: 'District or sub-city (kecamatan). Administrative level between kabupaten and kelurahan.

            '
          example: Gambir
          x-ion-condition: Required for delivery addresses
        rt:
          type: string
          description: 'Rukun Tetangga — neighborhood group, typically ~40 households. Critical for last-mile delivery
            in Indonesia — riders use RT/RW to locate specific houses in dense residential areas.

            '
          example: '02'
        rw:
          type: string
          description: 'Rukun Warga — association of RTs, typically ~400 people. Used together with RT for precise
            address resolution.

            '
          example: '03'
        postalCode:
          allOf:
          - $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Address/2.0/attributes.yaml#/components/schemas/Address/properties/postalCode
          - type: string
            pattern: ^[0-9]{5}$
          description: 'Indonesian kodepos (postal code). 5 digits. Distinct from Beckn core area_code which conflates
            many country-specific codes.

            '
          example: '12190'
          x-ion-regulatory: PermenKomInfo — Standar Kodepos Nasional
        addressType:
          type: string
          enum:
          - HOME
          - OFFICE
          - APARTMENT
          - BOARDING_HOUSE
          - WAREHOUSE
          - PO_BOX
          - PICKUP_POINT
          - OTHER
          description: 'Address classification. Affects delivery SLA and surcharges — offices have restricted delivery
            hours, apartments require lobby/concierge handling, warehouses accept larger shipments. BOARDING_HOUSE
            (kost) is common in Indonesian urban delivery.

            '
          example: HOME
        receiverInstructions:
          type: string
          maxLength: 500
          description: 'Instructions for delivery receiver. Distinct from buyerInstructions — used for gift orders
            where receiver != buyer, and for handover preferences (leave at door, signature required, call first).

            '
          example: Tinggalkan di pos satpam apartemen. Jangan ketuk pintu.
        gpsAccuracyMeters:
          type: number
          minimum: 0
          description: 'Accuracy of GPS coordinate in metres. Required for pin-point delivery addresses in unaddressed
            areas (kampung, peri-urban). Affects agent last-mile routing.

            '
          example: 10
        landmark:
          type: string
          description: 'Notable nearby landmark for finding the address. Common in Indonesian urban delivery where
            street numbering is inconsistent.

            '
          example: Sebelah Indomaret, seberang masjid
        blockUnit:
          type: string
          description: 'Block/unit identifier for apartments and complexes. Beckn core ''door'' captures house number;
            this captures block/floor/unit where applicable.

            '
          example: Blok A3 Lantai 12 Unit 05
      # ION network mandatory: Indonesian address components required per BPS administrative hierarchy
      # NETWORK POLICY NOTE (GAP 32 / NFH-012 CON-012-18):
      # Shared schemas MUST NOT declare mandatory fields.
      # The following fields were required in v0.6.0 and are now
      # enforced via ION network policy (x-ion-crc-rules,
      # x-ion-conditional-rules) rather than the shared schema:
      # provinsiCode
      x-ion-closed-extensions: false
