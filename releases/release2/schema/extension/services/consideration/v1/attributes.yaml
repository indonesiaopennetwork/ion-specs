openapi: "3.1.1"
info:
  title: ION Services Social Scheme Consideration Extension (v1)
  version: 1.0.0
  description: |
    Consideration-level (price breakup) attributes for a social-scheme
    facilitation service on ION (CRC SVC-social). Government benefit amounts
    are never a Consideration line — Consideration here covers only what the
    applicant, if anything, pays the facilitation partner.

    ION v2.0 placement:
      Placed in Consideration.considerationAttributes at /on_select, /on_init.
      Consideration.considerationAttributes["@context"] — context.jsonld URI
      Consideration.considerationAttributes["@type"]    — "ion:IONSocialSchemeConsiderationAttributes"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:

    SocialSchemeConsideration:
      type: object
      title: SocialSchemeConsideration
      description: Network-agnostic generic layer. Inherits from Beckn core Attributes.
      x-ion-layer: generic
      x-ion-split-version: "1.0.0"
      x-recommended-parent: Consideration.considerationAttributes
      additionalProperties: true
      allOf:
        - $ref: https://schema.ion.id/release2/schema/vendored/beckn/schemas/Attributes/2.0/attributes.yaml#/components/schemas/Attributes

    IONSocialSchemeConsiderationAttributes:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "1.0.0"
      allOf:
        - $ref: '#/components/schemas/SocialSchemeConsideration'
      description: |
        A single price-breakup line for a social-scheme facilitation service.
      x-jsonld:
        '@context': 'https://schema.ion.id/release2/schema/extension/services/consideration/v1/context.jsonld'
        '@type': ion:IONSocialSchemeConsiderationAttributes
      x-beckn-attaches-to: Consideration.considerationAttributes
      additionalProperties: true
      properties:
        breakupLineType:
          type: string
          description: What this price line represents.
          enum: [FACILITATION_FEE, DOCUMENT_PROCESSING_FEE, GOVERNMENT_FEE_PASSTHROUGH, DISCOUNT, TAX]
          example: "FACILITATION_FEE"
        totalAmount:
          type: number
          minimum: 0
          example: 25000
        currency:
          type: string
          default: IDR
          example: "IDR"
        governmentFeeReceipt:
          type: string
          description: >
            When breakupLineType is GOVERNMENT_FEE_PASSTHROUGH (e.g. a
            statutory document-issuance fee the scheme itself charges),
            reference number for the official government receipt this line
            passes through. Absent for facilitation-only lines.
          example: "PNBP-2026-00019284"
