openapi: 3.1.0
info:
  title: IONHospitalityCommitment
  version: 1.0.0-draft.3
paths: {}
components:
  schemas:
    IONHospitalityCommitment:
      type: object
      description: Draft hospitality commitment extension for event admission ticketing.
      properties:
        offerRef:
          type: string
          description: Selected offer identity.
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          description: Purchased offer units, not necessarily admission count.
        allocations:
          type: array
          description: Capacity requested or allocated for each session.
          items:
            type: object
            description: Capacity allocated or requested for one session and pool.
            properties:
              sessionId:
                type: string
                description: Session identity.
                minLength: 1
              poolId:
                type: string
                description: Authoritative capacity pool.
                minLength: 1
              mode:
                type: string
                description: Method by which admission capacity is allocated.
                enum:
                - GENERAL_ADMISSION
                - SECTION_UNASSIGNED
                - EXACT_SEAT
                - AUTO_ASSIGN
                - WHOLE_TABLE
                - TABLE_SEAT
              admissions:
                type: integer
                minimum: 1
                description: Number of admissions represented by this allocation.
              sectionId:
                type: string
                description: Section identifier.
                minLength: 1
              seatIds:
                type: array
                description: Exact assigned seat identifiers.
                items:
                  type: string
                  description: Opaque identifier scoped to the authoritative provider.
                  minLength: 1
                minItems: 1
                uniqueItems: true
              tableId:
                type: string
                description: Table identifier.
                minLength: 1
              layoutRevision:
                type: string
                description: Layout revision for assigned seats.
                minLength: 1
              adjacentRequested:
                type: boolean
                description: Buyer requests adjacent seats.
              accessibleRequested:
                type: boolean
                description: Buyer requests accessible allocation.
              allocationState:
                type: string
                enum:
                - REQUESTED
                - PROPOSED
                - HELD
                - COMMITTED
                - RELEASED
                description: Allocation stage.
              accessibleSeatId:
                type: string
                minLength: 1
                description: Accessible seat in the allocation.
              companionSeatId:
                type: string
                minLength: 1
                description: Companion seat associated with accessible seat.
            required:
            - sessionId
            - poolId
            - mode
            - admissions
            - allocationState
            additionalProperties: false
            allOf:
            - if:
                properties:
                  mode:
                    const: SECTION_UNASSIGNED
                required:
                - mode
              then:
                required:
                - sectionId
            - if:
                properties:
                  mode:
                    const: EXACT_SEAT
                required:
                - mode
              then:
                required:
                - seatIds
                - layoutRevision
            - if:
                properties:
                  mode:
                    const: WHOLE_TABLE
                required:
                - mode
              then:
                required:
                - tableId
                - seatIds
                - layoutRevision
            - if:
                properties:
                  mode:
                    const: TABLE_SEAT
                required:
                - mode
              then:
                required:
                - tableId
                - seatIds
                - layoutRevision
            - if:
                properties:
                  mode:
                    enum:
                    - GENERAL_ADMISSION
                    - SECTION_UNASSIGNED
                required:
                - mode
              then:
                not:
                  anyOf:
                  - required:
                    - seatIds
                  - required:
                    - tableId
            - if:
                properties:
                  mode:
                    const: AUTO_ASSIGN
                  allocationState:
                    enum:
                    - PROPOSED
                    - HELD
                    - COMMITTED
                required:
                - mode
                - allocationState
              then:
                required:
                - seatIds
                - layoutRevision
          minItems: 1
          uniqueItems: false
        quoteRef:
          type: string
          description: Quote identity.
          minLength: 1
        quoteExpiresAt:
          type: string
          description: Latest acceptance time.
          format: date-time
        hold:
          type: object
          description: Authoritative temporary capacity reservation.
          properties:
            holdId:
              type: string
              description: Opaque hold identifier.
              minLength: 1
            expiresAt:
              type: string
              description: Exclusive expiry boundary.
              format: date-time
            basketDigest:
              type: string
              description: Hash of accepted basket.
              pattern: ^[a-f0-9]{64}$
            state:
              type: string
              description: Hold status.
              enum:
              - HELD
              - COMMITTED
              - RELEASED
              - EXPIRED
          required:
          - holdId
          - expiresAt
          - basketDigest
          - state
          additionalProperties: false
        attendeeRefs:
          type: array
          description: Opaque attendee references; no identity documents.
          items:
            type: string
            description: Opaque identifier scoped to the authoritative provider.
            minLength: 1
          minItems: 1
          uniqueItems: true
        attendeeType:
          type: string
          enum:
          - ADULT
          - CHILD
          - STUDENT
          - SENIOR
          description: Eligibility price class.
        eligibilityRef:
          type: string
          minLength: 1
          description: Opaque eligibility verification reference.
        selectedAddOnRefs:
          type: array
          items:
            type: string
            minLength: 1
            description: Selected add-on.
          minItems: 1
          description: Explicitly chosen optional add-ons.
      required:
      - offerRef
      - quantity
      - allocations
      additionalProperties: true
      x-beckn-attaches-to: Commitment.commitmentAttributes
      x-ion-layer: ion
      x-ion-experimental: true
      x-jsonld:
        '@context': https://schema.ion.id/release2/schema/extension/hospitality/HospitalityCommitment/v1/context.jsonld
        '@type': ion:IONHospitalityCommitment
      x-recommended-parent: Commitment.commitmentAttributes
