openapi: 3.1.1
info:
  title: ION Localization Extension (v1)
  description: "Bilingual and multilingual text fields for ION catalog content. Defines the language object pattern\
    \ used across all sectors. \"id\" (Bahasa Indonesia) is always mandatory. \"en\" (English) is mandatory for\
    \ export commerce patterns (cross-border pattern).\nRELATIONSHIP TO BECKN DESCRIPTOR — Beckn's `Descriptor.name`, `Descriptor.shortDesc`,\
    \ `Descriptor.longDesc` are flat strings. ION does NOT override these. Implementations populate Beckn's flat\
    \ fields with the default-locale value (Bahasa Indonesia, `id`), and carry the full multilingual map inside\
    \ `resourceAttributes.localization` and `providerAttributes.localization`. Consumers that only read Beckn-native\
    \ fields see sensible Indonesian text; ION-aware consumers read the full map from the Attributes bag.\nATTACH\
    \ POINTS — Resource.resourceAttributes.localization,\n                Provider.providerAttributes.localization,\n\
    \                Offer.offerAttributes.localization (where applicable).\n"
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    # x-ion-layer: generic — not applicable (ION-native schema, no Beckn upstream parent)
    # x-ion-layer-note: This pack is ION-native. The primary schema carries x-ion-layer: ion directly.
    LocalisedText:
      type: object
      title: Localised Text Object
      description: 'Language-keyed text object. Keys are ISO 639-1 language codes. "id" is always mandatory per
        ION network policy. "en" is mandatory for export commerce (cross-border pattern). Additional languages optional: ms
        (Malay), zh (Chinese), ar (Arabic), ta (Tamil), ko (Korean), ja (Japanese).

        '
      minProperties: 1
      additionalProperties:
        type: string
      properties:
        id:
          type: string
          description: Bahasa Indonesia — always required
        en:
          type: string
          description: English — required for cross-border pattern
        ms:
          type: string
          description: Bahasa Melayu
        zh:
          type: string
          description: Mandarin Chinese (Simplified)
        ar:
          type: string
          description: Arabic
        ta:
          type: string
          description: Tamil
        ko:
          type: string
          description: Korean
        ja:
          type: string
          description: Japanese
      example:
        id: Nasi Goreng Spesial
        en: Special Fried Rice
      required:
      - id
    IONCatalogLocalization:
      type: object
      title: ION Catalog Localization
      description: 'Localised text fields for catalog content — name, short description, long description. All three
        use the LocalisedText pattern. These extend beckn:descriptor fields with proper multilingual support.

        '
      additionalProperties: false
      x-jsonld:
        '@context': 'https://schema.ion.id/core/localization/v1/context.jsonld'
        '@type': ion:CatalogLocalization
      x-beckn-attaches-to: Resource.resourceAttributes
      properties:
        name:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Product or service name as a language object. Supplements Beckn `Descriptor.name` (which
            carries the default-locale text, normally `id`). Consumers that read only Beckn-native fields see Indonesian;
            ION-aware consumers read the multilingual map here. "id" always mandatory.

            '
          x-ion-regulatory: ION Network Policy — Bahasa Indonesia localisation requirement
        shortDesc:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Short description for catalog listings and search results. Max 150 characters per language.
            Supplements Beckn `Descriptor.shortDesc`. "id" mandatory.

            '
          x-ion-regulatory: ION Network Policy — bilingual catalog requirement
        longDesc:
          $ref: '#/components/schemas/LocalisedText'
          description: 'Full product description for product detail page. Supplements Beckn `Descriptor.longDesc`.
            "id" mandatory. "en" mandatory for cross-border pattern.

            '
          x-ion-regulatory: ION Network Policy — Bahasa Indonesia localisation requirement
      # required: removed — mandatoriness declared in x-ion-field-requirements network policy

    IonLocalization:
      type: object
      additionalProperties: true
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      x-ion-native: true
      title: IonLocalization
      description: >
        Network-level locale settings for an ION network participant, declaring the
        participant's default locale, timezone, currency, and display format preferences.
        Produced by CNs and PNs at registration and carried in providerAttributes or
        participantAttributes. Consumed by ONIX and by counterparty CNs/PNs to render
        amounts, dates, and numbers in the sender's preferred locale without runtime
        negotiation.

        Relationship: ION-native schema with no upstream beckn/schemas parent. Extends
        the core/localization schema pack alongside IONCatalogLocalization and LocalisedText.
      x-beckn-attaches-to: Provider.providerAttributes
      properties:
        defaultLocale:
          type: string
          description: >
            BCP 47 language tag for the participant's default locale. The locale used
            when no explicit language preference is provided by the counterparty.
            Beckn Descriptor.name and shortDesc are populated using this locale.
          example: id-ID
          default: id-ID
        supportedLocales:
          type: array
          description: >
            Ordered list of BCP 47 locale tags this participant can produce content in.
            The first entry is the default locale. Consumers MAY request content in any
            listed locale; the participant SHOULD respond in the requested locale if supported.
          items:
            type: string
          example: [id-ID, en-US]
          default: [id-ID]
        defaultTimezone:
          type: string
          description: >
            IANA timezone identifier for the participant's operating timezone. Used to
            interpret date-only fields (e.g. offer validity startDate/endDate) and to
            display timestamps in the participant's local time. All wire timestamps remain
            in UTC per Beckn protocol; this field governs display only.
          example: Asia/Jakarta
          default: Asia/Jakarta
        defaultCurrency:
          type: string
          description: >
            ISO 4217 currency code for the participant's default trading currency.
            Consideration amounts without an explicit currency field are interpreted
            in this currency. For ION network participants this is IDR.
          example: IDR
          default: IDR
        numberFormat:
          type: string
          description: >
            Number formatting convention used by this participant for display purposes.
            PERIOD_COMMA: 1.000,00 (Indonesian standard — period as thousands separator,
            comma as decimal separator). COMMA_PERIOD: 1,000.00 (English standard).
          enum:
            - PERIOD_COMMA
            - COMMA_PERIOD
          default: PERIOD_COMMA
          example: PERIOD_COMMA
        dateFormat:
          type: string
          description: >
            Date display format used by this participant. Values follow Unicode CLDR
            date pattern syntax. Does not affect wire-format dates (ISO 8601 always used
            on wire). DD/MM/YYYY is the Indonesian standard display convention.
          example: DD/MM/YYYY
          default: DD/MM/YYYY
      # required: removed — mandatoriness declared in x-ion-field-requirements network policy
