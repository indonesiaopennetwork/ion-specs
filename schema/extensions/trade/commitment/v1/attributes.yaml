openapi: 3.1.1
info:
  title: ION Trade Commitment Extension (v1)
  description: 'Trade sector commitment attributes. Per-line item details within a contract — resource reference,
    offer reference, quantity, locked price, customisation selections, and special instructions. Entirely from Beckn
    v2.1 generalised model — not in dictionary v1.0. Attaches to: beckn:Commitment.commitmentAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    TradeCommitment:
      type: object
      title: TradeCommitment
      description: >
        Network-agnostic generic layer for TradeCommitment. Inherits from Beckn core Attributes.
        Downstream ION-specific layer (IONTradeCommitment) extends this schema via allOf.
        This layer carries only fields that are meaningful across any Beckn network — 
        no Indonesia-specific regulatory or compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Commitment.commitmentAttributes
      additionalProperties: true
      allOf:
        # REMOTE upstream (active — used by ONIX at validation time):
        # - $ref: https://raw.githubusercontent.com/beckn/local-retail/main/schema/RetailCommitment/v2.1/attributes.yaml#/components/schemas/RetailCommitment
        # LOCAL vendored reference copy (for offline review and version drift detection):
        # - $ref: ../../../../core/v2/api/v2.0.0/vendored/retail-commitment-v2.1.yaml#/components/schemas/RetailCommitment
    IONTradeCommitment:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      allOf:
        - $ref: '#/components/schemas/TradeCommitment'
      title: TradeCommitment
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/trade/commitment/v1/context.jsonld'
        '@type': ion:IONTradeCommitment
      x-beckn-attaches-to: Commitment.commitmentAttributes
      properties:
        lineId:
          type: string
          description: 'Unique identifier for this commitment line within the contract. Assigned by BAP at select.
            Persists through the contract lifecycle. Used to reference specific lines in updates, cancellations,
            returns.

            '
          example: L01
        resourceId:
          type: string
          description: 'ID of the resource being committed. References beckn:Resource.id from the catalog. For VARIANT
            resources, this is the specific variant ID, not the parent.

            '
          example: ITEM-001
        offerId:
          type: string
          description: 'ID of the offer under which this resource is being committed. References beckn:Offer.id
            from the catalog.

            '
          example: OFFER-001
        quantity:
          type: object
          additionalProperties: false
          description: Quantity of this resource being committed.
          properties:
            count:
              type: integer
              minimum: 1
              description: Unit count for discrete items
              example: 2
            measure:
              type: object
              additionalProperties: false
              description: Weight or volume measure for continuous items
              properties:
                unit:
                  type: string
                  enum:
                  - GRAM
                  - KILOGRAM
                  - LITRE
                  - MILLILITRE
                  - PIECE
                  - DOZEN
                  - METER
                value:
                  type: number
                  minimum: 0
              required:
              - unit
              - value
        price:
          type: object
          additionalProperties: false
          description: 'Locked price for this commitment line as agreed at select. Price is fixed at on_select and
            does not change unless a mid-transaction-changes variant is triggered.

            '
          properties:
            value:
              type: string
              description: IDR amount as string decimal
              example: '89000'
            currency:
              type: string
              const: IDR
              default: IDR
          required:
          - value
          - currency
          x-ion-condition: Set by BPP at on_select
        customisationSelections:
          type: array
          description: 'Buyer''s selections from customisationGroups for COMPOSED and WITH_EXTRAS resources. One
            entry per group selected.

            '
          items:
            type: object
            additionalProperties: false
            properties:
              groupId:
                type: string
                description: ID of the customisationGroup selected from
                example: CG-SIZE
              optionId:
                type: string
                description: ID of the option selected within the group
                example: OPT-LARGE
              priceDelta:
                type: object
                additionalProperties: false
                description: Price delta applied by this selection
                properties:
                  type:
                    type: string
                    enum:
                    - FIXED
                    - PERCENT
                  value:
                    type: number
            required:
            - groupId
            - optionId
          x-ion-condition: Required for COMPOSED and WITH_EXTRAS resources
        specialInstructions:
          type: string
          description: 'Per-line buyer note. e.g. "Extra crispy base", "No onion", "Gift wrap this item separately".
            Visible to seller at fulfilment.

            '
          maxLength: 500
          example: Tanpa bawang, tolong pedas ekstra.
      # NETWORK POLICY NOTE (GAP 32 / NFH-012 CON-012-18):
      # Shared schemas MUST NOT declare mandatory fields.
      # The following fields were required in v0.6.0 and are now
      # enforced via ION network policy (x-ion-crc-rules,
      # x-ion-conditional-rules) rather than the shared schema:
      # lineId, resourceId, offerId, quantity
      x-ion-closed-extensions: false
