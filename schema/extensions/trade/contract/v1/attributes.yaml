openapi: 3.1.1
info:
  title: ION Trade Contract Extension (v1)
  description: 'Trade sector contract attributes. Order-level fields that lock at confirm — fulfilling location,
    buyer instructions, gift, invoice preferences, credit terms, subscription billing, Faktur Pajak reference, quote
    trail. Attaches to: beckn:Contract.contractAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    TradeContract:
      type: object
      title: TradeContract
      description: >
        Network-agnostic generic layer for TradeContract. Inherits from Beckn core Attributes.
        Downstream ION-specific layer (IONTradeContract) extends this schema via allOf.
        This layer carries only fields that are meaningful across any Beckn network — 
        no Indonesia-specific regulatory or compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Contract.contractAttributes
      additionalProperties: true
      allOf:
        - $ref: https://schema.beckn.io/RetailContract/v2.1/attributes.yaml#/components/schemas/RetailContract
    IONTradeContract:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      allOf:
        - $ref: '#/components/schemas/TradeContract'
        - if:
            properties:
              subscriptionPauseType:
                const: PAUSED_UNTIL_DATE
            required:
            - subscriptionPauseType
          then:
            required:
            - subscriptionPauseUntil
      title: TradeContract
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/trade/contract/v1/context.jsonld'
        '@type': ion:IONTradeContract
      x-beckn-attaches-to: Contract.contractAttributes
      properties:
        fulfillingLocationId:
          type: string
          description: 'ID of the specific fulfilment centre that will fulfil this order. Populated by BPP at on_confirm
            after internal FC selection. Present when provider has multiple FC locations.

            '
          example: FC-SBY-01
          x-ion-condition: Present when provider has multiple fulfilment centres
        deliveryPreferences:
          type: object
          additionalProperties: false
          properties:
            preferredTimeSlot:
              type: object
              additionalProperties: false
              description: Buyer's preferred delivery time window.
              properties:
                start:
                  type: string
                  format: date-time
                  example: 2026-04-03 09:00:00+07:00
                end:
                  type: string
                  format: date-time
                  example: 2026-04-03 13:00:00+07:00
              required:
              - start
              - end
            preferredPerformanceMode:
              type: string
              enum:
                - DELIVERY
                - SELF_PICKUP
                - DINE_IN
                - CURBSIDE
        invoicePreferences:
          type: object
          additionalProperties: false
          description: Buyer's invoice type and tax identity declaration.
          properties:
            taxId:
              type: object
              additionalProperties: false
              properties:
                scheme:
                  type: string
                  enum:
                    - NPWP
                    - NIK
                  description: NPWP for businesses, NIK for individuals
                value:
                  type: string
                  description: Tax ID number
                  example: "1234567890123456"
              required:
              - scheme
              - value
            invoiceType:
              type: string
              enum:
                - RECEIPT
                - TAX_INVOICE
                - EINVOICE
                - SURAT_TAGIHAN
                - KOMERSIAL_INVOICE
              description: 'RECEIPT: simple receipt, no tax identity required. TAX_INVOICE: Faktur Pajak, requires
                PKP seller and NPWP buyer. EINVOICE: e-Faktur via DJP system. SURAT_TAGIHAN: PKP seller to non-PKP
                buyer — commercial invoice, no input-tax claim rights. KOMERSIAL_INVOICE: cross-border commercial
                invoice, bilingual layout.

                '
              example: TAX_INVOICE
        fakturPajakReference:
          type: string
          description: 'Faktur Pajak (e-Invoice) reference number assigned by BPP after contract confirm for PKP
            sellers. 16-digit DJP format.

            '
          example: 010.000-26.00000001
          x-ion-regulatory: PMK 168/PMK.010/2023 tentang Faktur Pajak
          x-ion-cross-schema-condition: true
          x-ion-condition: Required for PKP sellers (identity.pkpStatus=PKP) when invoiceType=TAX_INVOICE
        purchaseOrderReference:
          type: string
          description: 'Buyer''s Purchase Order number for B2B wholesale transactions. Allows buyer to link ION
            contract to their internal PO system.

            '
          example: PO-2026-00456
          x-ion-condition: Required for B2B wholesale commerce patterns
        cancellationReasonCode:
          type: string
          description: 'Standardised cancellation reason code when contract is cancelled. Set by BPP on contract
            at time of cancellation.

            '
          enum:
            - BUYER_REQUESTED
            - SELLER_INITIATED
            - ITEM_UNAVAILABLE
            - PAYMENT_FAILED
            - FRAUD_SUSPECTED
            - REGULATORY_HOLD
            - LOGISTICS_FAILURE
            - FORCE_CANCEL_TAT_BREACH
          x-ion-condition: Required when contract status is CANCELLED
        quoteTrail:
          type: array
          description: 'Trail of quote changes for mid-transaction-changes variant. Each entry records a delta to the original
            confirmed quote.

            '
          items:
            type: object
            additionalProperties: false
            properties:
              type:
                type: string
                enum:
                  - ITEM
                  - TAX
                  - DELIVERY
                  - DISCOUNT
                  - REFUND
                  - ADJUSTMENT
              id:
                type: string
                description: Item ID or consideration ID this adjustment applies to
              currency:
                type: string
                const: IDR
              value:
                type: string
                description: Signed IDR amount. Negative for deductions, positive for additions.
                example: '-5000'
              reason:
                type: string
                description: Human-readable reason for this adjustment
            required:
            - type
            - id
            - currency
            - value
        partialCancellationAllowed:
          type: boolean
          description: Whether individual items in a multi-item order can be cancelled.
          default: false
        replacementPreferred:
          type: boolean
          description: 'Whether buyer prefers replacement over refund in case of defective or wrong item. Declared
            at confirm.

            '
          default: false
        disputeWindowDays:
          type: integer
          minimum: 0
          description: 'Number of days after delivery within which buyer may raise a dispute. Defaults to ION network
            policy if not declared.

            '
          example: 7
        creditTermsDays:
          type: integer
          minimum: 0
          description: 'Number of days credit extended to the buyer from delivery date. 0 = prepaid. Common values:
            7, 14, 30, 45, 60, 90.

            '
          example: 30
          x-ion-condition: Required for business-procurement (business-credit variant) commerce pattern
        paymentDueDate:
          type: string
          format: date-time
          description: 'Absolute datetime by which payment must be made for credit orders. Computed from delivery
            date + creditTermsDays.

            '
          example: 2026-05-19 23:59:59+07:00
          x-ion-condition: Required when creditTermsDays > 0
        subscriptionBillingCycle:
          type: string
          enum:
            - WEEKLY
            - FORTNIGHTLY
            - MONTHLY
            - QUARTERLY
            - ANNUAL
          description: Billing cycle for subscription commerce pattern.
          example: MONTHLY
          x-ion-condition: Required for subscription commerce pattern
        subscriptionNextBillingDate:
          type: string
          format: date-time
          description: 'Date-time of next billing event. Updated by BPP after each successful billing.

            '
          example: 2026-05-19 00:00:00+07:00
          x-ion-condition: Required for subscription commerce pattern
        linkedContractId:
          type: string
          description: 'Reference to the Trade Contract this Logistics Contract serves. Enables ION Central to trace
            causal relationship between trade and logistics transactions.

            '
          example: TRD-2026-00012345
          x-ion-condition: Required on all Logistics Contracts linked to a Trade fulfilment
        codAmount:
          type: string
          description: 'Total cash amount to be collected from consumer at delivery for COD orders. String decimal
            in IDR.

            '
          example: '150000'
          x-ion-cross-schema-condition: true
          x-ion-condition: Required when paymentRail=COD
        beaCukaiReference:
          type: string
          description: 'Indonesian Customs (Bea Cukai) clearance reference number. Required for all international
            inbound shipments.

            '
          example: BC-2026-001234567
          x-ion-regulatory: UU 17/2006 tentang Kepabeanan; PMK 199/PMK.010/2019
          x-ion-condition: Required for INTERNATIONAL_AIR and INTERNATIONAL_OCEAN logistics
        liveCommerceContext:
          type: object
          additionalProperties: false
          description: 'Context for orders placed via live commerce or social commerce (TikTok Shop, Shopee Live,
            Tokopedia Play, OTT-embedded commerce). Required for live-commerce pattern. Enables revenue attribution to
            streamer/affiliate and platform-specific settlement.

            '
          properties:
            sourceChannel:
              type: string
              enum:
                - LIVE_STREAM
                - SHORT_VIDEO
                - OTT_EMBEDDED
                - SOCIAL_POST
                - AFFILIATE_LINK
                - GROUP_BUY
                - SHOPPABLE_AD
              description: 'Entry point for the order. OTT_EMBEDDED = order placed from within video streaming app
                (Netflix, Vidio, Disney+ Hotstar shoppable content).

                '
            liveSessionId:
              type: string
              description: Live session identifier when sourceChannel=LIVE_STREAM
              example: SHP-LIVE-2026-0419-8837
            streamerId:
              type: string
              description: 'Creator/streamer subscriber ID for revenue attribution. Streamer may earn commission
                separately from BPP/BAP.

                '
              example: streamer.ion.id/budi-gadget
            streamerCommissionPercent:
              type: number
              minimum: 0
              maximum: 1
              description: Streamer's commission as fraction of item value
              example: 0.05
            productPinnedAtMinute:
              type: integer
              minimum: 0
              description: Minutes into the live session when this product was pinned/featured
            ottPlatform:
              type: string
              enum:
                - VIDIO
                - NETFLIX
                - DISNEY_PLUS_HOTSTAR
                - IFLIX
                - VIU
                - GENFLIX
                - WETV
                - YOUTUBE
                - OTHER
              description: OTT platform where shoppable content was served (for OTT_EMBEDDED)
            ottContentId:
              type: string
              description: OTT platform's content ID (movie, episode, match) where item was shown
              example: VIDIO-MATCH-PERSIJA-PERSIB-2026-04-19
            ottTimestampSeconds:
              type: integer
              description: Playback position in seconds when product was presented
            shortVideoId:
              type: string
              description: Short-video/reel ID when sourceChannel=SHORT_VIDEO
            affiliateId:
              type: string
              description: Affiliate subscriber ID when sourceChannel=AFFILIATE_LINK
            groupBuyId:
              type: string
              description: Group-buy session ID when sourceChannel=GROUP_BUY
            groupBuyMinParticipants:
              type: integer
              description: Minimum participants needed for group discount to activate
            groupBuyActivated:
              type: boolean
              description: Whether group-buy discount has been unlocked
          x-ion-condition: Required for live-commerce pattern; optional otherwise
        refundDestination:
          type: object
          additionalProperties: false
          description: 'Where refund will be credited. When buyer does not specify, default is ORIGINAL_PAYMENT_METHOD.
            Platform wallets often faster; store credit used for partial refunds and goodwill.

            '
          required:
          - method
          properties:
            method:
              type: string
              enum:
                - ORIGINAL_PAYMENT_METHOD
                - PLATFORM_WALLET
                - BANK_TRANSFER
                - LOYALTY_POINTS
                - STORE_CREDIT
                - VOUCHER
            walletId:
              type: string
              description: Required when method=PLATFORM_WALLET
            bankAccount:
              type: object
              additionalProperties: false
              properties:
                bankCode:
                  type: string
                accountNumber:
                  type: string
                accountName:
                  type: string
              description: Required when method=BANK_TRANSFER
            loyaltyMultiplier:
              type: number
              description: Bonus multiplier when redeeming to loyalty points e.g. 1.1 = 10% bonus
        subscriptionTrialDays:
          type: integer
          minimum: 0
          description: First N days free. Billing starts on day N+1.
        subscriptionPauseType:
          type: string
          enum:
            - ACTIVE
            - PAUSED_UNTIL_DATE
            - PAUSED_INDEFINITE
          description: Current pause state for subscription orders
        subscriptionPauseUntil:
          type: string
          format: date-time
          description: Date to automatically resume. Required when pauseType=PAUSED_UNTIL_DATE
        gift:
          type: boolean
          description: >-
            Simple gift flag. True when this order is a gift. When declared true,
            populate giftingDetails for recipient name, message, and wrap preferences.
            Patterns reference this field as the shorthand gifting signal; giftingDetails
            carries the full structured data.
          x-ion-condition: Optional; when true, giftingDetails should be populated
        giftingDetails:
          type: object
          additionalProperties: false
          description: Structured gifting details replacing the simple gift flag.
          properties:
            isGift:
              type: boolean
            recipientName:
              type: string
            recipientPhone:
              type: string
            giftMessage:
              type: string
              maxLength: 280
              description: Message printed on gift card / packing slip
            hideSenderInfo:
              type: boolean
              default: false
              description: Anonymous gift — omit buyer details from all visible surfaces
            priceDisplayOnPackage:
              type: boolean
              default: false
              description: Whether to show prices on packing slip
            giftWrapOfferId:
              type: string
              description: Reference to the gift-wrap offer in consideration breakup
        paymentSchedule:
          type: array
          description: 'Multi-milestone payment schedule for partial-payment offers (down-payment + balance, milestone-based
            for services, etc.). Used when policies.paymentTerms.policyRef references a schedule-based IRI. Single-payment orders
            do not require this field. Contract moves to COMPLETE only when all milestones are PAID.

            '
          items:
            type: object
            additionalProperties: false
            properties:
              milestone:
                type: string
                enum:
                  - AT_CONFIRM
                  - ON_DISPATCH
                  - ON_DELIVERY
                  - POST_DELIVERY
                  - ON_MILESTONE_EVENT
                description: Event that triggers this payment
              milestoneLabel:
                type: string
                description: Human-readable milestone label (e.g. "30% down-payment")
              amount:
                type: number
                description: IDR amount due at this milestone
              currency:
                type: string
                const: IDR
                default: IDR
              dueAt:
                type: string
                format: date-time
                description: Absolute datetime when payment is due
              status:
                type: string
                enum:
                  - PENDING
                  - PAID
                  - OVERDUE
                  - WAIVED
                  - FAILED
              paidAt:
                type: string
                format: date-time
              paymentMethod:
                type: string
                description: Method used for this specific milestone (may differ across milestones)
              gatewayRef:
                type: string
                description: Gateway transaction reference for this milestone
              graceDays:
                type: integer
                minimum: 0
                description: Grace period before status becomes OVERDUE
            required:
            - milestone
            - amount
            - dueAt
            - status
          x-ion-condition: Required when policies.paymentTerms.policyRef is schedule-based
        cancellationReason:
          type: object
          additionalProperties: false
          description: >
            Structured cancellation reason. Carries both a machine-readable
            descriptor code (for policy enforcement) and a localised human-readable
            explanation (for consumer-facing messaging). Set by the requesting party
            (BAP for buyer-initiated, BPP for seller-initiated) at time of cancel.
          properties:
            id:
              type: string
              description: Unique reason identifier. Matches an entry in offer.offerAttributes.policies.cancellation.allowedReasons.
            descriptor:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  description: Machine-readable reason code. Must be in offer.offerAttributes.policies.cancellation.allowedReasons.
                  example: BUYER_REQUESTED
                shortDesc:
                  type: string
                  description: Localised short reason for consumer display.
                  example: Changed my mind
          x-ion-condition: Required on /cancel request and on_cancel callback

        cancellationTags:
          type: object
          additionalProperties: true
          description: >
            Structured metadata bag for the cancellation event. Used in
            force-cancel (TAT breach) scenarios to carry timestamp evidence
            and override flags. Fields within are open — BAP declares what
            is relevant for the cancellation sub-branch.
          properties:
            force:
              type: boolean
              description: >
                True when BAP is force-cancelling due to BPP TAT breach.
                Overrides normal cancellation window constraints.
            lastBppInteractionAt:
              type: string
              format: date-time
              description: Timestamp of last received BPP message — documents the TAT breach.
            expectedStatusBy:
              type: string
              format: date-time
              description: Datetime by which BPP was expected to send on_status per declared SLA.
          x-ion-condition: Required when force-cancelling after BPP TAT breach

        cancelledCommitmentIds:
          type: array
          description: >
            Line IDs from commitments[] that have been individually cancelled in a
            partial-cancellation flow. Only populated when partialCancellationAllowed=true
            and the buyer is cancelling specific lines rather than the full order.
          items:
            type: string
            description: lineId from the cancelled commitment
          x-ion-condition: Required on partial-cancellation /cancel request

        subscriptionAction:
          type: string
          enum:
            - PAUSE
            - RESUME
            - SKIP_NEXT
            - MODIFY
            - CANCEL
          description: >
            Action being applied to a subscription in a lifecycle management
            /update call. Tells BPP which subscription lifecycle operation the
            BAP is requesting. Combined with subscriptionPauseType and
            subscriptionPauseUntil for pause operations.
          x-ion-condition: Required on /update calls for subscription lifecycle management

        dunningReminderSequence:
          type: integer
          minimum: 1
          description: >
            Sequence number of this dunning (payment reminder) attempt for overdue
            credit orders. 1 = first reminder, 2 = second, and so on. BPP increments
            this field on each /update push to BAP when creditTermsDays has elapsed
            without payment. Used by BAP to escalate consumer communication tone.
          x-ion-condition: Required on /update when creditTermsDays > 0 and payment is overdue

        legalEntityName:
          type: string
          description: >
            Registered legal entity name of the buyer organisation. Declared by
            BAP at init for B2B wholesale and business-procurement patterns. Used
            for invoice printing and regulatory compliance. Matches the entity
            registered against the declared NPWP.
          example: PT Maju Bersama Indonesia
          x-ion-condition: Required for B2B wholesale and business-procurement patterns

        nib:
          type: string
          description: >
            Nomor Induk Berusaha (Business Registration Number) of the buyer
            organisation. Declared by BAP at confirm for B2B patterns. Allows
            seller to verify buyer is a registered Indonesian business entity
            before extending credit or issuing Faktur Pajak.
          pattern: "^[0-9]{13}$"
          example: "1234567890123"
          x-ion-regulatory: PP 24/2018 tentang Pelayanan Perizinan Berusaha OSS
          x-ion-condition: Required for B2B wholesale and business-procurement patterns at confirm

        npwp:
          type: string
          description: >
            NPWP (Nomor Pokok Wajib Pajak) of the buyer. Declared by BAP at
            confirm for patterns that generate a tax invoice. Required when
            invoicePreferences.invoiceType=TAX_INVOICE. 15-digit or 16-digit
            format depending on registration type.
          pattern: "^[0-9]{15,16}$"
          example: "123456789012345"
          x-ion-regulatory: UU 36/2008 tentang PPh; PMK 168/PMK.010/2023
          x-ion-condition: Required when invoiceType=TAX_INVOICE or buyer is a PKP entity

      x-ion-closed-extensions: false
