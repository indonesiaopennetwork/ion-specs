openapi: 3.1.1
info:
  title: ION Trade Resource Extension (v1)
  description: |
    Trade sector resource attributes for ION Network. TradeResource is the generic base
    (inherits RetailResource from schema.beckn.io). IONTradeResource is the concrete
    Indonesia-specific schema that BPPs and BAPs on ION MUST use.

    Availability model: stock count is NEVER transmitted — only availability signal.

    BREAKING CHANGES from v0 (pre-harmonisation):
    - quantity removed — belongs in trade/commitment/v1
    - physical.weightKg replaced by physical.weight ($ref Quantity) — hard switch
    - physical.dimensions.{lengthCm,widthCm,heightCm} replaced by {unit,length,breadth,height}
    - physical.colour renamed to physical.color (open string, no hex constraint)
    - Indonesia-specific fields (dataResidency, regionOfOrigin, geographicIndicationCert,
      packaged.hsnCode, regulatory.registrations[].scheme enum, agritech.mandiReferencePrice,
      digital.digitalCategory enum) moved to IONTradeResource

    NOTE: RetailResource (schema.beckn.io) uses additionalProperties:false on nested objects.
    Until local-retail migrates to unevaluatedProperties:false, strict JSON Schema 2020-12
    validators may surface false positives on TradeResource extension fields. The allOf
    reference is semantically authoritative for schema lineage. Companion issue to be filed
    on local-retail repo.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    LocalisedText:
      type: object
      description: Language-keyed text. "id" always required. "en" required for cross-border pattern.
      minProperties: 1
      additionalProperties:
        type: string
      properties:
        id:
          type: string
        en:
          type: string
      example:
        id: Nasi Goreng Spesial
        en: Special Fried Rice
      required:
      - id

    TradeResource:
      type: object
      title: TradeResource
      description: |
        Generic trade resource extension. Inherits RetailResource from schema.beckn.io.
        Network-specific deployments SHOULD extend this rather than using it directly.
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/trade/resource/v1/context.jsonld'
        '@type': ion:TradeResource
      x-beckn-attaches-to: Resource.resourceAttributes
      properties:
        resourceStructure:
          type: string
          enum:
            - PLAIN
            - VARIANT
            - WITH_EXTRAS
            - COMPOSED
            - BUNDLE
          description: |
            PLAIN: single SKU, no choices. VARIANT: one of several pre-defined options of a parent.
            WITH_EXTRAS: base item with optional add-ons. COMPOSED: base with mandatory and optional
            customisation groups. BUNDLE: composite of multiple component resources (see bundleComposition).
          example: COMPOSED
        resourceTangibility:
          type: string
          enum:
            - PHYSICAL
            - DIGITAL_VOUCHER
            - DIGITAL_TOP_UP
            - DIGITAL_SUBSCRIPTION
          description: |
            PHYSICAL: tangible goods requiring logistics fulfilment. DIGITAL_VOUCHER: voucher code,
            gift card, in-game currency (delivered electronically). DIGITAL_TOP_UP: mobile top-up,
            data package, utility bill top-up. DIGITAL_SUBSCRIPTION: time-bound digital subscription.
          example: PHYSICAL
        parentResourceId:
          type: string
          description: ID of parent resource. Present on VARIANT and WITH_EXTRAS.
          example: PIZZA-MARGHERITA
          x-ion-condition: Required when resourceStructure IN [VARIANT, WITH_EXTRAS]
        isDefaultVariant:
          type: boolean
          description: Whether this is the default variant shown to consumer.
          example: true
        variantGroup:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - variantOn
          properties:
            id:
              type: string
              example: VG-SIZE
            name:
              $ref: '#/components/schemas/LocalisedText'
            variantOn:
              type: string
              description: The attribute that varies. e.g. size, colour, storage
              example: size
        variantMatrix:
          type: object
          additionalProperties: false
          description: |
            Multi-axis variant declaration. Use instead of explicit VARIANT resources when combinations
            are derivable. BPP MUST resolve the specific variant at on_select and compute final price
            via priceDeltaByCombination or per-axis priceDelta. Only valid on parent resources with
            resourceStructure=PLAIN; child VARIANT resources are not needed when this is declared.
          required:
          - axes
          - combinationRules
          properties:
            axes:
              type: array
              minItems: 1
              maxItems: 6
              items:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: Axis identifier (size, color, storage, model, etc.)
                  label:
                    $ref: '#/components/schemas/LocalisedText'
                  values:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                        label:
                          $ref: '#/components/schemas/LocalisedText'
                        priceDelta:
                          type: number
                          description: Price delta for this axis value (signed, in settlement currency)
                        available:
                          type: boolean
                          default: true
                          description: Whether this specific axis value is currently sellable
                        resourceIdOverride:
                          type: string
                          description: Optional mapping to an explicit VARIANT resource ID if this combination has its own SKU
                      required:
                      - id
                required:
                - id
                - values
            combinationRules:
              type: object
              additionalProperties: false
              properties:
                generateAllCombinations:
                  type: boolean
                  description: If true, all permutations are valid. If false, combinations must be listed explicitly.
                explicitCombinations:
                  type: array
                  description: Required when generateAllCombinations=false. Each entry names axis-value pairs and the resulting final price.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      axisValues:
                        type: object
                        description: Map of axisId to valueId
                        additionalProperties:
                          type: string
                      priceValue:
                        type: number
                        description: Absolute price for this combination (in settlement currency)
                      available:
                        type: boolean
                        default: true
                    required:
                    - axisValues
                    - priceValue
                priceCalculationMode:
                  type: string
                  enum:
                    - SUM_AXIS_DELTAS
                    - EXPLICIT_PRICE
                  description: |
                    SUM_AXIS_DELTAS — final price = base offer price + sum of axis priceDeltas.
                    EXPLICIT_PRICE — final price = priceValue from matching explicitCombinations entry.
                  default: SUM_AXIS_DELTAS
              required:
              - generateAllCombinations
        customisationGroups:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                example: CG-SIZE
              name:
                $ref: '#/components/schemas/LocalisedText'
              selectionType:
                type: string
                enum:
                  - SINGLE_REQUIRED
                  - SINGLE_OPTIONAL
                  - MULTIPLE_OPTIONAL
                  - FIXED
              minSelections:
                type: integer
                minimum: 0
              maxSelections:
                type: integer
                minimum: 1
              sequence:
                type: integer
              inputType:
                type: string
                enum:
                  - select
                  - text
                  - number
                  - date
                  - boolean
                default: select
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                    label:
                      $ref: '#/components/schemas/LocalisedText'
                    resourceId:
                      type: string
                    priceDelta:
                      type: object
                      additionalProperties: false
                      required:
                      - type
                      - value
                      properties:
                        type:
                          type: string
                          enum:
                            - FIXED
                            - PERCENT
                        value:
                          type: number
                    available:
                      type: boolean
                      default: true
                  required:
                  - id
                  - label
            required:
            - id
            - name
            - selectionType
            - options
          x-ion-condition: Required when resourceStructure IN [COMPOSED, WITH_EXTRAS]
        menuCategory:
          type: object
          additionalProperties: false
          required:
          - id
          - name
          properties:
            id:
              type: string
            name:
              $ref: '#/components/schemas/LocalisedText'
            sequence:
              type: integer
            imageUrl:
              type: string
              format: uri
          x-ion-condition: Required for food and beverage providers
        preparationTime:
          type: string
          description: ISO 8601 duration. Time from order confirm to item ready.
          example: PT20M
          x-ion-condition: Required for food, beverage and made-to-order items
        productCode:
          type: object
          additionalProperties: false
          required:
          - type
          - value
          properties:
            type:
              type: string
              enum:
                - GTIN
                - EAN
                - UPC
                - ISBN
                - ASIN
                - HSN
                - ION_SKU
            value:
              type: string
          example:
            type: GTIN
            value: '8999999123456'
          x-ion-condition: Required for FMCG, electronics, cross-border products
        images:
          type: array
          items:
            type: string
            format: uri
          description: First image is primary thumbnail. Additional images for gallery.
        itemRating:
          type: number
          minimum: 1
          maximum: 5
          description: Aggregate seller-maintained rating 1-5. Base items only.
          example: 4.3
        logisticsServiceType:
          type: string
          enum:
            - DOMESTIC_SURFACE
            - DOMESTIC_AIR
            - HYPERLOCAL
            - INTERNATIONAL_AIR
            - INTERNATIONAL_OCEAN
          description: Logistics service type. Determines flow and performance states.
          example: HYPERLOCAL
        availability:
          type: object
          additionalProperties: false
          required:
          - status
          properties:
            status:
              type: string
              enum:
                - IN_STOCK
                - LOW_STOCK
                - OUT_OF_STOCK
                - PREORDER
                - DISCONTINUED
              description: |
                IN_STOCK: adequate quantity available. LOW_STOCK: limited — BAP may show urgency signal.
                OUT_OF_STOCK: not available, no backorder. PREORDER: can be pre-ordered before availability
                date. DISCONTINUED: permanently removed.
            nextAvailableAt:
              type: string
              format: date-time
              description: When available again. For PREORDER and OUT_OF_STOCK.
            maxOrderQty:
              type: integer
              minimum: 1
              description: Per-order cap. Not actual stock count.
            backorderAllowed:
              type: boolean
              default: false
            preorderAllowed:
              type: boolean
              default: false
            substitutionAllowed:
              type: boolean
              description: Seller may substitute with equivalent if this item unavailable.
              default: false
        identity:
          type: object
          additionalProperties: true
          properties:
            brand:
              type: string
              example: Samsung
            model:
              type: string
              example: Galaxy S24
            modelYear:
              type: integer
              example: 2024
            sku:
              type: string
              description: Seller internal SKU
              example: SAM-S24-BLK-256
        physical:
          type: object
          additionalProperties: true
          properties:
            color:
              type: string
              description: Product color as a human-readable name or hex code.
              example: Coral Red
            colorName:
              type: string
              description: Localised display name for the color.
              example: Merah Koral
            dimensions:
              type: object
              additionalProperties: false
              properties:
                unit:
                  type: string
                  enum:
                    - MM
                    - CM
                    - M
                    - IN
                    - FT
                  default: CM
                length:
                  type: number
                  minimum: 0
                breadth:
                  type: number
                  minimum: 0
                height:
                  type: number
                  minimum: 0
            weight:
              description: Shipping weight of the item.
              allOf:
                - $ref: 'https://schema.beckn.io/Quantity/2.0#/components/schemas/Quantity'
        packaged:
          type: object
          additionalProperties: true
          properties:
            netQuantity:
              type: object
              additionalProperties: false
              required:
              - value
              - unit
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum:
                    - GRAM
                    - KILOGRAM
                    - MILLILITRE
                    - LITRE
                    - PIECE
                    - DOZEN
                    - METER
                    - CENTIMETER
              example:
                value: 85
                unit: GRAM
            manufacturerOrPacker:
              type: object
              additionalProperties: false
              required:
              - type
              - name
              - address
              properties:
                type:
                  type: string
                  enum:
                    - MANUFACTURER
                    - PACKER
                    - IMPORTER
                name:
                  type: string
                address:
                  type: string
            manufacturePackingImportDate:
              type: object
              additionalProperties: false
              properties:
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                year:
                  type: integer
                  minimum: 2000
            monthYearOfManufacture:
              type: string
              pattern: ^[0-9]{2}/[0-9]{4}$
              example: 04/2026
            expiryDate:
              type: string
              format: date
              description: Required for food, beverage, pharma, cosmetics
              example: 2027-04-19
            commonOrGenericName:
              type: string
          x-ion-condition: Required for packaged goods
        regulatory:
          type: object
          additionalProperties: true
          properties:
            registrations:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - scheme
                - id
                properties:
                  scheme:
                    type: string
                    description: Certification or regulatory scheme identifier. Network deployments constrain the enum.
                  id:
                    type: string
                  role:
                    type: string
                    enum:
                      - BRAND_OWNER
                      - MANUFACTURER
                      - IMPORTER
                      - PACKER
                  url:
                    type: string
                    format: uri
                  validUntil:
                    type: string
                    format: date
            foodRegulatoryDeclaration:
              type: object
              additionalProperties: true
              properties:
                nutritionalInfo:
                  type: string
                additivesInfo:
                  type: string
                ingredientsInfo:
                  type: string
            nutrition:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - nutrient
                - value
                properties:
                  nutrient:
                    type: string
                    example: Protein
                  value:
                    type: object
                    additionalProperties: false
                    required:
                    - unitCode
                    - unitQuantity
                    properties:
                      unitCode:
                        type: string
                        enum:
                          - G
                          - MG
                          - MCG
                          - KCAL
                          - KJ
                          - IU
                          - PERCENT
                      unitQuantity:
                        type: number
            additives:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum:
                      - CONTAINS
                      - FREE_FROM
                  value:
                    type: string
            credentials:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - type
                - uri
                properties:
                  type:
                    type: string
                  uri:
                    type: string
                    format: uri
                  issuer:
                    type: string
                  validUntil:
                    type: string
                    format: date
            backImage:
              type: string
              format: uri
              description: Back-of-pack statutory requirements image
        food:
          type: object
          description: |
            Packaged food product attributes for filtering and regulatory compliance.
            USE THIS for: FMCG packaged food, grocery products, bottled beverages,
            packaged meal kits, snacks, confectionery sold from warehouse stock.
            DO NOT USE for restaurant or cloud kitchen menu items — those use
            RestaurantMenuItem in the Hospitality sector (hospitality/delivery/v1).
          additionalProperties: false
          properties:
            classification:
              type: string
              enum:
                - VEG
                - NON_VEG
                - HALAL
                - EGG
              example: HALAL
            allergens:
              type: array
              items:
                type: string
                enum:
                  - GLUTEN
                  - NUTS
                  - DAIRY
                  - EGGS
                  - SOY
                  - SHELLFISH
                  - FISH
                  - SESAME
                  - SULPHITES
                  - CELERY
                  - MUSTARD
                  - LUPIN
            cuisineType:
              type: string
              example: Padang
            spiceLevel:
              type: string
              enum:
                - NONE
                - LOW
                - MEDIUM
                - HIGH
                - EXTRA_HOT
            freshProduce:
              type: object
              additionalProperties: false
              properties:
                netQuantityDeclaration:
                  type: string
                  example: 1 kg
                harvestDate:
                  type: string
                  format: date
          x-ion-condition: Required for food and beverage resources
        preparation:
          type: object
          additionalProperties: false
          properties:
            instructions:
              type: string
            storage:
              type: string
            shelfLife:
              type: string
              description: ISO 8601 duration
              example: PT2H
          x-ion-condition: Required for food, beverage and perishable products
        fashion:
          type: object
          additionalProperties: false
          properties:
            gender:
              type: string
              enum:
                - MALE
                - FEMALE
                - UNISEX
                - BOYS
                - GIRLS
            size:
              type: string
              example: L
            sizeChart:
              type: string
              format: uri
            fabric:
              type: string
            fabricComposition:
              type: string
            fitType:
              type: string
              enum:
                - SLIM
                - REGULAR
                - OVERSIZED
                - RELAXED
                - ATHLETIC
            sleeveType:
              type: string
              enum:
                - SLEEVELESS
                - SHORT
                - THREE_QUARTER
                - FULL
                - NONE
            collarType:
              type: string
              enum:
                - ROUND
                - V_NECK
                - POLO
                - SPREAD
                - MANDARIN
                - HOODIE
                - NONE
            occasion:
              type: string
              enum:
                - CASUAL
                - FORMAL
                - ETHNIC
                - SPORTS
                - PARTY
                - BEACH
                - WORKWEAR
            pattern:
              type: string
              enum:
                - SOLID
                - PRINTED
                - STRIPED
                - CHECKED
                - EMBROIDERED
                - TIE_DYE
                - BATIK
            careInstructions:
              type: string
          x-ion-condition: Required for fashion and apparel products
        electronics:
          type: object
          description: Consumer electronics technical specifications for filtering and comparison.
          additionalProperties: false
          properties:
            ram:
              type: integer
            ramUnit:
              type: string
              enum:
                - MB
                - GB
              default: GB
            rom:
              type: integer
            romUnit:
              type: string
              enum:
                - MB
                - GB
                - TB
              default: GB
            storage:
              type: integer
            storageUnit:
              type: string
              enum:
                - MB
                - GB
                - TB
              default: GB
            storageCapacity:
              type: integer
              description: Appliance capacity. Fridge=litres, Washer=kg load
            storageCapacityUnit:
              type: string
              enum:
                - LITRE
                - KG
                - CUBIC_FEET
            screenSize:
              type: number
              description: Screen size in inches
              example: 6.1
            primaryCamera:
              type: integer
              description: Megapixels
            secondaryCamera:
              type: integer
            cpu:
              type: string
              example: A15 Bionic
            gpu:
              type: string
            batteryCapacity:
              type: integer
              description: mAh
            osType:
              type: string
              enum:
                - IOS
                - ANDROID
                - WINDOWS
                - MACOS
                - LINUX
                - TIZEN
                - WEBOS
                - OTHER
            osVersion:
              type: string
              example: Android 14
            connectivity:
              type: array
              items:
                type: string
                enum:
                  - WIFI
                  - BLUETOOTH
                  - NFC
                  - USB_C
                  - USB_A
                  - HDMI
                  - ETHERNET
                  - LIGHTNING
                  - MMWAVE_5G
                  - SUB6_5G
                  - 4G_LTE
                  - 3G
                  - IR_BLASTER
            wattage:
              type: integer
              description: Power consumption watts
            voltage:
              type: string
              example: 220V
            energyRating:
              type: integer
              minimum: 1
              maximum: 5
              description: Energy efficiency star rating per applicable national standard
          x-ion-condition: Required for electronics and appliance products
        beauty:
          type: object
          description: Beauty and personal care product attributes for filtering and regulatory compliance.
          additionalProperties: false
          properties:
            conscious:
              type: string
              enum:
                - NATURAL
                - ORGANIC
                - VEGAN
                - CRUELTY_FREE
                - HALAL_COSMETICS
            preference:
              type: string
              enum:
                - HERBAL
                - AYURVEDIC
                - CHEMICAL_FREE
                - FRAGRANCE_FREE
                - ALCOHOL_FREE
            formulation:
              type: string
              enum:
                - LIQUID
                - CREAM
                - GEL
                - POWDER
                - SERUM
                - BALM
                - SPRAY
                - FOAM
                - STICK
                - SHEET
            skinType:
              type: string
              enum:
                - ALL
                - NORMAL
                - OILY
                - DRY
                - COMBINATION
                - SENSITIVE
            hairType:
              type: string
              enum:
                - ALL
                - NORMAL
                - OILY
                - DRY
                - DAMAGED
                - CURLY
                - STRAIGHT
            spf:
              type: integer
              minimum: 0
              example: 50
            gender:
              type: string
              enum:
                - MALE
                - FEMALE
                - UNISEX
            volume:
              type: object
              additionalProperties: false
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum:
                    - ML
                    - G
                    - OZ
          x-ion-condition: Required for beauty and personal care products
        agritech:
          type: object
          additionalProperties: true
          properties:
            harvestDate:
              type: string
              format: date
            produceGrade:
              type: string
              enum:
                - PREMIUM
                - GRADE_A
                - GRADE_B
                - GRADE_C
            pesticideDeclaration:
              type: string
              enum:
                - PESTICIDE_FREE
                - LOW_PESTICIDE
                - STANDARD
                - ORGANIC_CERTIFIED
            organicCertification:
              type: object
              additionalProperties: false
              properties:
                certBody:
                  type: string
                certNumber:
                  type: string
            unitOfMeasure:
              type: object
              additionalProperties: false
              required:
              - unit
              - value
              properties:
                unit:
                  type: string
                  enum:
                    - GRAM
                    - KILOGRAM
                    - LITRE
                    - MILLILITRE
                    - PIECE
                    - DOZEN
                    - BUNCH
                    - IKAT
                value:
                  type: number
          x-ion-condition: Required for agritech and fresh produce
        pharmacy:
          type: object
          additionalProperties: false
          properties:
            prescriptionRequired:
              type: boolean
            dosageForm:
              type: string
              enum:
                - TABLET
                - CAPSULE
                - SYRUP
                - INJECTION
                - OINTMENT
                - DROPS
                - INHALER
                - SUPPOSITORY
                - PATCH
            strength:
              type: string
              example: 500 mg
            activeIngredients:
              type: array
              items:
                type: string
            coldChainRequired:
              type: boolean
          x-ion-condition: Required for pharmaceutical and OTC medicine
        installation:
          type: object
          additionalProperties: false
          properties:
            providedBySeller:
              type: boolean
            notes:
              type: string
          x-ion-condition: Required for appliances and furniture needing installation
        usage:
          type: object
          additionalProperties: false
          properties:
            indoorOnly:
              type: boolean
            compatibleWith:
              type: array
              items:
                type: string
        warranty:
          type: object
          additionalProperties: false
          properties:
            duration:
              type: string
              description: ISO 8601 duration. Minimum P1Y for electronics.
              example: P2Y
            type:
              type: string
              enum:
                - MANUFACTURER
                - SELLER
                - EXTENDED
                - NONE
            terms:
              type: string
            serviceCenter:
              type: string
          x-ion-condition: Required for electronics, appliances, consumer durables
        ageRestricted:
          type: boolean
          description: Whether product requires age verification at purchase
          default: false
        minAge:
          type: integer
          minimum: 0
          maximum: 21
          description: Minimum purchaser age when ageRestricted is true
          example: 18
          x-ion-condition: Required when ageRestricted is true
        countryOfOrigin:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 3166-1 alpha-3 country code
          example: IDN
        canonicalId:
          type: string
          description: |
            Cross-provider product identity. Multiple providers selling the same product share
            the same canonicalId. Enables Buy Box selection on BAP side and cross-seller price
            comparison. GTIN preferred when available; otherwise network-assigned canonical ID.
          example: ION-CAN-ABC123XYZ
          x-ion-condition: Required for marketplace-eligible products
        featuredOfferEligible:
          type: boolean
          description: |
            Whether this offer is eligible for featured offer / Buy Box selection. BPP declares
            eligibility; BAP runs selection algorithm.
          default: false
        featuredOfferScore:
          type: number
          minimum: 0
          maximum: 1
          description: BPP-computed score for BAP Buy Box algorithm. Decimal 0-1.
        imageSet:
          type: array
          description: |
            Structured images with role metadata. More expressive than the flat images[] array.
            When imageSet is present, images[] may still exist for backward compatibility but
            imageSet is authoritative.
          items:
            type: object
            additionalProperties: false
            required:
            - url
            - role
            properties:
              url:
                type: string
                format: uri
              role:
                type: string
                enum:
                  - PRIMARY
                  - GALLERY
                  - SIZE_CHART
                  - SPEC_SHEET
                  - LIFESTYLE
                  - UNBOXING
                  - SIZE_FIT
                  - USE_IN_CONTEXT
                  - PACKAGING
                  - BACK_OF_PACK
                  - INGREDIENTS_LABEL
                  - NUTRITION_FACTS
              altText:
                $ref: '#/components/schemas/LocalisedText'
              sequence:
                type: integer
              widthPx:
                type: integer
              heightPx:
                type: integer
        videos:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - url
            - role
            properties:
              url:
                type: string
                format: uri
              role:
                type: string
                enum:
                  - PRIMARY
                  - UNBOXING
                  - USE_IN_CONTEXT
                  - SIZE_FIT
                  - INSTALLATION_GUIDE
                  - 360_VIEW
                  - LIVE_REPLAY
              durationSeconds:
                type: integer
              thumbnailUrl:
                type: string
                format: uri
        bundleComposition:
          type: array
          description: |
            Components of a bundle SKU. Required for bundle offers where individual components
            carry their own regulatory registrations or warranties.
          items:
            type: object
            additionalProperties: true
            required:
            - componentResourceId
            - quantity
            properties:
              componentResourceId:
                type: string
                description: Resource ID of the component product
              quantity:
                type: integer
                minimum: 1
              individualWarrantyDuration:
                type: string
                description: ISO 8601 duration — per-component warranty if different from bundle
              componentPrice:
                type: number
                description: Unbundled price of component (in settlement currency) for break-up display
          x-ion-condition: Required when offer.offerType=BUNDLE
        brandIdentity:
          type: object
          additionalProperties: false
          description: |
            Structured brand identity. Replaces string-only identity.brand for Official Store /
            Brand Registry programmes.
          properties:
            name:
              type: string
              example: Samsung
            brandOwnerLegalEntity:
              type: string
            brandCertificationId:
              type: string
              description: Brand certification reference
            officialStoreStatus:
              type: boolean
              description: Whether this seller is the officially authorised brand store. Validated against brand owner whitelist.
            authorisedResellerOf:
              type: array
              items:
                type: string
              description: Brand names this seller is an authorised reseller for
        digital:
          type: object
          additionalProperties: true
          description: |
            Digital goods attributes. Required for DIGITAL_VOUCHER, DIGITAL_TOP_UP, and
            DIGITAL_SUBSCRIPTION resource types.
          properties:
            digitalCategory:
              type: string
              description: Type of digital good. Network deployments constrain this to their catalogue enum.
            operatorOrIssuer:
              type: string
              description: Issuing operator or brand for the digital good.
            denomination:
              type: object
              additionalProperties: true
              description: Voucher/top-up denomination
              required:
              - value
              - unit
              properties:
                value:
                  type: number
                unit:
                  type: string
                  description: Unit for the denomination value (e.g. MB, GB, MINUTES, or in-game currency unit).
            deliveryMethod:
              type: string
              enum:
                - PUSH_TO_TARGET
                - CODE_TO_BUYER
                - ACCOUNT_CREDIT
                - QR_VOUCHER
              description: |
                PUSH_TO_TARGET: delivered directly to consumer account. CODE_TO_BUYER: redemption
                code sent to buyer to redeem later. ACCOUNT_CREDIT: credited to buyer's wallet/account.
                QR_VOUCHER: scannable QR redeemable at merchant.
            target:
              type: object
              additionalProperties: false
              description: Target identifier for delivery
              properties:
                type:
                  type: string
                  enum:
                    - MOBILE_NUMBER
                    - CUSTOMER_ID
                    - ACCOUNT_ID
                    - EMAIL
                    - METER_NUMBER
                    - GAME_USER_ID
                value:
                  type: string
                operatorValidationRequired:
                  type: boolean
                  description: Whether BPP must verify target exists before accepting
            redemptionCode:
              type: string
              description: Redemption code or voucher code. Must be encrypted in transit.
            redemptionUrl:
              type: string
              format: uri
              description: URL for redemption
            expiryAfterPurchase:
              type: string
              description: ISO 8601 duration — how long the voucher is valid from purchase
              example: P30D
            refundable:
              type: boolean
              default: false
              description: Whether the digital good is refundable.
            cancellable:
              type: boolean
              default: false
              description: Whether cancellation is possible before delivery
          x-ion-condition: Required when resourceTangibility IN [DIGITAL_VOUCHER, DIGITAL_TOP_UP, DIGITAL_SUBSCRIPTION]
      allOf:
      - $ref: 'https://schema.beckn.io/RetailResource/v2.1/attributes.yaml#/components/schemas/RetailResource'
      - if:
          properties:
            resourceStructure:
              enum:
                - VARIANT
          required:
          - resourceStructure
        then:
          required:
          - parentResourceId
          - isDefaultVariant
          - variantGroup
      - if:
          properties:
            resourceStructure:
              enum:
                - COMPOSED
                - WITH_EXTRAS
          required:
          - resourceStructure
        then:
          required:
          - customisationGroups
      - if:
          properties:
            ageRestricted:
              const: true
          required:
          - ageRestricted
        then:
          required:
          - minAge
      required:
      - resourceStructure
      - resourceTangibility
      - images
      - logisticsServiceType
      - availability
      - ageRestricted
      - countryOfOrigin

    IONTradeResource:
      type: object
      title: IONTradeResource
      description: |
        ION Network (Indonesia) trade resource extension. Extends TradeResource with
        Indonesia-specific regulatory, geographic indication, and digital goods fields.
        This is the schema that BPPs and BAPs on ION MUST use for resourceAttributes.
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/trade/resource/v1/context.jsonld'
        '@type': ion:IONTradeResource
      x-beckn-attaches-to: Resource.resourceAttributes
      allOf:
      - $ref: '#/components/schemas/TradeResource'
      - type: object
        x-ion-indonesia-specific: true
        properties:
          dataResidency:
            type: string
            enum:
              - DOMESTIC_ONLY
              - INTERNATIONAL_ALLOWED
            description: |
              Data residency requirement. DOMESTIC_ONLY means all PII and transaction data must
              be processed and stored within Indonesia; BAPs with foreign data processing must
              skip or refuse transactions for this resource.
            example: DOMESTIC_ONLY
            x-ion-regulatory: UU 27/2022 tentang Pelindungan Data Pribadi (PDP Law)
            x-ion-condition: Required for pharmacy, health-data, financial-services categories
          regionOfOrigin:
            type: string
            pattern: ^[A-Z]{3}-[A-Z0-9]{1,3}$
            description: |
              ISO 3166-2 sub-national region code for geographic indication. Required when product
              claims origin-protected status (e.g. Kopi Gayo from Aceh IDN-AC, Beras Cianjur IDN-JB).
            example: IDN-AC
            x-ion-regulatory: UU 20/2016 tentang Merek dan Indikasi Geografis
            x-ion-condition: Required when product claims Geographic Indication status
          geographicIndicationCert:
            type: string
            description: Geographic Indication certificate number from DJKI (Direktorat Jenderal Kekayaan Intelektual).
            x-ion-regulatory: UU 20/2016 tentang Merek dan Indikasi Geografis
            x-ion-condition: Required when regionOfOrigin is declared for GI products
          packaged:
            type: object
            properties:
              hsnCode:
                type: string
                description: Harmonized System Nomenclature code. Required for cross-border customs.
                example: '1902.30'
                x-ion-regulatory: Bea Cukai UU 17/2006 tentang Kepabeanan; Faktur Pajak PMK 168/2023
          regulatory:
            type: object
            properties:
              registrations:
                type: array
                items:
                  type: object
                  properties:
                    scheme:
                      type: string
                      enum:
                        - BPOM_MD
                        - BPOM_ML
                        - BPOM_TR
                        - MUI_HALAL
                        - SNI
                        - SP_PIRT
                        - KEMENKES
                        - SIUP
              foodRegulatoryDeclaration:
                type: object
                properties:
                  brandOwnerBpomLicenseNo:
                    type: string
                    description: Brand owner BPOM license number
                    x-ion-regulatory: PerBPOM 31/2018 tentang Label Pangan Olahan
                  importerBpomLicenseNo:
                    type: string
                    description: Importer BPOM license number
                  mfgLicenseNo:
                    type: string
                    description: Manufacturing facility license number
          agritech:
            type: object
            properties:
              mandiReferencePrice:
                type: number
                description: Government mandi reference price IDR/kg.
                x-ion-regulatory: Permendag 7/2020 tentang Harga Acuan Pembelian
          digital:
            type: object
            properties:
              digitalCategory:
                type: string
                enum:
                  - MOBILE_PULSA
                  - MOBILE_DATA_PACKAGE
                  - ELECTRICITY_TOKEN
                  - WATER_BILL
                  - INTERNET_BILL
                  - PDAM_BILL
                  - PBB_TAX
                  - BPJS_PAYMENT
                  - GIFT_CARD
                  - GAME_VOUCHER
                  - STREAMING_VOUCHER
                  - FOOD_VOUCHER
                  - EWALLET_TOP_UP
                  - TRANSPORT_VOUCHER
                  - EDUCATION_VOUCHER
                  - OTHER
                description: |
                  Type of digital good on ION. MOBILE_PULSA/DATA covered by Indonesian operator
                  regulations (Kominfo). PDAM_BILL for local water utility; BPJS_PAYMENT for social
                  security (BPJS Kesehatan/Ketenagakerjaan); PBB_TAX for property tax.
                  GAME_VOUCHER includes Mobile Legends, Free Fire, Valorant, Genshin Impact currencies.
              operatorOrIssuer:
                type: string
                description: |
                  Issuing operator or brand. For MOBILE_PULSA: TELKOMSEL, XL, INDOSAT, TRI, SMARTFREN.
                  For ELECTRICITY_TOKEN: PLN. For GAME_VOUCHER: Moonton, Garena, Riot, miHoYo, etc.
                example: TELKOMSEL
              denomination:
                type: object
                properties:
                  currency:
                    type: string
                    default: IDR
                  unit:
                    type: string
                    enum:
                      - IDR
                      - MB
                      - GB
                      - MINUTES
                      - DIAMONDS
                      - COINS
                      - OTHER
                    description: IDR for money-based (pulsa, bills, taxes); MB/GB for data; DIAMONDS/COINS for in-game
          bundleComposition:
            type: array
            items:
              type: object
              properties:
                individualBpomReg:
                  type: string
                  description: Component's own BPOM registration if distinct from bundle.
                  x-ion-regulatory: PerBPOM 27/2013 tentang Pengawasan Pemasukan Obat dan Makanan
                individualPostelReg:
                  type: string
                  description: Component's own POSTEL/Kominfo telecom certification if distinct.
      required:
      - resourceStructure
      - resourceTangibility
      - images
      - logisticsServiceType
      - availability
      - ageRestricted
      - countryOfOrigin
