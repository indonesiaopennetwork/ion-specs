openapi: 3.1.1
info:
  title: ION Trade Resource Extension (v1)
  description: >
    Trade sector resource attributes for the Indonesia Open Network.
    Properties are split across three layers following the Beckn schema inheritance model:

    1. RetailResource (schema.beckn.io) — inherited via allOf, not defined here.
       Covers: resourceStructure, resourceTangibility, variantGroup, variantMatrix,
       customisationGroups, productCode, images, imageSet, videos, itemRating,
       logisticsServiceType, availability, identity, physical, packaged
       (packagedGoodsDeclaration), ageRestricted, minAge, countryOfOrigin,
       canonicalId, featuredOfferEligible, featuredOfferScore, bundleComposition,
       brandIdentity, parentResourceId, isDefaultVariant.

    2. TradeResource (this file, generic layer) — fields useful for retail across
       any geography, not yet in RetailResource: name, shortDesc, menuCategory,
       preparationTime, food, preparation, fashion, electronics, beauty, agritech,
       pharmacy, installation, usage, warranty.

    3. IONTradeResource (this file, ION layer) — Indonesia-specific fields:
       crc, regulatory, regionOfOrigin, geographicIndicationCert, digital, dataResidency.

    Availability model: stock count is NEVER transmitted. Only availability signal.
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id

components:
  schemas:

    LocalisedText:
      type: object
      title: LocalisedText
      description: >
        Language-keyed text object for multilingual content. The 'id' key carries
        Bahasa Indonesia text and is always required. The 'en' key carries English
        text and is required for cross-border patterns.
      additionalProperties: true
      required:
        - id
      properties:
        id:
          type: string
          description: Bahasa Indonesia text value.
        en:
          type: string
          description: English text value. Required for cross-border pattern.

    # ─────────────────────────────────────────────────────────────────────
    # LAYER 1: TradeResource — generic retail layer
    # Inherits from RetailResource v2.1 at schema.beckn.io via allOf.
    # Adds fields that are meaningful across any retail network but are not
    # yet part of the upstream RetailResource schema.
    # ─────────────────────────────────────────────────────────────────────
    TradeResource:
      type: object
      title: TradeResource
      description: >
        Network-agnostic generic layer for trade sector resources on ION. Inherits
        from RetailResource v2.1 (schema.beckn.io) via allOf, which provides the
        core retail fields (resourceStructure, variants, images, availability,
        physical, packaged goods, age restriction, country of origin, etc.).

        This layer adds fields that are useful for retail networks in general but
        are not yet in the upstream RetailResource: localised name and description,
        food and beverage attributes, fashion, electronics, beauty, agritech,
        pharmacy, installation, usage, and warranty sub-objects.

        The ION-specific layer (IONTradeResource) extends this via allOf and adds
        Indonesia-specific regulatory and compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Resource.resourceAttributes
      additionalProperties: true
      allOf:
        # REMOTE upstream (active — used by ONIX at validation time):
        # - $ref: https://raw.githubusercontent.com/beckn/local-retail/main/schema/RetailResource/v2.1/attributes.yaml#/components/schemas/RetailResource
        # LOCAL vendored reference copy (for offline review and version drift detection):
        # - $ref: ../../../../core/v2/api/v2.0.0/vendored/retail-resource-v2.1.yaml#/components/schemas/RetailResource
      properties:
        name:
          type: object
          additionalProperties:
            type: string
          description: >
            Display name of the resource. Language-keyed localised text object.
            Minimum: name.id (Bahasa Indonesia). name.en required for cross-border
            pattern. Rendered as the product title in consumer-facing CN interfaces.
          x-ion-condition: Required at catalog/publish for all resource types

        shortDesc:
          type: object
          additionalProperties:
            type: string
          description: >
            Short product description. Language-keyed localised text object.
            Maximum 280 characters per language value. Used in search results,
            product cards, and push notification previews. Longer descriptive
            content including specs, features, and care instructions belongs
            in Descriptor.longDesc.
          x-ion-condition: Required at catalog/publish for all resource types

        menuCategory:
          type: object
          additionalProperties: false
          description: >
            Menu or category section this resource belongs to. Used by food service
            and marketplace providers to group resources for display. Drives display
            order and grouping in BAP interfaces.
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: object
              additionalProperties:
                type: string
            sequence:
              type: integer
              description: Display order of this category relative to others.
            imageUrl:
              type: string
              format: uri
          x-ion-condition: Required for food and beverage providers

        preparationTime:
          type: string
          format: duration
          description: >
            ISO 8601 duration. Time from order confirmation to item ready for
            pickup or dispatch. Used for SLA computation and estimated delivery
            time display to the consumer. Applicable to made-to-order food,
            custom-built products, and services with lead times.
          example: PT20M
          x-ion-condition: Required for food, beverage and made-to-order items

        food:
          type: object
          additionalProperties: false
          description: >
            Packaged food product attributes for filtering and regulatory compliance.
            Use for FMCG packaged food, grocery products, bottled beverages,
            packaged meal kits, snacks, and confectionery sold from warehouse stock.
            Do not use for restaurant or cloud kitchen menu items — those use
            MenuItem in the Hospitality sector (hospitality/menu-item/v1).
            Detailed nutritional information and ingredient lists belong in
            Descriptor.longDesc for agent readability.
          properties:
            classification:
              type: string
              enum: [VEG, NON_VEG, HALAL, EGG]
              example: HALAL
            allergens:
              type: array
              items:
                type: string
                enum: [GLUTEN, NUTS, DAIRY, EGGS, SOY, SHELLFISH, FISH, SESAME,
                       SULPHITES, CELERY, MUSTARD, LUPIN]
            cuisineType:
              type: string
              example: Padang
            spiceLevel:
              type: string
              description: >
                Spiciness level of the food item. Free-text to accommodate regional
                descriptors (e.g. "Pedas Sedang", "Level 3", "Extra Hot").
              x-ion-suggested-values: [NONE, LOW, MEDIUM, HIGH, EXTRA_HOT]
              example: MEDIUM
            freshProduce:
              type: object
              additionalProperties: false
              properties:
                netQuantityDeclaration:
                  type: string
                  example: 1 kg
                harvestDate:
                  type: string
                  format: date
          x-ion-condition: Required for food and beverage resources

        preparation:
          type: object
          additionalProperties: false
          description: >
            Preparation, storage, and shelf-life instructions for the resource.
            Applicable to food, beverage, perishable, and made-to-order products.
            Detailed cooking instructions and usage guides belong in Descriptor.longDesc.
          properties:
            instructions:
              type: string
              example: Panggang di oven 200°C selama 15 menit
            storage:
              type: string
              example: Simpan di tempat sejuk dan kering
            shelfLife:
              type: string
              description: ISO 8601 duration from production date.
              example: PT2H
          x-ion-condition: Required for food, beverage and perishable products

        fashion:
          type: object
          additionalProperties: false
          description: >
            Fashion and apparel attributes for filtering and size guidance.
            Structured fields are limited to values that participate in deterministic
            filtering (gender, size) or regulatory compliance (fabricComposition under SNI).
            Descriptive attributes such as fitType, sleeveType, collarType, occasion,
            pattern, and careInstructions belong in Descriptor.longDesc as natural-language
            prose — AI agents extract richer meaning from prose than from closed enums.
          properties:
            gender:
              type: string
              enum: [MALE, FEMALE, UNISEX, BOYS, GIRLS]
            size:
              type: string
              example: L
            sizeChart:
              type: string
              format: uri
            fabric:
              type: string
              example: Katun
            fabricComposition:
              type: string
              example: 100% Katun
              x-ion-regulatory: PerBSN SNI 0055:2009
          x-ion-condition: Required for fashion and apparel products

        electronics:
          type: object
          additionalProperties: false
          description: >
            Consumer electronics technical specifications for filtering and comparison.
            Structured fields are limited to values used in deterministic filtering
            (osType, connectivity) or regulatory compliance (energyRating, wattage).
            Descriptive specifications such as RAM, ROM, screen size, camera resolution,
            CPU, and battery capacity belong in Descriptor.longDesc — multimodal agents
            extract these from linked product datasheets and images in Descriptor.docs[]
            and Descriptor.mediaFile[] with higher fidelity than typed fields.
          properties:
            osType:
              type: string
              enum: [IOS, ANDROID, WINDOWS, MACOS, LINUX, TIZEN, WEBOS, OTHER]
            connectivity:
              type: array
              items:
                type: string
                enum: [WIFI, BLUETOOTH, NFC, USB_C, USB_A, HDMI, ETHERNET,
                       LIGHTNING, MMWAVE_5G, SUB6_5G, 4G_LTE, 3G, IR_BLASTER]
            wattage:
              type: integer
              description: Power consumption in watts.
            voltage:
              type: string
              example: 220V
            energyRating:
              type: integer
              minimum: 1
              maximum: 5
              description: BSN energy efficiency star rating.
          x-ion-condition: Required for electronics and appliance products

        beauty:
          type: object
          additionalProperties: false
          description: >
            Beauty and personal care product attributes for filtering and regulatory
            compliance. concern and ingredient are descriptive fields — include them
            in Descriptor.longDesc for richer agent-readable content. Structured
            fields below are for filtering and compliance.
          properties:
            conscious:
              type: string
              enum: [NATURAL, ORGANIC, VEGAN, CRUELTY_FREE, HALAL_COSMETICS]
            preference:
              type: string
              enum: [HERBAL, AYURVEDIC, CHEMICAL_FREE, FRAGRANCE_FREE, ALCOHOL_FREE]
            formulation:
              type: string
              enum: [LIQUID, CREAM, GEL, POWDER, SERUM, BALM, SPRAY, FOAM,
                     STICK, SHEET]
            skinType:
              type: string
              enum: [ALL, NORMAL, OILY, DRY, COMBINATION, SENSITIVE]
            hairType:
              type: string
              enum: [ALL, NORMAL, OILY, DRY, DAMAGED, CURLY, STRAIGHT]
            spf:
              type: integer
              minimum: 0
              example: 50
            gender:
              type: string
              enum: [MALE, FEMALE, UNISEX]
            volume:
              type: object
              additionalProperties: false
              properties:
                value:
                  type: number
                unit:
                  type: string
                  enum: [ML, G, OZ]
          x-ion-regulatory: PerBPOM 23/2019 tentang Persyaratan Teknis Kosmetika
          x-ion-condition: Required for beauty and personal care products

        agritech:
          type: object
          additionalProperties: false
          description: >
            Agricultural and fresh produce attributes. Covers harvest dates, produce
            grade, organic certification, and unit of measure for weight-sold products.
            The mandiReferencePrice sub-field carries the Indonesian government mandi
            reference price and is declared on IONTradeResource (Indonesia-specific).
          properties:
            harvestDate:
              type: string
              format: date
            produceGrade:
              type: string
              enum: [PREMIUM, GRADE_A, GRADE_B, GRADE_C]
            pesticideDeclaration:
              type: string
              enum: [PESTICIDE_FREE, LOW_PESTICIDE, STANDARD, ORGANIC_CERTIFIED]
            organicCertification:
              type: object
              additionalProperties: false
              properties:
                certBody:
                  type: string
                  example: Lembaga Sertifikasi Organik Seloliman
                certNumber:
                  type: string
            unitOfMeasure:
              type: object
              additionalProperties: false
              required: [unit, value]
              properties:
                unit:
                  type: string
                  enum: [GRAM, KILOGRAM, LITRE, MILLILITRE, PIECE, DOZEN, BUNCH, IKAT]
                value:
                  type: number
          x-ion-condition: Required for agritech and fresh produce

        pharmacy:
          type: object
          additionalProperties: false
          description: >
            Pharmaceutical and over-the-counter medicine attributes. Covers
            prescription requirements, dosage form, active ingredients, and
            cold chain requirements. Applicable to prescription drugs, OTC
            medicines, and medical devices sold through ION.
          properties:
            prescriptionRequired:
              type: boolean
            dosageForm:
              type: string
              enum: [TABLET, CAPSULE, SYRUP, INJECTION, OINTMENT, DROPS,
                     INHALER, SUPPOSITORY, PATCH]
            strength:
              type: string
              example: 500 mg
            activeIngredients:
              type: array
              items:
                type: string
            coldChainRequired:
              type: boolean
          x-ion-regulatory: PerBPOM Nomor 4 Tahun 2018
          x-ion-condition: Required for pharmaceutical and OTC medicine

        installation:
          type: object
          additionalProperties: false
          description: >
            Installation service information for products that require professional
            setup. Applicable to large appliances, heavy furniture, HVAC systems,
            and any product where the seller offers or requires installation.
          properties:
            providedBySeller:
              type: boolean
            notes:
              type: string
              example: Memerlukan instalasi profesional. Membutuhkan arus 220V khusus.
          x-ion-condition: Required for appliances and furniture needing installation

        usage:
          type: object
          additionalProperties: false
          description: >
            Usage constraints and compatibility information for the resource.
            Covers indoor/outdoor restrictions and compatibility with other
            products or infrastructure requirements.
          properties:
            indoorOnly:
              type: boolean
            compatibleWith:
              type: array
              items:
                type: string
              example: ["220V outlet", "36-inch doorway"]

        warranty:
          type: object
          additionalProperties: false
          description: >
            Warranty terms for the resource. Duration expressed as ISO 8601 duration.
            Covers manufacturer warranty, seller warranty, and extended warranty.
            Service centre information and detailed warranty terms belong here.
          properties:
            duration:
              type: string
              description: ISO 8601 duration. Minimum P1Y for electronics.
              example: P2Y
            type:
              type: string
              enum: [MANUFACTURER, SELLER, EXTENDED, NONE]
            terms:
              type: string
              example: Garansi resmi 2 tahun. Tidak mencakup kerusakan fisik dan air.
            serviceCenter:
              type: string
          x-ion-regulatory: UU 8/1999 tentang Perlindungan Konsumen Pasal 25; PP 36/2023
          x-ion-condition: Required for electronics, appliances, consumer durables

    # ─────────────────────────────────────────────────────────────────────
    # LAYER 2: IONTradeResource — ION-specific layer
    # Inherits from TradeResource (which inherits from RetailResource) via allOf.
    # Contains ONLY Indonesia-specific regulatory, compliance, and taxonomy fields.
    # ─────────────────────────────────────────────────────────────────────
    IONTradeResource:
      type: object
      title: IONTradeResource
      description: >
        ION Trade sector resource attributes. Indonesia-specific extension layer for
        trade resources. Inherits all fields from TradeResource (generic layer) and
        RetailResource (upstream Beckn domain schema) via the allOf chain.

        This layer carries only fields that are specific to Indonesia: the ION
        Catalogue Resource Category (CRC) taxonomy code, Indonesian regulatory
        registrations (BPOM, MUI, SNI, POSTEL), geographic indication certification
        under Indonesian IP law, digital goods categories specific to Indonesian
        operators (Telkomsel pulsa, PLN tokens, BPJS payments), and data residency
        requirements under the Indonesian PDP Law (UU 27/2022).
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      additionalProperties: true
      x-ion-closed-extensions: false
      x-beckn-attaches-to: Resource.resourceAttributes
      x-jsonld:
        '@context': 'https://schema.ion.id/trade/resource/v1/context.jsonld'
        '@type': ion:IONTradeResource
      allOf:
        - $ref: '#/components/schemas/TradeResource'
        # Conditional validation rules — applied when specific field values are present
        - if:
            properties:
              resourceStructure:
                enum: [VARIANT]
            required: [resourceStructure]
          then:
            required: [parentResourceId, isDefaultVariant, variantGroup]
        - if:
            properties:
              resourceStructure:
                enum: [COMPOSED, WITH_EXTRAS]
            required: [resourceStructure]
          then:
            required: [customisationGroups]
        - if:
            properties:
              ageRestricted:
                const: true
            required: [ageRestricted]
          then:
            required: [minAge]
        - if:
            properties:
              regionOfOrigin:
                minLength: 1
            required: [regionOfOrigin]
          then:
            required: [geographicIndicationCert]
      # NETWORK POLICY NOTE (NFH-012 CON-012-18):
      # Shared schemas MUST NOT declare mandatory fields at the top level.
      # Fields previously required (quantity, resourceStructure, resourceTangibility,
      # images, logisticsServiceType, availability, ageRestricted, countryOfOrigin)
      # are enforced via ION network policy (x-ion-crc-rules, x-ion-conditional-rules
      # in ion.yaml) rather than this shared schema.
      properties:
        crc:
          type: string
          description: >
            ION Catalogue Resource Category code classifying this resource within
            the ION item taxonomy. Determines which attribute sub-objects are
            mandatory at catalog/publish time and signals to CNs how to present
            and discover the resource. Values from x-ion-crc-registry in ion.yaml
            (e.g. TRC-fashion, TRC-electronics, HSC-restaurant-ordering).
            Optional now — will become required in a future version once CRC
            enforcement is fully activated in ONIX.
          example: TRC-fashion
          x-ion-enforcement: optional-now-required-later

        regulatory:
          type: object
          additionalProperties: false
          description: >
            Indonesian regulatory registrations and food safety declarations
            for the resource. Covers BPOM (food, medicine, cosmetics), MUI halal
            certification, SNI standards compliance, SP-PIRT for home-industry food,
            KEMENKES health product registration, and SIUP business licence references.
            All registration schemes are governed by Indonesian regulatory authorities.
          properties:
            registrations:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [scheme, id]
                properties:
                  scheme:
                    type: string
                    enum: [BPOM_MD, BPOM_ML, BPOM_TR, MUI_HALAL, SNI,
                           SP_PIRT, KEMENKES, SIUP]
                    description: >
                      BPOM_MD: domestic food/medicine/cosmetic BPOM registration.
                      BPOM_ML: imported product BPOM registration.
                      BPOM_TR: traditional medicine BPOM registration.
                      MUI_HALAL: MUI halal certification.
                      SNI: Standar Nasional Indonesia certification.
                      SP_PIRT: home-industry food production permit (Sertifikat Produksi Pangan IRT).
                      KEMENKES: health product registration from Ministry of Health.
                      SIUP: business trading licence reference.
                  id:
                    type: string
                    description: Registration or certificate number.
                  role:
                    type: string
                    enum: [BRAND_OWNER, MANUFACTURER, IMPORTER, PACKER]
                  url:
                    type: string
                    format: uri
                    description: URL to publicly verify the registration.
                  validUntil:
                    type: string
                    format: date
            foodRegulatoryDeclaration:
              type: object
              additionalProperties: false
              description: >
                Food regulatory declarations required for packaged food products
                in Indonesia. Covers nutritional information, additives, ingredients,
                and BPOM licence numbers for brand owners, importers, and manufacturers.
              properties:
                nutritionalInfo:
                  type: string
                  example: Energi 350 kkal per 100g; Protein 10g; Lemak Total 5g
                additivesInfo:
                  type: string
                ingredientsInfo:
                  type: string
                brandOwnerBpomLicenseNo:
                  type: string
                importerBpomLicenseNo:
                  type: string
                mfgLicenseNo:
                  type: string
            nutrition:
              type: array
              description: >
                Structured nutritional information per serving or per 100g.
                Used for regulatory compliance display and consumer filtering
                (e.g. low-calorie, high-protein product discovery).
              items:
                type: object
                additionalProperties: false
                required: [nutrient, value]
                properties:
                  nutrient:
                    type: string
                    example: Protein
                  value:
                    type: object
                    additionalProperties: false
                    required: [unitCode, unitQuantity]
                    properties:
                      unitCode:
                        type: string
                        enum: [G, MG, MCG, KCAL, KJ, IU, PERCENT]
                      unitQuantity:
                        type: number
            additives:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  type:
                    type: string
                    enum: [CONTAINS, FREE_FROM]
                  value:
                    type: string
            credentials:
              type: array
              description: >
                Verifiable credentials for this resource. Links to publicly
                verifiable certification documents (halal certificates, organic
                certificates, SNI compliance documents).
              items:
                type: object
                additionalProperties: false
                required: [type, uri]
                properties:
                  type:
                    type: string
                  uri:
                    type: string
                    format: uri
                  issuer:
                    type: string
                  validUntil:
                    type: string
                    format: date
            backImage:
              type: string
              format: uri
              description: >
                Back-of-pack statutory label image URL. Required for products
                subject to PerBPOM 31/2018 label display requirements.

        regionOfOrigin:
          type: string
          pattern: '^[A-Z]{2,3}-[A-Z0-9]{1,3}$'
          description: >
            ISO 3166-2 sub-national region code for geographic indication products.
            Required when the product claims origin-protected status under Indonesian
            geographical indication law (e.g. Kopi Gayo from Aceh: IDN-AC, Beras
            Cianjur from West Java: IDN-JB). Must be accompanied by
            geographicIndicationCert when declared.
          example: IDN-AC
          x-ion-regulatory: UU 20/2016 tentang Merek dan Indikasi Geografis
          x-ion-condition: Required when product claims Geographic Indication status

        geographicIndicationCert:
          type: string
          description: >
            Geographic Indication certificate number issued by DJKI (Direktorat
            Jenderal Kekayaan Intelektual — Directorate General of Intellectual
            Property). Required when regionOfOrigin is declared for GI products.
          x-ion-condition: Required when regionOfOrigin is declared for GI products

        digital:
          type: object
          additionalProperties: false
          description: >
            Digital goods attributes specific to Indonesian digital commerce.
            Required when resourceTangibility is DIGITAL_VOUCHER, DIGITAL_TOP_UP,
            or DIGITAL_SUBSCRIPTION. Covers Indonesian-specific digital product
            categories: mobile pulsa and data packages (Telkomsel, XL, Indosat, Tri,
            Smartfren), electricity tokens (PLN), water bills (PDAM), tax payments
            (PBB), BPJS health insurance payments, and e-wallet top-ups. Game voucher
            categories cover popular titles in the Indonesian market (Mobile Legends,
            Free Fire, Valorant, Genshin Impact).
          properties:
            digitalCategory:
              type: string
              enum:
                - MOBILE_PULSA
                - MOBILE_DATA_PACKAGE
                - ELECTRICITY_TOKEN
                - WATER_BILL
                - INTERNET_BILL
                - PDAM_BILL
                - PBB_TAX
                - BPJS_PAYMENT
                - GIFT_CARD
                - GAME_VOUCHER
                - STREAMING_VOUCHER
                - FOOD_VOUCHER
                - EWALLET_TOP_UP
                - TRANSPORT_VOUCHER
                - EDUCATION_VOUCHER
                - OTHER
            operatorOrIssuer:
              type: string
              description: >
                Issuing operator or brand. For MOBILE_PULSA: TELKOMSEL, XL, INDOSAT,
                TRI, SMARTFREN. For ELECTRICITY_TOKEN: PLN. For GAME_VOUCHER: Moonton,
                Garena, Riot, miHoYo etc.
              example: TELKOMSEL
            denomination:
              type: object
              additionalProperties: false
              description: Voucher or top-up denomination value and unit.
              required: [value, unit]
              properties:
                value:
                  type: number
                currency:
                  type: string
                  default: IDR
                unit:
                  type: string
                  enum: [IDR, MB, GB, MINUTES, DIAMONDS, COINS, OTHER]
                  description: >
                    IDR for money-based denominations; MB/GB for data packages;
                    DIAMONDS/COINS for in-game currency.
            deliveryMethod:
              type: string
              enum: [PUSH_TO_TARGET, CODE_TO_BUYER, ACCOUNT_CREDIT, QR_VOUCHER]
              description: >
                PUSH_TO_TARGET: delivered directly to consumer account (pulsa to
                phone number, PLN token to meter number, in-game currency to game
                account). CODE_TO_BUYER: redemption code sent to buyer for later
                use. ACCOUNT_CREDIT: credited to buyer wallet or account.
                QR_VOUCHER: scannable QR redeemable at merchant point.
            target:
              type: object
              additionalProperties: false
              description: Target identifier for digital delivery.
              properties:
                type:
                  type: string
                  enum: [MOBILE_NUMBER, CUSTOMER_ID, ACCOUNT_ID, EMAIL,
                         METER_NUMBER, GAME_USER_ID]
                value:
                  type: string
                operatorValidationRequired:
                  type: boolean
                  description: >
                    Whether BPP must verify the target exists before accepting
                    the order (e.g. mobile number inquiry to operator).
            redemptionCode:
              type: string
              description: >
                Redemption code or voucher code. Returned in on_status[DELIVERED]
                for CODE_TO_BUYER delivery method. Must be encrypted in transit.
            redemptionUrl:
              type: string
              format: uri
              description: URL for redemption (streaming service activation, game code page).
            expiryAfterPurchase:
              type: string
              description: >
                ISO 8601 duration — how long the voucher is valid from purchase date.
              example: P30D
            refundable:
              type: boolean
              default: false
              description: >
                Whether the digital good is refundable. Most pulsa and top-up products
                are non-refundable once delivered to the target. Vouchers may be
                refundable if unredeemed.
            cancellable:
              type: boolean
              default: false
              description: Whether cancellation is possible before delivery is initiated.
          x-ion-condition: >
            Required when resourceTangibility IN
            [DIGITAL_VOUCHER, DIGITAL_TOP_UP, DIGITAL_SUBSCRIPTION]

        dataResidency:
          type: string
          enum: [DOMESTIC_ONLY, INTERNATIONAL_ALLOWED]
          description: >
            Data residency requirement for this resource under Indonesian Personal
            Data Protection Law (UU 27/2022 tentang Pelindungan Data Pribadi).
            DOMESTIC_ONLY means all PII and transaction data associated with this
            resource must be processed and stored within Indonesia. BAPs with foreign
            data processing infrastructure must refuse transactions for DOMESTIC_ONLY
            resources. Required for pharmacy, health data, financial services, and
            regulated biometric product categories.
          example: DOMESTIC_ONLY
