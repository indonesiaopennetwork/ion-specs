openapi: "3.1.1"
info:
  title: ION Finance Insurance Performance Extension (v1)
  version: 1.0.0
  description: |
    Policy coverage period and lifecycle state tracking for the Finance domain.
    Attaches to: beckn:Contract.performance[].performanceAttributes

components:
  schemas:
    PolicyPerformance:
      type: object
      title: PolicyPerformance
      x-ion-layer: ion
      x-ion-split-version: "1.0.0"
      x-beckn-attaches-to: Contract.performance[].performanceAttributes
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:PolicyPerformance
      additionalProperties: true
      properties:
        policyState:
          type: string
          enum:
            - PENDING_ISSUANCE
            - ACTIVE
            - CLAIM_FILED
            - CLAIM_SETTLED
            - RENEWAL_DUE
            - RENEWED
            - LAPSED
            - EXPIRED
            - TOTAL_LOSS
            - CANCELLED
          description: Current policy lifecycle state
        coveragePeriodStart:
          type: string
          format: date
          example: "2026-06-18"
        coveragePeriodEnd:
          type: string
          format: date
          example: "2027-06-17"
        nextRenewalDueDate:
          type: string
          format: date
          description: T-30 days before coveragePeriodEnd
          example: "2027-05-18"
        claimCount:
          type: integer
          minimum: 0
          default: 0
        ncdPercentage:
          type: number
          minimum: 0
          maximum: 25
          description: No Claims Discount % earned this period
        remainingSumInsuredIDR:
          type: number
          description: Sum insured remaining after settled claims
