openapi: "3.1.1"
info:
  title: ION Finance Insurance Offer Extension (v1)
  version: 1.0.0
  description: |
    Per-policyholder premium quote attributes for the Finance domain.
    Returned at on_select after vehicle risk classification.
    Attaches to: beckn:Offer.offerAttributes

components:
  schemas:
    PolicyQuote:
      type: object
      title: PolicyQuote
      x-ion-layer: ion
      x-ion-split-version: "1.0.0"
      x-beckn-attaches-to: Offer.offerAttributes
      x-jsonld:
        '@context': ./context.jsonld
        '@type': ion:PolicyQuote
      additionalProperties: true
      properties:
        approvedIDV:
          type: number
          description: Insured Declared Value approved by underwriter in IDR
          example: 210000000
        annualPremiumIDR:
          type: number
          description: Base annual premium in IDR (IDV × rate)
          example: 2730000
        ojkFinalRatePercent:
          type: number
          description: Final OJK tariff-compliant rate (% per annum)
          example: 1.30
        tariffZone:
          type: string
          enum: [ZONE_1, ZONE_2, ZONE_3, ZONE_4, ZONE_5]
        quoteValidUntil:
          type: string
          format: date-time
          example: "2026-06-24T23:59:59+07:00"
        inclusions:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - PARTIAL_LOSS
              - TOTAL_LOSS
              - THEFT
              - FIRE
              - THIRD_PARTY_LIABILITY
              - NATURAL_DISASTER
              - ROADSIDE_ASSISTANCE
              - PERSONAL_ACCIDENT_DRIVER
              - PERSONAL_ACCIDENT_PASSENGER
          description: Covered peril codes active in this offer
        specialExclusions:
          type: array
          items: { type: string }
          description: Free-text risk-specific exclusions beyond standard exclusions
        addOnPremiums:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
              premiumIDR: { type: number }
        deductible:
          type: number
          description: Risiko sendiri (deductible) per claim in IDR
          example: 300000
        counterOfferIDV:
          type: number
          description: Insurer-proposed IDV if declared IDV was outside range
        inspectionRequired:
          type: boolean
        requiredDocuments:
          type: array
          items: { type: string }
        ncdApplied:
          type: boolean
        ncdPercentage:
          type: number
          minimum: 0
          maximum: 25
