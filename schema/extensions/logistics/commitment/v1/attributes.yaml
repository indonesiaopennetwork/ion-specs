openapi: 3.1.1
info:
  title: ION Logistics Commitment Extension (v1)
  description: 'Logistics sector commitment attributes. Defines line-item level details within a logistics transaction
    — specific items, quantities, handling instructions, and line identifiers. Attaches to: beckn:Commitment.commitmentAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    LogisticsCommitment:
      type: object
      title: LogisticsCommitment
      description: >
        Network-agnostic generic layer for LogisticsCommitment. Inherits from Beckn core Attributes.
        Downstream ION-specific layer (IONLogisticsCommitment) extends this schema via allOf.
        This layer carries only fields that are meaningful across any Beckn network — 
        no Indonesia-specific regulatory or compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Commitment.commitmentAttributes
      additionalProperties: true
      allOf:
        # LOCAL (default — active):
        - $ref: beckn.yaml#/components/schemas/Commitment
        # REMOTE (uncomment to use upstream directly):
        # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Commitment
    IONLogisticsCommitment:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      allOf:
        - $ref: '#/components/schemas/LogisticsCommitment'
      title: LogisticsCommitment
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/logistics/commitment/v1/context.jsonld'
        '@type': ion:LogisticsCommitment
      x-beckn-attaches-to: Commitment.commitmentAttributes
      properties:
        lineId:
          type: string
          description: Unique identifier for this commitment line
        resourceId:
          type: string
          description: Reference to the resource (shipment, SKU, vehicle) in this line
        offerId:
          type: string
          description: Offer this commitment is placed against
        packageCount:
          type: integer
          description: Number of packages in this commitment line
        totalWeight:
          type: object
          additionalProperties: true
          properties:
            value:
              type: number
            unit:
              type: string
              enum:
                - GRAM
                - KILOGRAM
                - TONNE
        totalVolume:
          type: object
          additionalProperties: true
          properties:
            value:
              type: number
            unit:
              type: string
              enum:
                - CBM
                - LITRE
        specialInstructions:
          type: string
          description: 'Free-text handling instructions for this shipment line. Examples: "Do not stack", "This
            side up", "Refrigerate on arrival"

            '
        containerReference:
          type: string
          description: Container number for FCL freight commitments
        sealNumber:
          type: string
          description: Container seal number
        skuId:
          type: string
          description: SKU identifier for warehouse commitment lines
        quantity:
          type: integer
          description: Quantity committed for this SKU
        lotNumber:
          type: string
          description: Lot or batch number for traceability
        expiryDate:
          type: string
          format: date
          description: Expiry date for perishable or pharma inventory
        capacityUnits:
          type: number
          description: Committed capacity units (kg, cbm, containers, pallets)
        capacityUnitType:
          type: string
          enum:
            - KG
            - CBM
            - CONTAINER
            - PALLET
            - TRUCK
        requestedDepartureDate:
          type: string
          format: date
          description: For freight — requested departure date for this commitment line
        vehicleRegistration:
          type: string
          description: Vehicle registration for roro commitment lines
        parentCommitmentId:
          type: string
          description: Parent commitment reference for child transactions under a parent contract
      x-ion-closed-extensions: false
      allOf:
      - $ref: ../../../../core/v2/api/v2.0.0/beckn.yaml#/components/schemas/Attributes
