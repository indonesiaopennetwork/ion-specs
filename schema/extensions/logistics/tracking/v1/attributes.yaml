openapi: 3.1.1
info:
  title: ION Logistics Tracking Extension (v1)
  description: 'Logistics sector tracking attributes. Attaches to the native beckn:Tracking.trackingAttributes slot
    defined in Beckn 2.0. Covers live GPS streaming, AWB tracking URLs, WebSocket endpoints, and webhook-based tracking.
    Attaches to: beckn:Tracking.trackingAttributes

    '
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    LogisticsTracking:
      type: object
      title: LogisticsTracking
      description: >
        Network-agnostic generic layer for LogisticsTracking. Inherits from Beckn core Attributes.
        Downstream ION-specific layer (IONLogisticsTracking) extends this schema via allOf.
        This layer carries only fields that are meaningful across any Beckn network — 
        no Indonesia-specific regulatory or compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Tracking.trackingAttributes
      additionalProperties: true
      allOf:
        # LOCAL (default — active):
        - $ref: beckn.yaml#/components/schemas/Tracking
        # REMOTE (uncomment to use upstream directly):
        # - $ref: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/main/api/v2.0.0/beckn.yaml#/components/schemas/Tracking
    IONLogisticsTracking:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      allOf:
        - $ref: '#/components/schemas/LogisticsTracking'
      title: LogisticsTracking
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/logistics/tracking/v1/context.jsonld'
        '@type': ion:LogisticsTracking
      x-beckn-attaches-to: Tracking.trackingAttributes
      properties:
        trackingType:
          type: string
          enum:
          - LIVE_GPS
          - AWB_URL
          - WEBHOOK
          - WEBSOCKET
          - POLLING_API
          description: 'Mode of tracking offered. LIVE_GPS for hyperlocal real-time position. AWB_URL for parcel
            tracking on carrier''s own website. WEBHOOK for event-driven push. WEBSOCKET for bidirectional streaming.
            POLLING_API for request/response status queries.

            '
        refreshIntervalSeconds:
          type: integer
          description: 'Recommended polling interval for LIVE_GPS and POLLING_API modes. Typical: 5-15 seconds for
            hyperlocal, 60+ for parcel.

            '
          x-ion-condition: 'See property description: Recommended polling interval for LIVE_GPS and POLLING_API modes. Typical: 5-15 s'
        credentials:
          type: object
          additionalProperties: false
          description: Authentication for WEBSOCKET or authenticated webhook
          properties:
            type:
              type: string
              enum:
              - BEARER_TOKEN
              - API_KEY
              - SIGNED_URL_PARAM
            value:
              type: string
            validUntil:
              type: string
              format: date-time
          x-ion-condition: 'See property description: Authentication for WEBSOCKET or authenticated webhook'
        webhookEvents:
          type: array
          description: Events the BPP will push to webhook (if trackingType=WEBHOOK)
          items:
            type: string
            description: >
              Webhook event name. Free-text to accommodate new state machine
              states without requiring schema bumps.
            x-ion-suggested-values:
              - STATE_CHANGE
              - LOCATION_UPDATE
              - SLA_BREACH_IMMINENT
              - EXCEPTION
              - DELIVERY_COMPLETE
          x-ion-condition: 'See property description: Events the BPP will push to webhook (if trackingType=WEBHOOK)'
        currentLocation:
          type: object
          additionalProperties: false
          description: 'Last known location snapshot at time of /on_track response. Primarily for LIVE_GPS.

            '
          properties:
            latitude:
              type: number
            longitude:
              type: number
            timestamp:
              type: string
              format: date-time
            accuracyMeters:
              type: number
            heading:
              type: number
              description: Degrees from true north
            speedKmh:
              type: number
          x-ion-condition: 'See property description: Degrees from true north'
        etaMinutes:
          type: integer
          description: Current ETA to next waypoint or destination
          x-ion-condition: 'See property description: Current ETA to next waypoint or destination'
        routePolyline:
          type: string
          description: Encoded polyline of planned route (Google-style encoding)
        agentDetails:
          type: object
          additionalProperties: false
          description: 'Agent details exposed based on offer.agentAssignmentModel and current performance state.

            '
          properties:
            name:
              type: string
            phone:
              type: string
              description: Masked proxy phone, never real number
            vehicleType:
              type: string
            vehiclePlate:
              type: string
            photoUrl:
              type: string
              format: uri
            languagesSpoken:
              type: array
              items:
                type: string
          x-ion-condition: 'See property description: Masked proxy phone, never real number'
        trackingHandoffToCarrier:
          type: boolean
          description: 'True if tracking URL redirects to carrier''s own tracking page (common for parcel where
            AWB is carrier-native).

            '
        carrierTrackingUrlPattern:
          type: string
          description: 'URL template for AWB_URL tracking. E.g. "https://jne.co.id/tracking?awb={awbNumber}"

            '
      # NETWORK POLICY NOTE (GAP 32 / NFH-012 CON-012-18):
      # Shared schemas MUST NOT declare mandatory fields.
      # The following fields were required in v0.6.0 and are now
      # enforced via ION network policy (x-ion-crc-rules,
      # x-ion-conditional-rules) rather than the shared schema:
      # trackingType
      x-ion-closed-extensions: false
      allOf:
      - $ref: ../../../../core/v2/api/v2.0.0/beckn.yaml#/components/schemas/Attributes
