openapi: 3.1.1
info:
  title: ION Logistics Agent Extension (v1)
  description: "Thin logistics addendum to core/participant/v1. Carries the few participant identity fields that\
    \ apply only to logistics roles — PPJK customs-broker licence and Indonesian driver SIM details.\nAttaches to:\
    \ beckn:Participant (direct properties) alongside IONParticipant (core/participant/v1) on the same\
    \ participant. Both blocks coexist because they declare disjoint field sets and carry distinct @type values.\n\
    Wire placement on a single participant:\n  message.participants[N]: {  # direct properties, no participantAttributes wrapper\n    \"@context\"\
    : [\"https://schema.ion.id/core/participant/v1/context.jsonld\",\n                 \"https://schema.ion.id/logistics/participant-logistics/v1/context.jsonld\"\
    ],\n    \"@type\": [\"ion:IONParticipant\",\n              \"ion:IONLogisticsAgent\"],\n \
    \   ...core participant fields...,\n    ...logistics addendum fields...\n  }\n\nNew in v0.5.2. Supersedes the\
    \ previous logistics/participant/v1 pack whose cross-sector fields were promoted to core.\n"
  version: 1.0.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: ION Network
    url: https://schema.ion.id
components:
  schemas:
    LogisticsAgent:
      type: object
      title: LogisticsAgent
      description: >
        Network-agnostic generic layer for LogisticsAgent. Inherits from Beckn core Attributes.
        Downstream ION-specific layer (IONLogisticsAgent) extends this schema via allOf.
        This layer carries only fields that are meaningful across any Beckn network — 
        no Indonesia-specific regulatory or compliance fields.
      x-ion-layer: generic
      x-ion-split-version: "0.7.0"
      x-recommended-parent: Participant (direct properties)
      additionalProperties: true
      allOf:
        - $ref: 'https://schema.beckn.io/Participant/v2.0/attributes.yaml#/components/schemas/Participant'
    IONLogisticsAgent:
      type: object
      x-ion-layer: ion
      x-ion-split-version: "0.7.0"
      allOf:
        - $ref: '#/components/schemas/LogisticsAgent'
      title: Logistics Participant Addendum
      additionalProperties: true
      x-jsonld:
        '@context': 'https://schema.ion.id/logistics/participant-logistics/v1/context.jsonld'
        '@type': ion:IONLogisticsAgent
      x-beckn-attaches-to: Participant (direct properties — Beckn v2.0 Participant has no participantAttributes wrapper)
      properties:
        ppjkLicenceNumber:
          x-ion-data-residency: ID
          type: string
          description: 'PPJK (Pengusaha Pengurusan Jasa Kepabeanan) licence number — Indonesian customs-broker licence.
            Governs who may file customs declarations on behalf of importers/exporters. Only applicable to the CUSTOMS_BROKER
            role.

            '
          x-ion-regulatory: PMK 219/PMK.04/2019 tentang PPJK
          x-ion-cross-schema-condition: true
          x-ion-condition: Required when role=CUSTOMS_BROKER
        driverLicenceNumber:
          x-ion-data-residency: ID
          type: string
          description: SIM (Surat Izin Mengemudi) — Indonesian driving licence number
          x-ion-cross-schema-condition: true
          x-ion-condition: Required when role=DRIVER (roro, freight, hyperlocal)
        driverLicenceCategory:
          type: string
          enum:
          - A
          - B_I
          - B_II
          - C
          - D
          description: 'SIM category — Indonesian driving licence classes. A: small passenger cars / light commercial.
            B_I: heavy trucks under 3500kg. B_II: trailer/trucks over 3500kg. C: motorcycles. D: disabled-persons
            vehicles.

            '
          x-ion-regulatory: UU 22/2009 LLAJ; Perpol 5/2021
          x-ion-cross-schema-condition: true
          x-ion-condition: Required when role=DRIVER
      x-ion-closed-extensions: false
