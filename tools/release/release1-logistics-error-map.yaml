reasons:
  unsupported-address-attempt-branch: Address-change and reschedule sub-branches were not included in the Release 1 delivery-attempts variant.
  informational-not-error: The legacy entry reports a successful or predictive condition and must be expressed as status, alert, or documentation rather than an error response.
  missing-dimension-limit: Release 1 models package dimensions but does not define an Offer-level maximum-dimensions constraint.
  cod-deferred: The cash-on-delivery variant is deferred pending an authoritative remittance-terms policy.
  business-tax-schema-missing: The migrated Logistics flow does not define the asserted business-tax or invoice-validation field and lifecycle.
  ekyc-deferred: The Logistics eKYC variant and its policy terms are deferred.
  cross-bpp-authorization-missing: Release 1 has no governed cross-BPP dispatch authorization or registry-binding contract.
  unsupported-raise-action: The recovery path requires the undefined raise action family.
  dimension-dispute-deferred: Release 1 includes a weight-dispute policy and flow, not an equivalent dimensional-dispute contract.
  cold-chain-deferred: The cold-chain execution variant is deferred pending approved temperature-policy semantics.
  customs-remediation-deferred: The customs remediation and appeals variant is deferred.
  regulatory-rule-unavailable: The schema can carry evidence, but Release 1 has no maintained rule source establishing when this jurisdiction-specific requirement applies.
  roro-rebooking-deferred: The missed-sailing rebooking flow remains a planned state-machine integration point.
  warehouse-branch-deferred: The required warehouse dispatch, value-added-service, expiry, or discrepancy branch is not published in Release 1.
  fwa-deferred: Framework-agreement activation, scope, volume, credit, and reporting semantics are not defined by an included Release 1 flow.
  participant-rule-unavailable: The asserted participant-to-subscriber or mandatory-role rule is not established by the included flow and schema set.
  payment-offer-missing: Release 1 has payment declarations but no Logistics Offer field listing accepted prepaid payment methods.
  driver-safety-schema-missing: The included incident flow intentionally excludes inline driver-safety status and employment/insurance governance.
  cross-sector-error: The condition concerns protocol transport, authentication, registry, or generic feature handling and should not be duplicated as a Logistics-sector error.
