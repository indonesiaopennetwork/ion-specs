type: EVIDENCE_POLICY
sector: logistics
appliesTo:
- damage-claim
- loss-claim
requirements:
  damage-claim:
  - type: PHOTO
    count: minimum 2
    within: PT24H
    metadata:
    - timestamp
    - gps
    description: 'At least 2 photos of the damaged item and packaging, submitted within
      24 hours of delivery

      '
  loss-claim:
  - type: LAST_KNOWN_SCAN
    source: carrier-tracking
  - type: NON_RECEIPT_DECLARATION
    signedBy: consignee
    within: PT48H
disputeWindow:
  damageClaim: PT24H_after_delivery
  lossClaim: P7D_after_last_known_scan
iri: ion://policy/evidence.standard.photo-24hr
displayText:
  id: Bukti standar — foto dalam 24 jam
  en: evidence.standard.photo-24hr
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

