iri: ion://policy/rts-handoff.standard
version: 1.0.0
versionEffectiveFrom: null
category: RTS_HANDOFF
status: draft
sector: logistics
displayText:
  id: Serah terima siap dikirim standar
  en: Standard ready-to-ship handoff
applicableCategories:
- logistics
applicableResourceTypes: []
regulatoryBasis: []
sourceProvenance:
  repository: indonesiaopennetwork/ion-specs
  commit: 33e6b4c40feabecf6b0f6a827b488ff82998c735
  path: policies/rts-handoff/v1/standard.yaml
  legacyId: rts-handoff.standard
supersededBy: null
deprecatedAt: null
description: 'Standard RTS handoff terms. Governs how long BPPs have to respond to
  an RTS signal, what happens on timeout, and evidence requirements.

'
scenarios:
  sellerDirect:
    description: B2C/B2B seller signalling RTS
    bapToBppAckWindow: PT5M
    rtsToPickupDispatchWindow: PT30M
  warehouseSameBpp:
    description: Integrated warehouse + transport, same BPP
    internalHandoffWindow: PT5M
    rtsToPickupDispatchWindow: PT15M
  warehouseCrossBpp:
    description: Warehouse BPP and transport BPP are different entities
    warehouseToGatewayWindow: PT2M
    gatewayToTransportBppWindow: PT3M
    transportAckWindow: PT15M
    totalHandoffWindow: PT20M
    rtsToPickupDispatchWindow: PT30M
evidenceRequirements:
  sellerDirect:
    required:
    - readyToShipTimestamp
    - readyToShipBy
    - confirmedPickupWindow
    - rtsPickupToken
  warehouseSameBpp:
    required:
    - readyToShipTimestamp
    - readyToShipBy
    - parentWarehouseContractRef
    - rtsPickupToken
  warehouseCrossBpp:
    required:
    - readyToShipTimestamp
    - readyToShipBy
    - parentWarehouseContractRef
    - dispatchOriginWarehouseBppId
    - rtsPickupToken
    - rtsNotificationRouting.handoffEvidence.warehouseConfirmedAt
    - rtsNotificationRouting.handoffEvidence.transportAcknowledgedAt
    - rtsNotificationRouting.handoffEvidence.rtsAcknowledgementRef
onTimeoutActions:
  warehouseCrossBpp:
  - notifyBap: true
  - notifyWarehouseBpp: true
  - errorCode: ION-LOG-6108
  - manualInterventionRequired: true
  - allowRetryAfter: PT5M
