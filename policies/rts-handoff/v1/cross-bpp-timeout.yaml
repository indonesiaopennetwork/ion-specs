description: 'Extended timeout variant for cross-BPP RTS where the transport BPP is
  known to have longer acknowledgment cycles (e.g. batch-oriented LSPs or legacy integrations).
  Typically overrides standard on FWA.

'
scenarios:
  warehouseCrossBpp:
    description: Cross-BPP with extended acknowledgment window
    warehouseToGatewayWindow: PT2M
    gatewayToTransportBppWindow: PT3M
    transportAckWindow: PT60M
    totalHandoffWindow: PT65M
    rtsToPickupDispatchWindow: PT90M
onTimeoutActions:
  warehouseCrossBpp:
  - notifyBap: true
  - notifyWarehouseBpp: true
  - errorCode: ION-LOG-6108
  - escalationPath: ion://policy/dispute.commercial.odr
