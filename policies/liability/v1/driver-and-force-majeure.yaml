type: LIABILITY_POLICY
sector: logistics
description: 'Driver/rider insurance coverage — distinct from cargo insurance. Covers
  accidents, medical, disability, and death for drivers while on duty.

  '
coverage:
  accidentalDeath:
    amount: 100000000
    currency: IDR
  permanentDisability:
    amount: 100000000
    currency: IDR
  medicalExpenses:
    amount: 25000000
    currency: IDR
  temporaryDisabilityDaily:
    amount: 200000
    maxDays: 90
vehicleInsurance:
  thirdPartyLiability: true
  ownDamage: CONDITIONAL
  theft: true
claimProcess:
  initiatedBy: DRIVER_OR_LSP
  timeline:
    reportIncident: PT15M
    submitClaim: P3D
    insurerAssessment: P7D
    settlement: P14D
excludes:
- DUI_OR_INTOXICATION
- WILFUL_MISCONDUCT
- OPERATING_WITHOUT_LICENCE
iri: ion://policy/liability.driver-insurance-coverage
displayText:
  id: Asuransi pengemudi dan force majeure
  en: Driver/rider insurance coverage — distinct from cargo insurance. Covers accidents,
    medical, disability, and death for drivers while on duty.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

---

type: LIABILITY_POLICY
sector: logistics
description: 'Force majeure clause — defines conditions under which LSP and BAP liabilities
  are suspended and SLA penalties waived.

  '
forceMajeureEvents:
- FLOOD
- EARTHQUAKE
- VOLCANIC_ERUPTION
- TSUNAMI
- HURRICANE_TYPHOON
- WILDFIRE
- CIVIL_UNREST
- TERRORISM
- WAR
- PANDEMIC_LOCKDOWN
- STRIKE_GENERAL
- GOVERNMENT_ACTION
- CYBER_ATTACK_REGIONAL
- POWER_GRID_FAILURE_EXTENDED
declaration:
  by: BPP_OR_BAP
  via: /update with type=FORCE_MAJEURE
  evidenceRequired:
  - BMKG_METEOROLOGY_REPORT
  - GOVERNMENT_ANNOUNCEMENT
  - MEDIA_REPORTS
  - AFFECTED_AREA_MAP
consequences:
  slaPenaltiesWaived: true
  cancellationFeesWaived: true
  cargoInsuranceApplicable: CHECK_POLICY
  driverInsuranceApplicable: true
resolution:
  extensionGrantedDays: 14
  reviewAfterDays: 7
  terminationRight: EITHER_PARTY
iri: ion://policy/liability.force-majeure-exclusions
displayText:
  id: Pengecualian force majeure
  en: Force majeure clause — defines conditions under which LSP and BAP liabilities
    are suspended and SLA penalties waived.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null
