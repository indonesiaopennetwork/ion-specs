description: 'A shipment is declared lost when there has been no scan event for more
  than 72 hours AND the last known scan was before the OUT_FOR_DELIVERY state.

  '
maximumLiabilityPerShipment: 50000000
currency: IDR
liabilityBasis: LESSER_OF_DECLARED_VALUE_OR_MAXIMUM
claimProcess:
  initiatedBy: BAP (after threshold elapsed)
