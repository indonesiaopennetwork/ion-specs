type: INCIDENT_POLICY
sector: logistics
description: 'Escalation procedures for SEVERE and CRITICAL incidents. Includes mandatory
  regulator notification for hazmat/cold-chain incidents.

  '
mandatoryNotifications:
  hazmatIncident:
    regulator: KEMENHUB
    within: PT24H
  coldChainFailure:
    regulator: BPOM
    within: PT12H
  fatality:
    regulator: POLICE
    within: PT2H
reportingFields:
- incidentDetail.severity
- incidentDetail.injuryCount
- incidentDetail.fatalityCount
- incidentDetail.cargoImpactEstimated
- incidentDetail.regulatorNotificationRef
iri: ion://policy/incident.high-severity-escalation
displayText:
  id: Eskalasi insiden keparahan tinggi
  en: Escalation procedures for SEVERE and CRITICAL incidents. Includes mandatory
    regulator notification for hazmat/cold-chain incidents.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
