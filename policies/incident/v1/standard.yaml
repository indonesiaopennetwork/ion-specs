type: INCIDENT_POLICY
sector: logistics
description: 'Standard incident reporting and resolution policy for logistics operations.
  Covers accidents, breakdowns, robbery, medical emergencies, and force majeure.

  '
reportingRequirements:
  driverSafetyStatusWithin: PT15M
  policeReportWithin: P1D
  insuranceClaimWithin: P3D
  bapNotificationWithin: PT15M
severityClassification:
  MINOR:
    examples:
    - minor accident without injury
    - tire breakdown
    cargoImpact: NONE_OR_MINIMAL
    slaImpact: DELAY_ONLY
  MODERATE:
    examples:
    - accident with minor injuries
    - significant delay
    cargoImpact: PARTIAL
    slaImpact: LIKELY_BREACH
  SEVERE:
    examples:
    - serious accident
    - armed robbery
    cargoImpact: SIGNIFICANT
    slaImpact: BREACH
    triggersLossClaim: true
  CRITICAL:
    examples:
    - fatality
    - total vehicle loss
    - cargo fire
    cargoImpact: TOTAL
    slaImpact: FULL_FAILURE
    triggersLossClaim: true
    escalationRequired: true
escalation:
  whenSeverity:
  - SEVERE
  - CRITICAL
  path: ion://policy/dispute-resolution.commercial-odr
  timeline: P7D
iri: ion://policy/incident.standard
displayText:
  id: Kebijakan insiden standar — pelaporan dan penyelesaian
  en: Standard incident reporting and resolution policy for logistics operations.
    Covers accidents, breakdowns, robbery, medical emergencies, and force majeure.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

