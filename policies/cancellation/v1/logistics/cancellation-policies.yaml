type: CANCELLATION_POLICY
sector: logistics
description: 'Buyer cancels because LSP has breached the committed TAT (SLA). LSP
  bears all costs. Full refund to buyer. SLA penalty applies per slaPolicy.

  '
window:
  from: on_confirm
  until: on_status[DELIVERED]
triggerCondition: 'Current timestamp > estimated_delivery_time AND delivery not yet
  completed

  '
fees:
  allChargesWaived: true
refund:
  prepaidOrders: FULL_REFUND
  timeline: PT12H
attribution: LSP
rtoTriggered: true
slaBreachPenaltyApplies: true
iri: ion://policy/cancel.logistics.tat-breach-lsp-cost
displayText:
  id: Pembatalan karena pelanggaran TAT — biaya LSP
  en: Buyer cancels because LSP has breached the committed TAT (SLA). LSP bears all
    costs. Full refund to buyer. SLA penalty applies per slaPolicy.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null
