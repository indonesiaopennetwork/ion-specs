type: CANCELLATION_POLICY
sector: logistics
description: 'Buyer may cancel at no charge before the package is picked up by the
  LSP. After PICKED_UP state, this policy no longer applies.

  '
window:
  from: on_confirm
  until: on_status[OUT_FOR_PICKUP]
cancellationFee: 0
currency: IDR
refund:
  prepaidOrders: FULL_REFUND
  codOrders: NO_CHARGE
  timeline: PT24H
attribution: BUYER
rtoTriggered: false
iri: ion://policy/cancel.logistics.prepickup-free
displayText:
  id: Pembatalan logistik gratis sebelum pickup
  en: Buyer may cancel at no charge before the package is picked up by the LSP. After
    PICKED_UP state, this policy no longer applies.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

