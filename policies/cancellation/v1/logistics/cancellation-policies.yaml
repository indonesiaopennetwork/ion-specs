type: CANCELLATION_POLICY
sector: logistics
description: 'Cancellation after pickup. Buyer bears forward freight cost. Package
  is returned to origin (RTO). RTO freight charge applies.

  '
window:
  from: on_status[PICKED_UP]
  until: on_status[OUT_FOR_DELIVERY]
fees:
  forwardFreightCharged: true
  rtoFreightCharged: true
  description: Buyer pays forward + RTO freight
refund:
  declaredValueInsurance: REFUNDED
  timeline: P3D_after_RTO_delivery
attribution: BUYER
rtoTriggered: true
iri: ion://policy/cancel.logistics.intransit-buyer-cost
displayText:
  id: Pembatalan logistik dalam perjalanan — biaya pembeli
  en: Cancellation after pickup. Buyer bears forward freight cost. Package is returned
    to origin (RTO). RTO freight charge applies.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

