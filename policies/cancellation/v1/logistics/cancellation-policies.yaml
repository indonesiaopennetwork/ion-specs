type: CANCELLATION_POLICY
sector: logistics
description: 'Buyer may cancel before pickup but if a rider has already been dispatched
  to the pickup location (OUT_FOR_PICKUP state or later), a futile trip fee applies.
  Typically used by hyperlocal providers.

  '
window:
  from: on_confirm
  until: on_status[RIDER_AT_PICKUP]
feeStructure:
  beforeDispatch:
    fee: 0
  afterDispatch:
    fee: 5000
    currency: IDR
    description: Futile trip fee — rider already en route
refund:
  prepaidOrders: FULL_REFUND_MINUS_FEE
  timeline: PT24H
attribution: BUYER
rtoTriggered: false
iri: ion://policy/cancel.logistics.prepickup-futile-trip-fee
displayText:
  id: Pembatalan logistik dengan biaya perjalanan sia-sia
  en: Buyer may cancel before pickup but if a rider has already been dispatched to
    the pickup location (OUT_FOR_PICKUP state or later), a futile trip fee applies.
    Typ
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

