type: PENALTY_POLICY
sector: logistics
description: 'Applied when pickup fails because the consignor was not ready, not present,
  or the package was not prepared. Covers futile trip cost.

  '
triggerCondition:
  event: PICKUP_FAILED
  attribution: CONSIGNOR_FAULT
penaltyAmount:
  type: FLAT
  amount: 10000
  currency: IDR
  description: Futile trip fee — rider dispatched, nothing to pick up
mechanism: ADDED_TO_NEXT_INVOICE
appliedAt: pickup_failed_on_update
iri: ion://policy/penalty.logistics.pickup-failed-consignor-fault
displayText:
  id: Penalti pickup gagal — kesalahan pengirim
  en: Applied when pickup fails because the consignor was not ready, not present,
    or the package was not prepared. Covers futile trip cost.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null
