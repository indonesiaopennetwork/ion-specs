type: PENALTY_POLICY
sector: logistics
description: 'Applied when LSP fails to deliver within the committed TAT window. Computation
  based on percentage of base freight by delay duration.

  '
triggerCondition:
  event: DELIVERY_LATE
  definition: actual_delivery_timestamp > estimated_delivery_time
penaltyFormula:
  delay0to24h:
    rate: 0.05
    basis: base_freight_charge
    description: 5% of freight for up to 24 hours late
  delay24to48h:
    rate: 0.1
    basis: base_freight_charge
    description: 10% of freight for 24-48 hours late
  delayOver48h:
    rate: 0.2
    basis: base_freight_charge
    description: 20% of freight for over 48 hours late
excludes:
- FORCE_MAJEURE
- CUSTOMS_HOLD_BUYER_FAULT
- BUYER_NOT_AVAILABLE_AT_DELIVERY
- INCORRECT_ADDRESS_BY_BUYER
mechanism: DEDUCTED_FROM_SETTLEMENT
appliedAt: reconcile_step
iri: ion://policy/penalty.logistics.lsp-tat-breach
displayText:
  id: Penalti pelanggaran TAT oleh LSP
  en: Applied when LSP fails to deliver within the committed TAT window. Computation
    based on percentage of base freight by delay duration.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

---

type: PENALTY_POLICY
sector: logistics
description: 'Applied when LSP fails to remit COD collections within the agreed payment-terms
  window. Interest applies on the overdue amount.

  '
triggerCondition:
  event: COD_REMITTANCE_OVERDUE
  definition: remittance_date > agreed_remittance_schedule_date
penaltyFormula:
  dailyInterestRate: 0.001
  basis: overdue_cod_amount
  description: 0.1% per day on overdue COD balance
escalation:
  threshold: P7D_overdue
  action: RAISE_TO_NETWORK
mechanism: DEDUCTED_FROM_FUTURE_SETTLEMENT
appliedAt: next_settlement_cycle
iri: ion://policy/penalty.logistics.cod-remittance-late
displayText:
  id: Penalti keterlambatan remitansi COD
  en: Applied when LSP fails to remit COD collections within the agreed payment-terms
    window. Interest applies on the overdue amount.
version: 1.0.0
versionEffectiveFrom: '2026-05-01'
status: ratified
ratifiedAt: '2026-04-15'
supersededBy: null
deprecatedAt: null

