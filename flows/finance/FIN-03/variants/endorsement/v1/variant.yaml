id: ion-finance-variant-endorsement-v1
version: "1.0.0"
variantType: endorsement
sector: ion:finance
category: FIN-03
status: draft
description: >
  Mid-policy amendment (endorsement) sub-flow. Allows changes to
  active insurance policy details without cancellation. Endorsements
  may result in additional premium (endorsement premium) or premium
  refund (short-rate basis). All endorsements require insurer approval
  and generate an updated policy certificate.

appliesTo:
  - FNC-insurance

window:
  earliest: on_confirm
  latest: "on_status[EXPIRED]"

subBranches:

  add-on-endorsement:
    id: add-on-endorsement
    description: >
      Policyholder adds optional coverage mid-policy: zero depreciation,
      roadside assistance (RSA), personal accident, passenger liability, etc.
    steps:
      - step: add-on-request
        from: BAP
        to: BPP
        requiredFields:
          - message.endorsement.contractId
          - message.endorsement.type
          - message.endorsement.requestedAddOns[]
          - message.endorsement.effectiveDate

      - step: add-on-premium-quote
        from: BPP
        to: BAP
        direction: callback
        description: Insurer returns pro-rated additional premium.
        requiredFields:
          - message.endorsement.additionalPremiumIDR
          - message.endorsement.proratedBasis
          - message.endorsement.quoteValidUntil

      - step: add-on-confirmation
        from: BAP
        to: BPP
        requiredFields:
          - message.endorsement.acceptanceRef
          - message.endorsement.paymentRef
          - message.endorsement.additionalPremiumPaid

      - step: endorsement-issuance
        from: BPP
        to: BAP
        direction: callback
        requiredFields:
          - message.endorsement.endorsementNumber
          - message.endorsement.updatedCertificateUrl
          - message.endorsement.effectiveDate

  vehicle-details-amendment:
    id: vehicle-details-amendment
    description: >
      Change to vehicle registration details — license plate re-registration,
      address change affecting tariff zone, ownership transfer.
    steps:
      - step: amendment-request
        from: BAP
        to: BPP
        requiredFields:
          - message.endorsement.contractId
          - message.endorsement.type
          - message.endorsement.changedFields
          - message.endorsement.supportingDocuments[]
        conditionalFields:
          - field: message.endorsement.newTariffZone
            condition: required if address change affects tariff zone
          - field: message.endorsement.premiumAdjustmentIDR
            condition: returned by BPP if tariff zone change alters premium

  policyholder-details-amendment:
    id: policyholder-details-amendment
    description: >
      Change to policyholder personal details — contact information,
      beneficiary designation change, loss payee update.
    steps:
      - step: details-change-request
        from: BAP
        to: BPP
        requiredFields:
          - message.endorsement.contractId
          - message.endorsement.type
          - message.endorsement.updatedParticipantData

  cancellation-endorsement:
    id: cancellation-endorsement
    description: >
      Policy cancellation after on_confirm (mid-policy). Short-rate premium
      refund applied per cancellation policy. BPKB-linked policies (KKB bancassurance)
      require lender consent before cancellation.
    refundCalculation:
      method: SHORT_RATE
      basis: "Earned premium retained proportional to days covered + short-rate penalty"
    steps:
      - step: cancellation-request
        from: BAP
        to: BPP
        requiredFields:
          - message.endorsement.contractId
          - message.endorsement.type
          - message.endorsement.cancellationReason
          - message.endorsement.cancellationDate
        conditionalFields:
          - field: message.endorsement.lenderConsentRef
            condition: required if policy has a designated lender loss payee

      - step: cancellation-refund-quote
        from: BPP
        to: BAP
        direction: callback
        requiredFields:
          - message.endorsement.refundAmountIDR
          - message.endorsement.shortRatePenaltyIDR
          - message.endorsement.earnedPremiumIDR

      - step: cancellation-confirmation
        from: BPP
        to: BAP
        direction: callback
        requiredFields:
          - message.endorsement.endorsementNumber
          - message.endorsement.cancellationCertificateUrl
          - message.endorsement.refundTransactionRef

policyReferences:
  - ion://policy/finance/insurance/endorsement/v1
  - ion://policy/finance/insurance/cancellation/v1

errors:
  - ION-FIN-7040  # Endorsement request conflicts with active claim
  - ION-FIN-7041  # Tariff zone not available for requested address
  - ION-FIN-7042  # Lender consent required before cancellation
  - ION-FIN-7043  # Add-on not available for this vehicle type or product type
