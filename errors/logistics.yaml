# ION Error Registry — Logistics (ION-Bxxx)
# Errors for all logistics patterns and variants.
# Code format: ION-B{category_range}{sequence}
# Category ranges:
#   ION-B1xxx: Serviceability, eKYC, compliance, RTS handoff, cut-off
#   ION-B2xxx: Delivery attempts
#   ION-B3xxx: Weight/dimension disputes
#   ION-B4xxx: Cancellation
#   ION-B5xxx: Cold chain
#   ION-B6xxx: Customs / cross-border
#   ION-B7xxx: RoRo / vessel
#   ION-B8xxx: Warehouse
#   ION-B9xxx: Framework agreements (FWA)
#   ION-B10xxx: Participants
#   ION-B11xxx: Payment
#   ION-B12xxx: Incident
#   ION-B13xxx: SLA / state dwell
#   ION-B14xxx: Carbon reporting
#   ION-B15xxx: Transport / system
#   ION-B16xxx: Registry
# Legacy ION-LOG-Nxxx codes are retained in legacy_code field for migration.

