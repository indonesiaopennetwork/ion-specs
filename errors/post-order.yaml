- code: ION-5001
  http_status: 400
  category: post-order
  title:
    id: Pembatalan tidak diizinkan setelah status ini
    en: Cancellation not allowed after current state
  description:
    en: Buyer attempted to cancel after the performance state has passed the cancellation
      window declared in the offer's policies.cancellation.policyRef.
  affected_field: offerAttributes.policies.cancellation.policyRef
  affected_apis:
  - cancel
  - on_cancel
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Offer
  flow_ref: null
  resolution:
    en: Enforce cancellation window in BAP UI. Check cancellationFeeApplicableStates
      — if current state is in this list, fee applies.
- code: ION-5002
  http_status: 400
  category: post-order
  title:
    id: Alasan pembatalan tidak valid
    en: Cancellation reason not accepted by seller
  description:
    en: The cancellation reason code sent is not in the seller's declared policies.cancellation.allowedReasons
      list.
  affected_field: offerAttributes.policies.cancellation.allowedReasons
  affected_apis:
  - cancel
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Offer
  flow_ref: null
  resolution:
    en: Only send cancellation reasons that are in the offer's policies.cancellation.allowedReasons.
      Display these reasons to consumer in the cancellation flow.
- code: ION-5007
  http_status: 403
  category: post-order
  title:
    id: Pelanggaran SLA — penalti diterapkan
    en: SLA breach — penalty applied
  description:
    en: 'BPP breached declared SLA. Penalty deduction applied at reconcile time per
      ION network penalty schedule.

      '
  affected_field: reconcile.slaPenaltyDeduction
  affected_apis:
  - reconcile
  schema_ref: schema/extensions/core/reconcile/v1
  resolution:
    en: BPP may dispute via raise channel if breach attribution is incorrect.
- code: ION-5008
  http_status: 403
  category: post-order
  title:
    id: Aksi tidak diizinkan oleh policy
    en: Action not permitted by declared policy
  description:
    en: 'Request attempted an action outside the bounds of the declared policy IRI.
      Examples: cancelling past cancellationWindowCloses state, returning outside
      returnWindowDays (from policies.returns.policyRef IRI), requesting refund when refundAfterQC=false
      before QC. ION resolves the policy IRI and applies the terms document as enforcement.

      '
  affected_field: offerAttributes.{policy}
  affected_apis:
  - cancel
  - update
  schema_ref: policies/registry.json
  flow_ref: policies/
  resolution:
    en: Read the policy terms document for the declared IRI. Respect the window/reason/condition
      constraints it specifies.
- code: ION-5009
  http_status: 409
  category: post-order
  title:
    id: SLA dilanggar - eskalasi otomatis
    en: SLA violated - auto escalation triggered
  description:
    en: 'Grievance SLA policy''s firstResponseSla or resolutionSla was breached. ION
      Central has auto-escalated to the next level in the policy''s escalationLevels
      and queued the linked penalty policy for application at reconcile time.

      '
  affected_field: support.escalationLevel
  affected_apis:
  - on_raise
  schema_ref: schema/extensions/core/support/v1
  flow_ref: policies/grievance-sla/v1/
  resolution:
    en: Respond to tickets within declared firstResponseSla. SLA breaches compound
      - repeat offenders face harsher penalties.
- code: ION-5010
  http_status: 451
  category: post-order
  title:
    id: Verifikasi umur gagal saat pengiriman
    en: Age verification failed at delivery
  description:
    en: 'Delivery agent could not verify buyer age for age-restricted item. Reasons
      include buyer underage, refused to show ID, no valid ID, or biometric API failure.
      Delivery fails; RTO initiates.

      '
  affected_field: message.contract.performance[].performanceAttributes.ageVerificationFailedReason
  affected_apis:
  - on_status
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Performance
  flow_ref: null
  resolution:
    en: Initiate RTO flow. Buyer may be restricted from future purchases of this category
      per platform policy.
- code: ION-5011
  http_status: 451
  category: post-order
  title:
    id: Pelanggaran residensi data
    en: Data residency violation
  description:
    en: 'A BAP or BPP processing foreign infrastructure attempted to transact a resource
      with dataResidency=DOMESTIC_ONLY. Transaction refused. Required for pharmacy,
      health data, financial services under UU 27/2022.

      '
  affected_field: message.contract.commitments[].resources[].resourceAttributes.dataResidency
  affected_apis:
  - select
  - init
  - confirm
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Resource
  resolution:
    en: BAP must confirm domestic-only data processing before attempting these transactions;
      otherwise filter such resources from discovery.
  flow_ref: null
