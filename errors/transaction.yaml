- code: ION-3001
  http_status: 400
  category: transaction
  title:
    id: Resource tidak ditemukan dalam katalog
    en: Resource not found in catalog
  description:
    en: The resourceId in the select payload does not exist in the current published
      catalog for this provider.
  affected_field: message.contract.commitments[].id
  affected_apis:
  - select
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Resource
  flow_ref: null
  resolution:
    en: Refresh catalog from /on_discover before sending /select. Do not cache resource
      IDs beyond catalog TTL.
- code: ION-3004
  http_status: 409
  category: transaction
  title:
    id: Resource tidak tersedia
    en: Resource not available
  description:
    en: The resource has availability.status of OUT_OF_STOCK or DISCONTINUED at the
      time of select.
  affected_field: resourceAttributes.availability.status
  affected_apis:
  - select
  - on_select
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Resource
  flow_ref: null
  resolution:
    en: Refresh catalog and display current availability status to consumer. Do not
      allow select on OUT_OF_STOCK or DISCONTINUED items.
- code: ION-3005
  http_status: 400
  category: transaction
  title:
    id: Kuantitas melebihi batas maksimum per pesanan
    en: Quantity exceeds maxOrderQty
  description:
    en: The quantity requested in select exceeds the maxOrderQty declared in the resource
      availability.
  affected_field: message.contract.commitments[].resources[].quantity.count
  affected_apis:
  - select
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Commitment
  flow_ref: null
  resolution:
    en: Respect maxOrderQty from the availability signal. Display this limit to the
      consumer before checkout.
- code: ION-3006
  http_status: 400
  category: transaction
  title:
    id: Metode pembayaran tidak tersedia untuk produk ini
    en: Payment method not available for this product
  description:
    en: The selected payment method is not eligible for this offer. e.g. COD not available
      (availableOnCod=false) or BNPL not in paymentMethodEligibility.
  affected_field: offerAttributes.availableOnCod
  affected_apis:
  - init
  - on_init
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Offer
  flow_ref: null
  resolution:
    en: Check availableOnCod and paymentMethodEligibility from the offer before presenting
      payment options to consumer.
- code: ION-3013
  http_status: 410
  category: transaction
  title:
    id: Jendela reservasi stok kedaluwarsa
    en: Item reservation window expired
  description:
    en: 'The on_select quote and stock reservation has expired. BAP sent /confirm
      after the BPP''s declared reservationWindowSeconds elapsed.

      '
  affected_field: message.contract.commitments[].offer.reservationWindowSeconds
  affected_apis:
  - confirm
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Offer
  flow_ref: null
  resolution:
    en: Restart transaction from /select. Stock and pricing must be re-quoted.
- code: ION-3014
  http_status: 409
  category: transaction
  title:
    id: Barang terjual saat transaksi
    en: Item sold out during transaction
  description:
    en: 'Between on_select and confirm, another transaction exhausted the available
      stock. Race-condition loser case.

      '
  affected_field: message.contract.commitments[].resources[].quantity.count
  affected_apis:
  - confirm
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Resource
  flow_ref: null
  resolution:
    en: Display out-of-stock message to consumer. Offer alternative products.
- code: ION-3016
  http_status: 403
  category: transaction
  title:
    id: COD tidak tersedia untuk pembeli
    en: COD not eligible for this buyer
  description:
    en: 'Offer supports COD (availableOnCod=true) but the specific buyer has been
      declined COD — new buyer, previous COD failure, address not verified, amount
      exceeds limit, or high-risk category.

      '
  affected_field: message.contract.commitments[].offer.codEligibilityForBuyer
  affected_apis:
  - on_select
  - init
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Offer
  flow_ref: null
  resolution:
    en: Prompt consumer to select prepaid payment method. Display codEligibilityReason.
- code: ION-3021
  http_status: 402
  category: transaction
  title:
    id: Milestone pembayaran gagal atau jatuh tempo
    en: Payment schedule milestone failed or overdue
  description:
    en: 'A scheduled payment milestone (down-payment, balance, etc.) failed to collect
      or is past dueAt + graceDays. Contract cannot progress until milestone is resolved.

      '
  affected_field: message.contract.contractAttributes.paymentSchedule[].status
  affected_apis:
  - confirm
  - on_status
  schema_ref: schema/core/v2/api/v2.0.0/beckn.yaml#Contract
  flow_ref: null
  resolution:
    en: Retry collection via /init with fresh payment method, or cancel with appropriate
      reason.
