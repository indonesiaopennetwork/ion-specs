- code: ION-2001
  http_status: 400
  category: catalog
  title:
    id: Ukuran katalog melebihi batas
    en: Catalog payload exceeds size limit
  description:
    en: The catalog payload exceeds the 10MB limit for a single publish_catalog call.
  affected_field: message.catalog
  affected_apis:
  - publish_catalog
  schema_ref: releases/release1/schema/core/api/v2.0.0/ion.yaml
  flow_ref: null
  resolution:
    en: Split catalog into multiple publish_catalog calls by category or provider
      location. Maximum 10MB per call.
- code: ION-2003
  http_status: 403
  category: catalog
  title:
    id: KYC penjual kedaluwarsa atau ditangguhkan
    en: Seller KYC expired or suspended
  description:
    en: 'Provider attempting catalog publish or transaction has verification.status of EXPIRED,
      SUSPENDED, or REJECTED. Catalog publish and new transactions blocked until KYC
      is renewed/restored.

      '
  affected_field: message.catalog.provider.providerAttributes.verification.status
  affected_apis:
  - publish_catalog
  - select
  - init
  - confirm
  schema_ref: releases/release1/schema/extension/trade/TradeProvider/v1
  resolution:
    en: Provider must complete KYC renewal. New transactions blocked until verification.status
      is APPROVED.
- code: ION-2004
  http_status: 451
  category: catalog
  title:
    id: Listing ditangguhkan — flag counterfeit
    en: Listing suspended — counterfeit flag under investigation
  description:
    en: 'Resource has an active COUNTERFEIT_FLAG raise ticket. Auto-delist applied
      pending ION Central arbitration. New transactions blocked.

      '
  affected_field: message.contract.commitments[].id
  affected_apis:
  - select
  - init
  - confirm
  schema_ref: schema/extensions/core/raise/v1
  resolution:
    en: Wait for arbitration resolution. Provider may respond to raise ticket with
      evidence.
- code: ION-2005
  http_status: 403
  category: catalog
  title:
    id: Lisensi kategori hilang atau kedaluwarsa
    en: Category license missing or expired
  description:
    en: 'Provider operating in regulated category (pharmacy, alcohol, tobacco, meat)
      does not have valid categoryLicenses entry for the required license type.

      '
  affected_field: message.catalog.provider.providerAttributes.categoryLicenses
  affected_apis:
  - publish_catalog
  schema_ref: releases/release1/schema/common/BusinessRegistration/v1
  resolution:
    en: Upload current license certificate with validUntil in future. Renew via relevant
      authority (BPOM, Kemendag).
